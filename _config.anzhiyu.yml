menu:
   文章: # 文章菜单组
     时间轴: /archives/ || anzhiyu-icon-box-archive # 存档（隧道）
     分类: /categories/ || anzhiyu-icon-shapes # 分类
     标签: /tags/ || anzhiyu-icon-tags # 标签

   友链: # 友链菜单组
   #  友人帐: /link/ || anzhiyu-icon-link # 友人帐 (已注释掉)
     朋友圈: /fcircle/ || anzhiyu-icon-artstation # 朋友圈
     留言板: /comments/ || anzhiyu-icon-envelope # 留言板

   我的: # 我的菜单组
     音乐馆: /music/ || anzhiyu-icon-music # 音乐馆
     追番页: /bangumis/ || anzhiyu-icon-bilibili # 追番页 (已注释掉)
     相册集: /album/ || anzhiyu-icon-images # 相册集 (已注释掉)
     小空调: /air-conditioner/ || anzhiyu-icon-fan # 小空调

   关于: # 关于菜单组
     关于本人: /about/ || anzhiyu-icon-paper-plane # 关于本人
    # 闲言碎语: /essay/ || anzhiyu-icon-lightbulb # 闲言碎语
     随便逛逛: javascript:toRandomPost() || anzhiyu-icon-shoe-prints1 # 随便逛逛 (执行JS函数)
   #  我的装备: /equipment/ || anzhiyu-icon-dice-d20
# nav相关配置 (顶部导航栏相关配置)
nav:
  enable: false # 是否启用顶部导航栏
  travelling: false # 是否启用“开往”按钮
  clock: true # 是否启用时钟
  menu: # 导航栏菜单项
    - title: 网页 # 菜单组标题
      item: # 菜单组下的项目
        - name: 博客 # 项目名称
          link: https://blog.anheyu.com/ # 项目链接
          icon: /img/favicon.ico # 项目图标
    - title: 项目
      item:
        - name: 安知鱼图床
          link: https://image.anheyu.com/
          icon: https://image.anheyu.com/favicon.ico

# mourn （哀悼日，指定日期网站简单变灰，不包括滚动条）
# 注意： 仅网站首页变灰，其他页面正常显示
mourn:
  enable: false # 是否启用哀悼模式
  days: [4-5, 5-12, 7-7, 9-18, 12-13] # 变灰的日期列表 (格式: 月-日)

# Code Blocks (代码相关)
# --------------------------------------

highlight_theme: light # 高亮主题: darker / pale night / light / ocean / mac / mac light / false (false为不启用主题)
highlight_copy: true # 是否显示复制按钮
highlight_lang: true # 是否显示代码语言
highlight_shrink: false # true: 收缩代码块 / false: 展开代码块 | none: 展开代码块并隐藏按钮
highlight_height_limit: 330 # 代码块最大高度限制, 单位: px
code_word_wrap: false # 代码块是否自动换行

# copy settings (复制设置)
# copyright: Add the copyright information after copied content (複製的内容后面加上版权信息)
# copy: enable 复制后弹窗提示版权信息
copy:
  enable: true # 是否启用复制相关功能
  copyright: # 复制内容后追加版权信息
    enable: false # 是否启用
    limit_count: 50 # 复制内容字符数达到此值才追加版权信息

# social settings (社交图标设置)
# formal: (格式:)
#   name: link || icon (名称: 链接 || 图标)
social:
  # Github: https://github.com/anzhiyu-c || anzhiyu-icon-github # (示例：已注释掉)
  # BiliBili: https://space.bilibili.com/372204786 || anzhiyu-icon-bilibili # (示例：已注释掉)

# 作者卡片 状态
author_status:
  enable: true # 是否启用作者状态
  # 可以是任何图片，建议放表情包或者emoji图片，效果都很好，[表情包速查](https://emotion.xiaokang.me/)
  statusImg: "https://bu.dusays.com/2023/08/24/64e6ce9c507bb.png" # 状态图片链接
  skills: # 技能列表
     - 🤖️ 数码科技爱好者
     - 🔍 分享与热心帮助
    # - 🏠 智能家居小能手
    # - 🔨 设计开发一条龙
    # - 🤝 专修交互与设计
     - 🏃 脚踏实地行动派
    # - 🧱 团队小组发动机
    # - 💢 壮汉人狠话不多

# search (搜索)
# see https://blog.anheyu.com/posts/c27d.html#搜索系统 (参见...)
# --------------------------------------

# Algolia search (Algolia 搜索)
algolia_search:
  enable: false # 是否启用 Algolia 搜索
  hits:
    per_page: 6 # 每页显示结果数
  tags: # 搜索标签过滤 (示例)
    # - 前端
    # - Hexo

# Docsearch
# Apply and Option Docs: see https://docsearch.algolia.com/ (申请和选项文档：参见...)
# Crawler Admin Console: see https://crawler.algolia.com/ (爬虫管理控制台：参见...)
# Settings: https://www.algolia.com/ (设置：...)
docsearch:
  enable: false # 是否启用 DocSearch
  appId: # see email (参见邮件获取)
  apiKey: # see email (参见邮件获取)
  indexName: # see email (参见邮件获取)
  option: # 其他选项

# Local search (本地搜索)
local_search:
  enable: true # 是否启用本地搜索
  preload: true # 是否预加载搜索数据
  CDN: # CDN 地址 (若使用)

# Math (数学公式)
# --------------------------------------
# About the per_page (关于 per_page 选项)
# if you set it to true, it will load mathjax/katex script in each page (true 表示每一页都加载js)
# (如果设置为 true, 它将在每个页面加载 mathjax/katex 脚本 (true 表示每一页都加载js))
# if you set it to false, it will load mathjax/katex script according to your setting (add the 'mathjax: true' in page's front-matter)
# (如果设置为 false, 它将根据您的设置加载 mathjax/katex 脚本 (需要在页面的 front-matter 中添加 'mathjax: true'))
# (false 需要时加载，须在使用的 Markdown Front-matter 加上 mathjax: true)

# MathJax
mathjax:
  enable: false # 是否启用 MathJax
  per_page: false # 是否每页加载 (false 则按需加载)

# KaTeX
katex:
  enable: false # 是否启用 KaTeX
  per_page: false # 是否每页加载
  hide_scrollbar: true # 是否隐藏滚动条 (当公式过长时)

# Image (图片设置)
# --------------------------------------

# Favicon（网站图标）
favicon: /favicon.ico # 网站图标路径

# Avatar (头像)
avatar:
  img: /img/tx.gif
  effect: true # 是否启用头像特效 (如旋转)

# Disable all banner image (禁用所有顶部横幅图片)
disable_top_img: false # 是否禁用所有页面的顶部图片

# The banner image of home page (首页的顶部横幅图片)
index_img: false # 首页顶部图片路径或 CSS 背景值, false 表示使用默认或主题设定

# If the banner of page not setting, it will show the top_img (如果页面的顶部横幅未设置, 将显示此默认顶部图片)
default_top_img: false # 默认的页面顶部图片路径, false 表示使用主题设定

cover:
  # display the cover or not (是否显示文章封面)
  index_enable: true # 首页是否显示文章封面
  aside_enable: true # 侧边栏是否显示文章封面 (如最新文章)
  archives_enable: true # 归档页是否显示文章封面
  # the position of cover in home page (封面显示的位置)
  # left/right/both (左侧/右侧/两侧)
  position: left # 首页文章封面显示位置
  # When cover is not set, the default cover is displayed (当没有设置cover时，默认的封面显示)
  default_cover: # 默认封面图片列表 (可设置多个随机显示)
   # - /img/default_cover.jpg

# Replace Broken Images (替换无法显示的图片)
error_img:
  flink: /img/friend_404.gif # 友链链接图片加载失败时显示的图片
  post_page: /img/404.jpg # 文章内图片加载失败时显示的图片

# A simple 404 page (一个简单的404页面)
error_404:
  enable: true # 是否启用自定义404页面
  subtitle: "请尝试站内搜索寻找文章" # 404页面副标题
  background: https://bu.dusays.com/2023/05/08/645907596997d.gif # 404页面背景图片

post_meta: # 文章元数据设置
  page: # Home Page (首页文章列表的元数据)
    date_type: created # created (创建日期) or updated (更新日期) or both (两者都显示) 主页文章日期是创建日或者更新日或都显示
    date_format: simple # date (具体日期)/relative (相对日期)/simple (简单日期) 显示日期还是相对日期 或者 简单日期
    categories: true # true or false 主页是否显示分类
    tags: true # true or false 主页是否显示标籤
    label: true # true or false 显示描述性文字 (如“置顶”)
  post: # 文章页的元数据
    date_type: both # created or updated or both 文章页日期是创建日或者更新日或都显示
    date_format: date # date/relative 显示日期还是相对日期
    categories: true # true or false 文章页是否显示分类
    tags: true # true or false 文章页是否显示标籤
    label: true # true or false 显示描述性文字
    unread: true # true or false 文章未读功能 (可能需要配合特定插件)

# 主色调相关配置
mainTone:
  enable: true # true or false 文章是否启用获取图片主色调
  mode: api # cdn/api/both cdn模式为图片url+imageAve参数获取主色调，api模式为请求API获取主色调，both模式会先请求cdn参数，无法获取的情况下将请求API获取，可以在文章内配置main_color: '#3e5658'，使用十六进制颜色，则不会请求both/cdn/api获取主色调，而是直接使用配置的颜色
  # 项目地址：https://github.com/anzhiyu-c/img2color-go
  api: https://img2color-go.vercel.app/api?img= # mode为api时可填写 (API接口地址)
  cover_change: true # 整篇文章跟随cover修改主色调 (如卡片背景色)

# wordcount (字数统计)————————！！！！会报错 (如果报错，请检查插件或配置)
# see https://blog.anheyu.com/posts/c27d.html(参见...)
wordcount:
  enable: true # 是否启用字数统计
  post_wordcount: true # 文章页是否显示字数
  min2read: true # 是否显示预计阅读时间
  total_wordcount: true # 是否显示全站总字数 (通常在页脚)

# Display the article introduction on homepage (在首页显示文章简介)
# 1: description (使用文章 Front-matter 中的 description)
# 2: both (if the description exists, it will show description, or show the auto_excerpt) (优先使用 description，若无则自动截取摘要)
# 3: auto_excerpt (default) (自动截取文章开头作为摘要，默认)
# false: do not show the article introduction (不显示文章简介)
index_post_content:
  method: 3 # 选择显示简介的方法
  length: 500 # if you set method to 2 or 3, the length need to config (如果方法设置为2或3, 此为摘要长度)

# anchor (锚点链接)
# when you scroll in post, the URL will update according to header id. (当您在文章中滚动时, URL将根据标题ID进行更新。)
anchor: false # 是否启用滚动时URL锚点更新

# Post (文章相关设置)
# --------------------------------------

# toc (目录 Table of Contents)
toc:
  post: true # 文章页是否显示目录
  page: false # 普通页面是否显示目录
  number: true # 目录是否显示编号
  expand: false # 是否默认展开所有目录项
  style_simple: false # for post (文章页目录是否使用简约样式)

post_copyright: # 文章版权声明
  enable: true # 是否启用
  decode: true # 是否对版权信息中的特殊字符进行解码 (如URL)
  author_href: # 作者链接 (留空则使用站点作者链接)
  location: 云南 # 创作地点
  license: CC BY-NC-SA 4.0 # 许可协议名称
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/ # 许可协议链接
  avatarSinks: false # hover时头像下沉 (鼠标悬停在作者头像上时头像是否下沉)
  copyright_author_img_back: # 版权区域作者图片背景 (URL)
  copyright_author_img_front: # 版权区域作者图片前景 (URL, 可用于叠加)
  copyright_author_link: / # 版权区域作者链接 (点击图片或名称跳转)

# Sponsor/reward(赞助/打赏，通常需要配置图片)
reward:
  enable: false
  QR_code:
    - img: 
      link:
      text: 微信
    - img: 
      link:
      text: 支付宝

# Post edit (文章编辑按钮)
# Easily browse and edit blog source code online. (方便地在线浏览和编辑博客源代码。)
post_edit: # 目前仅可选择一个平台在线编辑
  enable: false # 是否启用在线编辑按钮
  # github: https://github.com/user-name/repo-name/edit/branch-name/subdirectory-name/ (GitHub 编辑链接格式)
  # For example: https://github.com/jerryc127/butterfly.js.org/edit/main/source/ (例如)
  github: false # GitHub 编辑链接

  # yuque: https://www.yuque.com/user-name/repo-name/ (语雀编辑链接格式)
  # 示例: https://www.yuque.com/yuque/yuque/
  # 你需要在语雀文章 Front Matter 添加参数 id 并确保其唯一性（例如 “id: yuque”, “id: 01”）
  yuque: false # 语雀编辑链接

# Related Articles (相关文章推荐)
related_post:
  enable: false # 是否启用相关文章推荐
  limit: 6 # Number of posts displayed (显示的文章数量)
  date_type: created # or created or updated 文章日期显示创建日或者更新日 (相关文章显示创建日期或更新日期)

# figcaption (图片描述文字)
photofigcaption: false # 是否为图片启用 figcaption (通常用于显示图片的 alt 或 title 文本)

# post_pagination (文章分页导航，即上一篇/下一篇)
# value: 1 || 2 || 3 || 4 || false (可选值)
# 1: The 'next post' will link to old post (“下一篇文章”将链接到较旧的文章)
# 2: The 'next post' will link to new post (“下一篇文章”将链接到较新的文章)
# 3: 只有下一篇，并且只在文章滚动到评论区时显示下一篇文章(旧文章)
# 4: 只有下一篇，并且只在文章滚动到评论区时显示下一篇文章(旧文章) 显示图片cover
# false: disable pagination (禁用分页导航)
post_pagination: false # 选择分页导航的模式

# Displays outdated notice for a post (文章过期提醒)
noticeOutdate:
  enable: true # 是否启用文章过期提醒
  style: flat # style: simple/flat (样式：简单/扁平)
  limit_day: 180 # When will it be shown (多少天未更新的文章会显示提醒)
  position: top # position: top/bottom (提醒显示位置：顶部/底部)
  message_prev: It has been # 提醒消息前缀 (例如：距离上次更新已有)
  message_next: days since the last update, the content of the article may be outdated. # 提醒消息后缀 (例如：天，文章内容可能已过时。)

# Share System (分享功能)
# --------------------------------------

# Share.js
# https://github.com/overtrue/share.js
sharejs:
  enable: true # 是否启用 Share.js 分享
  sites: wechat,weibo,qq #启用的分享站点 (微信,微博,QQ)

# AddToAny
# https://www.addtoany.com/
addtoany:
  enable: true # 是否启用 AddToAny 分享
  item: wechat,sina_weibo,email,copy_link # 启用的分享项 (微信,新浪微博,邮件,复制链接)

# Comments System (评论系统)
# --------------------------------------

comments:
  # Up to two comments system, the first will be shown as default (最多两个评论系统, 第一个将作为默认显示)
  # Choose: Valine/Waline/Twikoo/Artalk (选择评论系统)
  use: Twikoo # Twikoo/Waline (使用的评论系统，例如 Twikoo 或 Waline)
  text: true # Display the comment name next to the button (在切换评论的按钮旁边显示评论系统名称)
  # lazyload: The comment system will be load when comment element enters the browser's viewport. (当评论元素进入浏览器视口时加载评论系统。)
  # If you set it to true, the comment count will be invalid (如果设置为 true, 评论计数功能可能无效或不实时)
  lazyload: false # 是否懒加载评论系统
  count: false # Display comment count in post's top_img (在文章顶部图片中显示评论数)
  card_post_count: false # Display comment count in Home Page (在首页文章卡片上显示评论数)

# valine
# https://valine.js.org
valine:
  appId: xxxxx # leancloud application app id (LeanCloud 应用 App ID)
  appKey: xxxxx # leancloud application app key (LeanCloud 应用 App Key)
  pageSize: 10 # comment list page size (评论列表每页条数)
  avatar: mp # gravatar style https://valine.js.org/#/avatar (Gravatar 头像风格)
  lang: zh-CN # i18n: zh-CN/zh-TW/en/ja (国际化语言设置)
  placeholder: 填写QQ邮箱就会使用QQ头像喔~. # valine comment input placeholder (like: Please leave your footprints) (Valine 评论输入框占位符)
  guest_info: nick,mail,link # valine comment header info (nick/mail/link) (评论者信息字段：昵称/邮箱/网址)
  recordIP: false # Record reviewer IP (是否记录评论者IP)
  serverURLs: # This configuration is suitable for domestic custom domain name users, overseas version will be automatically detected (no need to manually fill in) (此配置适用于国内自定义域名用户, 海外版本将自动检测, 无需手动填写)
  bg: /img/comment_bg.png # valine background (Valine 评论区背景图片)
  emojiCDN: //i0.hdslb.com/bfs/emote/ # emoji CDN (Emoji CDN 地址)
  enableQQ: true # enable the Nickname box to automatically get QQ Nickname and QQ Avatar (启用昵称框自动获取QQ昵称和QQ头像)
  requiredFields: nick,mail # required fields (nick/mail) (必填字段：昵称/邮箱)
  visitor: false # 是否启用访客统计 (Valine自身的)
  master: #博主标识 (可填邮箱MD5)
    - xxxxx
  friends: #小伙伴标识 (可填邮箱MD5)
    - xxxxxx
  tagMeta: "博主,小伙伴,访客" #对应master, friends, 其他访客的标签
  option: # Valine 其他自定义选项

# waline - A simple comment system with backend support fork from Valine (Waline - 一个从Valine派生出来的、带后端的简单评论系统)
# https://waline.js.org/
waline:
  serverURL: # Waline server address url (Waline 服务器地址 URL)
  bg: # Waline background (Waline 评论区背景图片)
  pageview: false # 是否启用 Waline 的页面浏览量统计
  meta_css: false # 是否引入 waline-meta.css ,以便显示 meta图标 (如评论数图标)
  imageUploader: true # 配置为 > 换行后可自定义图片上传逻辑，示例: https://waline.js.org/cookbook/customize/upload-image.html#案例
  # 以下为可选配置，后续若有新增/修改配置参数可在此自行添加/修改
  option: # Waline 其他自定义选项

# Twikoo
# https://github.com/imaegoo/twikoo
twikoo:
  envId: #腾讯云开发环境 ID
  region: #环境地域 (如果不是上海，需要配置)
  visitor: false # 是否启用 Twikoo 的访客统计
  option: # Twikoo 其他自定义选项

# Artalk
# https://artalk.js.org/guide/frontend/config.html
artalk:
  server: # Artalk 后端服务地址
  site: # Artalk 站点名称
  visitor: false # 是否启用 Artalk 的访客统计
  option: # Artalk 其他自定义选项

# giscus
# https://giscus.app/
giscus:
  repo: # GitHub repository name (GitHub 仓库名称,格式 owner/repo)
  repo_id: # GitHub repository id (GitHub 仓库 ID)
  category_id: # GitHub repository category id (GitHub Discussions 分类 ID)
  theme: # giscus 主题
    light: light # 亮色模式下的主题
    dark: dark # 暗色模式下的主题
