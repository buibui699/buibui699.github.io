# 朋友圈配置
friends_vue:
  enable: true # 是否启用朋友圈页面 (通常指友情链接聚合页)
  vue_js: https://npm.elemecdn.com/anzhiyu-theme-static@1.1.1/friends/index.4f887d95.js # Vue.js 依赖 (朋友圈页面可能用Vue构建)
  apiurl: # 朋友圈后端地址 (用于获取友链文章数据)
