  js: https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js # Adsense JS 库
  client: # 您的 Adsense Publisher ID (ca-pub-XXXXXXXXXXXXXXXX)
  enable_page_level_ads: false # 是否启用网页级广告 (较旧的设置)

# Insert ads manually (手动插入广告，通常在模板文件中配置)
# ad:
#   index: (首页广告位代码)
#   aside: (侧边栏广告位代码)
#   post: (文章页广告位代码)

# Verification (站长工具验证)
# --------------------------------------
site_verification: # 验证代码列表
  - name: google-site-verification # Google Search Console 验证
    content: xxx # 验证代码的 content 值
  - name: baidu-site-verification # 百度搜索资源平台验证
    content: code-xxx # 验证代码的 content 值
  - name: msvalidate.01 # Bing Webmaster Tools 验证
    content: xxx # 验证代码的 content 值

# Beautify/Effect (美化/效果)
# --------------------------------------

# Theme color for customize (自定义主题颜色)
# Notice: color value must in double quotes like "#000" or may cause error! (注意: 颜色值必须使用双引号, 如 "#000", 否则可能导致错误!)
theme_color:
  enable: true # 是否启用自定义颜色
  main: "#425AEF" # 主题色 (亮色模式)
  dark_main: "#f2b94b" # 主题色 (暗色模式)
  paginator: "#425AEF" # 分页器颜色
  #   button_hover: "#FF7242" # 按钮悬停颜色 (已注释掉)
  text_selection: "#2128bd" # 文本选中背景色
  link_color: "var(--anzhiyu-fontcolor)" # 链接颜色 (可使用CSS变量)
  meta_color: "var(--anzhiyu-fontcolor)" # 元信息颜色 (可使用CSS变量)
  hr_color: "#4259ef23" # 水平分割线颜色
  code_foreground: "#fff" # 代码块前景(文字)颜色 (通常在深色背景代码块中使用)
  code_background: "var(--anzhiyu-code-stress)" # 代码块背景颜色 (可使用CSS变量)
  toc_color: "#425AEF" # 目录链接颜色
  #   blockquote_padding_color: "#425AEF" # 引用块左边框颜色 (已注释掉)
  #   blockquote_background_color: "#425AEF" # 引用块背景颜色 (已注释掉)
  scrollbar_color: "var(--anzhiyu-scrollbar)" # 滚动条颜色 (可使用CSS变量)
  meta_theme_color_light: "#f7f9fe" # PWA 或浏览器 UI 主题色 (亮色模式)
  meta_theme_color_dark: "#18171d" # PWA 或浏览器 UI 主题色 (暗色模式)

# 移动端侧栏
sidebar:
  site_data: # 站点数据展示
    archive: true # 是否显示归档链接
    tag: true # 是否显示标签链接
    category: true # 是否显示分类链接
  menus_items: true # 是否显示主菜单项
  tags_cloud: true # 是否显示标签云
  display_mode: true # 是否显示亮色/暗色模式切换按钮
  nav_menu_project: false # 是否显示顶部导航栏中配置的“项目”菜单 (nav.menu)

# 文章h2添加分隔线
h2Divider: true # 是否在文章的 H2 标题下自动添加分隔线

# 表格隔行变色
table_interlaced_discoloration: true # 是否启用表格的隔行变色效果

# 首页双栏显示
article_double_row: false  #首页文章列表是否双栏显示 (瀑布流或类似布局)

# The top_img settings of home page (首页顶部图片设置)
# default: top img - full screen, site info - middle (默认top_img全屏，site_info在中间)
# (默认: 顶部图片全屏, 站点信息居中)
# The position of site info, eg: 300px/300em/300rem/10% (主页标题距离顶部距离)
index_site_info_top: # 首页站点信息 (标题/副标题) 距离顶部的距离
# The height of top_img, eg: 300px/300em/300rem (主页top_img高度)
index_top_img_height: # 首页顶部图片的高度

# The user interface setting of category and tag page (category和tag页的UI设置)
# (分类页和标签页的UI设置)
# index - same as Homepage UI (index 值代表 UI将与首页的UI一样)
# (index - 与首页UI相同)
# default - same as archives UI 默认跟archives页面UI一样
# (default - 与归档页UI相同, 默认值)
category_ui: # 留空或 index (分类页UI风格, 留空为默认)
tag_ui: # 留空或 index (标签页UI风格, 留空为默认)

# Footer Background (页脚背景图片)
footer_bg: false # 页脚背景图片URL或CSS值, false表示不使用特定背景

# the position of bottom right button/default unit: px (右下角按钮距离底部的距离/默认单位为px)
rightside-bottom: 100px # 右下角功能按钮组距离页面底部的距离

# Background effects (背景特效)
# --------------------------------------

# canvas_ribbon (静止彩带背景)
# See: https://github.com/hustcc/ribbon.js (参见...)
canvas_ribbon:
  enable: false # 是否启用静止彩带背景
  size: 150 # 彩带大小
  alpha: 0.6 # 透明度
  zIndex: -1 # CSS z-index 层级
  click_to_change: false # 点击是否改变彩带
  mobile: false # 移动端是否启用

# Fluttering Ribbon (动态彩带)
canvas_fluttering_ribbon:
  enable: true # 是否启用动态彩带背景
  mobile: true # 移动端是否启用

# canvas_nest (粒子吸附线条背景)
# https://github.com/hustcc/canvas-nest.js
canvas_nest:
  enable: true # 是否启用粒子吸附线条背景
  color: "0,0,255" #color of lines, default: '0,0,0'; RGB values: (R,G,B).(note: use ',' to separate.) (线条颜色, 默认: '0,0,0'; RGB值: (R,G,B)。注意: 使用','分隔。)
  opacity: 0.7 # the opacity of line (0~1), default: 0.5. (线条透明度 (0~1), 默认: 0.5。)
  zIndex: -1 # z-index property of the background, default: -1. (背景的 z-index 属性, 默认: -1。)
  count: 99 # the number of lines, default: 99. (线条数量, 默认: 99。)
  mobile: true # 移动端是否启用

# Typewriter Effect (打字特效，通常指 activate_power_mode)
# https://github.com/disjukr/activate-power-mode
activate_power_mode:
  enable: true # 是否启用打字时的 activate_power_mode 特效
  colorful: true # open particle animation (冒光特效) (是否开启粒子动画/冒光特效)
  shake: false #  open shake (抖动特效) (是否开启屏幕抖动特效)
  mobile: true # 移动端是否启用

# Mouse click effects: fireworks (鼠标点击效果: 烟火特效)
fireworks:
  enable: false # 是否启用鼠标点击烟火特效
  zIndex: 9999 # -1 or 9999 (烟火特效的 z-index 层级)
  mobile: false # 移动端是否启用

# Mouse click effects: Heart symbol (鼠标点击效果: 爱心)
click_heart:
  enable: false # 是否启用鼠标点击爱心特效
  mobile: false # 移动端是否启用

# Mouse click effects: words (鼠标点击效果: 文字 )
ClickShowText:
  enable: true # 是否启用鼠标点击文字特效
  text: # 文字列表 (随机显示)
     - I
     - LOVE
     - YOU
  fontSize: 30px # 文字大小
  random: true # 是否随机选择文字
  mobile: true # 移动端是否启用

# Default display mode (网站默认的显示模式)
# light (default) / dark (亮色模式 (默认) / 暗色模式)
display_mode: light # 默认显示模式

# Beautify (美化页面显示，如标题前图标)
beautify:
  enable: true # 是否启用美化
  field: post # site/post (应用范围：全站/仅文章页)
  title-prefix-icon: '\f0c1' # 标题前缀图标 (Font Awesome Unicode)
  title-prefix-icon-color: "#F47466" # 图标颜色

# Global font settings (全局字体设置)
# Don't modify the following settings unless you know how they work (非必要不要修改)
font:
  global-font-size: 16px # 全局字号
  code-font-size: # 代码块字号 (留空则继承或使用默认)
  font-family: # 全局字体族 (CSS font-family)
  code-font-family: consolas, Menlo, "PingFang SC", "Microsoft JhengHei", "Microsoft YaHei", sans-serif # 代码块字体族

# Font settings for the site title and site subtitle (网站标题和副标题的字体设置)
# 左上角网站名字 主页居中网站名字
blog_title_font:
  font_link: # 自定义字体文件的CSS链接 (如 Google Fonts)
  font-family: PingFang SC, 'Hiragino Sans GB', 'Microsoft JhengHei', 'Microsoft YaHei', sans-serif # 博客标题字体族

# The setting of divider icon (水平分隔线图标设置)
hr_icon:
  enable: true # 是否在水平分隔线(hr)上显示图标
  icon: \f0c4 # the unicode value of Font Awesome icon, such as '\f0c4' (Font Awesome 图标的 Unicode 值)
  icon-top: # 图标距离顶部的偏移量 (CSS值)

# the subtitle on homepage (主页副标题)
subtitle:
  enable: true # 是否启用主页副标题
  # Typewriter Effect (打字效果)
  effect: true # 是否启用打字效果
  # Effect Speed Options (打字效果速度参数)
  startDelay: 300 # time before typing starts in milliseconds (输入开始前的延迟时间, 毫秒)
  typeSpeed: 150 # type speed in milliseconds (打字速度, 毫秒)
  backSpeed: 50 # backspacing speed in milliseconds (退格速度, 毫秒)
  # loop (循环打字)
  loop: true # 是否循环播放
  # source 调用第三方服务 (一言等)
  # source: false 关闭调用
  # source: 1  调用一言网的一句话（简体） https://hitokoto.cn/
  # source: 2  调用一句网（简体） http://yijuzhan.com/
  # source: 3  调用今日诗词（简体） https://www.jinrishici.com/
  # subtitle 会先显示 source , 再显示 sub 的内容
  source: false # 选择调用的服务
  # 如果关闭打字效果，subtitle 只会显示 sub 的第一行文字
  sub: # 自定义副标题列表
     - 生活明朗,万物可爱,人间值得,未来可期.

# Loading Animation (加载动画)
preloader:
  enable: true # 是否启用加载动画
  # source (来源/样式)
  # 1. fullpage-loading (全屏加载样式1)
  # 2. pace (progress bar) (Pace.js 进度条样式)
  # else all (其他值或未指定，则可能为另一种全屏加载样式或默认)
  source: 3 # 选择加载动画的样式
  # pace theme (see https://codebyzach.github.io/pace/) (Pace.js 主题，参见...)
  pace_css_url: # Pace.js 主题的 CSS 文件 URL (如果 source 为2且需要自定义主题)
  avatar: /img/1 (5).gif # 自定义加载动画中显示的头像

# aside (侧边栏)
# --------------------------------------
aside:
  enable: true # 是否启用侧边栏
  hide: false # 是否默认隐藏侧边栏 (可由按钮切换)
  button: true # 是否显示切换侧边栏的按钮
  mobile: true # display on mobile (移动端是否显示侧边栏)
  position: right # left or right (侧边栏位置：左侧或右侧)
  display: # 控制对应详情页面是否显示侧边栏
    archive: true # 归档页是否显示侧边栏
    tag: true # 标签页是否显示侧边栏
    category: true # 分类页是否显示侧边栏
  card_author: # 作者信息卡片
    enable: true # 是否启用
    description: # 作者描述 (HTML格式, 留空则使用站点描述 `site.description`)
    name_link: / # 作者名称点击链接
  card_announcement: # 公告卡片
    enable: true # 是否启用
    content: 欢迎来看我的博客鸭~ # 公告内容 (HTML格式)
  card_weixin: # 微信公众号/联系方式卡片
    enable: false # 是否启用
    face: https://bu.dusays.com/2023/01/13/63c02edf44033.png # 正面图片 (如二维码)
    backFace: https://bu.dusays.com/2023/05/13/645fa415e8694.png # 背面图片 (鼠标悬停或点击切换)
  card_recent_post: # 最新文章卡片
    enable: true # 是否启用
    limit: 5 # if set 0 will show all (显示数量, 0为全部)
    sort: date # date or updated (排序方式：创建日期或更新日期)
    sort_order: # Don't modify the setting unless you know how it works (排序顺序，通常不需要修改，由主题内部逻辑决定)
  card_categories: # 分类卡片
    enable: false # 是否启用
    limit: 8 # if set 0 will show all (显示数量, 0为全部)
    expand: none # none/true/false (是否展开子分类：不展开/全部展开/仅展开有文章的)
    sort_order: # 排序顺序
  card_tags: # 标签云卡片
    enable: true # 是否启用
    limit: 40 # if set 0 will show all (显示数量, 0为全部)
    color: true # 是否为标签启用彩色显示
    sort_order: # 排序顺序
    highlightTags: # 高亮特定标签 (列表)
      # - Hexo
      # - 前端
  card_archives: # 归档卡片
    enable: true # 是否启用
    type: monthly # yearly or monthly (归档类型：按年或按月)
    format: MMMM YYYY # eg: YYYY年MM月 (日期显示格式)
    order: -1 # Sort of order. 1, asc for ascending; -1, desc for descending (排序顺序：1升序, -1降序)
    limit: 8 # if set 0 will show all (显示数量, 0为全部)
    sort_order: # 排序顺序
  card_webinfo: # 网站信息卡片
    enable: true # 是否启用
    post_count: true # 是否显示文章总数
    last_push_date: false # 是否显示最后更新日期
    sort_order: # 各信息项显示顺序

# busuanzi count for PV / UV in site (不蒜子统计站点 PV/UV)
# 访问人数
busuanzi:
  site_uv: true # 是否在页脚显示站点总访客数(UV)
  site_pv: true # 是否在页脚显示站点总访问量(PV)
  page_pv: true # 是否在文章页显示当前页面访问量(PV)

# Time difference between publish date and now (网页运行时间)
# Formal: Month/Day/Year Time or Year/Month/Day Time (格式: 月/日/年 时:分:秒 或 年/月/日 时:分:秒)
runtimeshow:
  enable: true # 是否在页脚显示网站已运行时间
  publish_date: 05/10/2025 00:00:00 # 网站上线日期和时间

# Console - Newest Comments (浏览器控制台 - 最新评论，某些主题有此功能)
newest_comments:
  enable: true # 是否启用控制台最新评论功能
  sort_order: # 排序顺序
  limit: 6 # 显示数量
  storage: 10 # unit: mins, save data to localStorage (数据缓存时间, 单位: 分钟)
  avatar: true # 是否显示评论者头像

# Bottom right button (右下角按钮组)
# --------------------------------------

# Conversion between Traditional and Simplified Chinese (简繁转换)
translate:
  enable: true # 是否启用简繁转换按钮
  # The text of a button (按钮文字)
  default: 繁 # 默认按钮文字 (通常在简体环境下显示“繁”)
  # Right-click menu default text (右键菜单默认文本，如果支持)
  rightMenuMsgDefault: "轉為繁體" # 右键菜单默认显示的转换提示
  # the language of website (1 - Traditional Chinese/ 2 - Simplified Chinese） (网站默认语言：1繁体/2简体)
  defaultEncoding: 2 # 网站默认编码 (简体中文)
  # Time delay (转换延迟时间，毫秒)
  translateDelay: 0 # 转换操作的延迟时间
  # The text of the button when the language is Simplified Chinese (简体中文环境下按钮显示的文字)
  msgToTraditionalChinese: "繁" # 简体环境下，按钮显示为“繁”
  # The text of the button when the language is Traditional Chinese (繁体中文环境下按钮显示的文字)
  msgToSimplifiedChinese: "简" # 繁体环境下，按钮显示为“简”
  # Right-click the menu to traditional Chinese (右键菜单转为繁体中文的提示)
  rightMenuMsgToTraditionalChinese: "转为繁体"
  # Right-click menu to simplified Chinese (右键菜单转为简体中文的提示)
  rightMenuMsgToSimplifiedChinese: "转为简体"

# Read Mode (閲读模式)
readmode: true # 是否启用阅读模式按钮 (通常用于优化文章页阅读体验)

# 中控台 (可能指一个集成的控制面板或快捷功能入口)
centerConsole:
  enable: true # 是否启用中控台
  card_tags: # 中控台内的标签云卡片
    enable: true
    limit: 40
    color: false
    sort_order:
    highlightTags:
      # - Hexo
      # - 前端
  card_archives: # 中控台内的归档卡片
    enable: true
    type: monthly
    format: MMMM YYYY
    order: -1
    limit: 8
    sort_order:

# dark mode (暗色模式)
darkmode:
  enable: true # 是否启用暗色模式切换功能
  # Toggle Button to switch dark/light mode (切换暗色/亮色模式的切换按钮)
  button: true # 是否显示切换按钮
  # Switch dark/light mode automatically (自动切换 dark mode和 light mode) (自动切换暗色/亮色模式)
  # autoChangeMode: 1  Following System Settings, if the system doesn't support dark mode, it will switch dark mode between 6 pm to 6 am
  # (autoChangeMode: 1  跟随系统设置, 如果系统不支持暗色模式, 则在下午6点到早上6点之间切换暗色模式)
  # autoChangeMode: 2  Switch dark mode between 6 pm to 6 am (在下午6点到早上6点之间切换暗色模式)
  # autoChangeMode: false (不自动切换)
  autoChangeMode: 1 # 自动切换模式
  start: # 8 (自动切换的开始时间，小时，如18点)
  end: # 22 (自动切换的结束时间，小时，如次日6点)

# Don't modify the following settings unless you know how they work (非必要请不要修改 )
# Choose: readmode,translate,darkmode,hideAside,toc,chat,comment (选择要在右下角按钮组中显示的项目)
# Don't repeat 不要重複 (不要重复项目)
rightside_item_order: # 右下角按钮组项目顺序及显隐控制
  enable: false # 是否启用自定义排序 (false则按主题默认)
  hide: # readmode,translate,darkmode,hideAside (要隐藏的项目)
  show: # toc,chat,comment (要显示的项目，会覆盖默认)

# Lightbox (图片大图查看模式)
# --------------------------------------
# You can only choose one, or neither (只能选择一个 或者 两个都不选)

# medium-zoom
# https://github.com/francoischalifour/medium-zoom
medium_zoom: false # 是否启用 medium-zoom 图片灯箱

# fancybox
# http://fancyapps.com/fancybox/3/
fancybox: true # 是否启用 fancybox 图片灯箱

# Tag Plugins settings (标签插件设置，指 Hexo 的自定义标签，如 note, mermaid 等)
# --------------------------------------

# mermaid (Mermaid 图表库)
# see https://github.com/mermaid-js/mermaid (参见...)
mermaid:
  enable: true # 是否启用 Mermaid
  # built-in themes: default/forest/dark/neutral (内置主题)
  theme: # Mermaid 主题设置
    light: default # 亮色模式下的主题
    dark: dark # 暗色模式下的主题

# Note (Bootstrap Callout) (Note 标签，即提示框/警告框)
note:
  # Note tag style values: (Note 标签样式值)
  #  - simple    bs-callout old alert style. Default. (simple: 旧版 bs-callout 警告样式。默认。)
  #  - modern    bs-callout new (v2-v3) alert style. (modern: 新版 bs-callout (v2-v3) 警告样式。)
  #  - flat      flat callout style with background, like on Mozilla or StackOverflow. (flat: 扁平化提示框样式, 带背景, 类似 Mozilla 或 StackOverflow。)
  #  - disabled  disable all CSS styles import of note tag. (disabled: 禁用所有 note 标签的 CSS 样式导入。)
  style: flat # Note 标签样式
  icons: true # 是否显示图标
  border_radius: 3 # 边框圆角半径
  # Offset lighter of background in % for modern and flat styles (modern: -12 | 12; flat: -18 | 6).
  # (modern 和 flat 样式背景的亮度偏移百分比 (modern: -12 | 12; flat: -18 | 6)。)
  # Offset also applied to label tag variables. This option can work with disabled note tag.
  # (偏移也适用于标签变量。此选项可与禁用的 note 标签一起使用。)
  light_bg_offset: 0 # 背景亮度偏移

icons: # 图标相关设置
  ali_iconfont_js: # 阿里图标symbol 引用链接，主题会进行加载 symbol 引用 (阿里巴巴iconfont的JS链接)
  fontawesome: true #是否启用fontawesome6图标
  fontawesome_animation_css: #fontawesome_animation 如果有就会加载，示例值：https://npm.elemecdn.com/hexo-butterfly-tag-plugins-plus@1.0.17/lib/assets/font-awesome-animation.min.css (FontAwesome 动画CSS链接)

# other (其他设置)
# --------------------------------------

# Pjax (部分页面刷新技术)
# It may contain bugs and unstable, give feedback when you find the bugs. (它可能包含错误且不稳定, 发现错误时请提供反馈。)
# https://github.com/MoOx/pjax
pjax:
  enable: true # 是否启用 Pjax
  exclude: # Pjax 排除列表 (这些路径的链接将执行完整页面刷新)
    # - xxxx
    # - xxxx

# Inject the css and script (aplayer/meting) (注入 aplayer/meting 的 CSS 和脚本)
aplayerInject:
  enable: true # 是否自动注入 aplayer/meting 依赖 (如果检测到页面使用)
  per_page: true # 是否按需加载 (true 表示只在需要的页面加载)

# Snackbar (Toast Notification 弹窗，即消息提示条)
# https://github.com/polonel/SnackBar
# position 弹窗位置
# 可选 top-left / top-center / top-right / bottom-left / bottom-center / bottom-right
snackbar:
  enable: true # 是否启用 Snackbar
  position: top-center # 弹窗位置
  bg_light: "#425AEF" # The background color of Toast Notification in light mode (亮色模式下 Toast 通知的背景颜色)
  bg_dark: "#1f1f1f" # The background color of Toast Notification in dark mode (暗色模式下 Toast 通知的背景颜色)

# https://instant.page/
# prefetch (预加载，鼠标悬停在链接上时预取页面)
instantpage: true # 是否启用 instant.page

# https://github.com/vinta/pangu.js
# Insert a space between Chinese character and English character (中英文之间添加空格)
pangu:
  enable: false # 是否启用 pangu.js (自动在中英文、数字间添加空格)
  field: site # site/post (应用范围：全站/仅文章页)

# Lazyload (图片懒加载)
# https://github.com/verlok/vanilla-lazyload
lazyload:
  enable: true # 是否启用图片懒加载
  field: site # site/post (应用范围：全站/仅文章页)
  placeholder: # 占位图片 URL
  blur: true # 是否启用模糊占位效果 (需要配合 progressive)
  progressive: true # 是否启用渐进式加载效果 (先显示小图再加载大图)

# PWA (Progressive Web App)
# See https://github.com/JLHwung/hexo-offline (参见...)
# ---------------
pwa:
  enable: false # 是否启用 PWA 功能 (通常需要 hexo-offline 插件)
  startup_image_enable: true # 是否启用 PWA 启动画面
  manifest: /manifest.json # manifest.json 文件路径
  theme_color: var(--anzhiyu-main) # PWA 主题色 (可使用CSS变量)
  mask_icon: /img/siteicon/apple-icon-180.png # PWA maskable 图标路径
  apple_touch_icon: /img/siteicon/apple-icon-180.png # Apple touch 图标路径
  bookmark_icon: /img/siteicon/apple-icon-180.png # 书签图标路径
  favicon_32_32: /img/siteicon/32.png # 32x32 favicon 路径
  favicon_16_16: /img/siteicon/16.png # 16x16 favicon 路径

# Open graph meta tags (Open Graph Meta 标签，用于社交媒体分享)
# https://developers.facebook.com/docs/sharing/webmasters/
Open_Graph_meta: true # 是否启用 Open Graph Meta 标签

# Add the vendor prefixes to ensure compatibility (为CSS属性添加浏览器厂商前缀以确保兼容性)
css_prefix: true # 是否自动添加CSS前缀 (通常由构建工具处理)

# 首页顶部相关配置
home_top:
  enable: true # 开关 (是否启用首页顶部特殊区域)
  timemode: date #date/updated (时间模式：创建日期/更新日期)
  title: 生活明朗 # 主标题
  subTitle: 万物可爱。 # 副标题
  siteText: anheyu.com # 站点文字/域名显示
  category: # 分类快捷入口列表
    - name: 宾客来 # 名称
      path: https://blog.142556.xyz # 路径
      shadow: var(--anzhiyu-shadow-blue) # 阴影颜色 (CSS变量)
