# 文章顶部ai摘要
post_head_ai_description:
  enable: true # 是否启用文章顶部AI摘要功能
  gptName: chat # 显示的AI名称
  mode: local # 默认模式 可选值: tianli/local (摘要生成模式：tianli API / 本地截取)
  switchBtn: false # 可以配置是否显示切换按钮 以切换tianli/local (是否显示切换模式的按钮)
  btnLink: https://afdian.net/item/886a79d4db6711eda42a52540025c377 # 切换按钮的链接 (例如赞助链接)
  randomNum: 3 # 按钮最大的随机次数，也就是一篇文章最大随机出来几种 (如果按钮内容是随机的，则为最大随机次数)
  basicWordCount: 1000 # 最低获取字符数, 最小1000, 最大1999 (本地模式下截取的最小字符数)
  key: xxxx # API Key (如果 mode 为 tianli 等需要API的模式)
  Referer: https://xx.xx/ # API Referer (如果API需要)

# 快捷键配置
shortcutKey:
  enable: false # 是否启用全局快捷键
  delay: 100 # 所有键位延时触发而不是立即触发（包括shift，以解决和浏览器键位冲突问题） (所有快捷键触发延迟，毫秒)
  shiftDelay: 200 # shift按下延时多久开启 (Shift组合键的特殊延迟，毫秒)

# 无障碍优化（在首页按下「shift + ?」以查看效果）
accesskey:
  enable: true # 是否启用 accesskey 无障碍快捷键 (通常用于主要导航和功能)

# 友情链接顶部相关配置
linkPageTop:
  enable: false # 是否启用友链页面顶部的特殊说明区域
  title: 与数百名博主无限进步 # 顶部区域标题
  # 添加博主友链的评论自定义格式 (在友链申请页评论区显示的模板)
  addFriendPlaceholder: "昵称（请勿包含博客等字样）：\n网站地址（要求博客地址，请勿提交个人主页）：\n头像图片url（请提供尽可能清晰的图片，我会上传到我自己的图床）：\n描述：\n站点截图（可选）：\n"

# 缩略图后缀 archive/tag/category 页面单独开启后缀 (用于图片CDN的缩略图参数)
pageThumbnailSuffix: "" # 在归档/标签/分类页面的文章封面图URL后追加的后缀 (如 ?imageView2/2/w/300)

# 隐私协议弹窗
agreementPopup:
  enable: false # 是否启用首次访问时的隐私协议弹窗
  url: /privacy # 隐私协议页面链接

# 右键菜单
rightClickMenu:
  enable: true # 是否启用自定义右键菜单

# 首页随便逛逛people模式 而非技能点模式，关闭后为技能点模式需要配置creativity.yml
# (首页“随便逛逛”区域的显示模式：人物形象 / 技能点。后者需要配置 creativity.yml)
peoplecanvas:
  enable: true # 是否启用人物形象模式
  img: /img/svg/竖条文字左上角.svg # 人物图片链接

# 动效 (各种动态效果开关)
dynamicEffect:
  postTopWave: true # 文章顶部波浪效果
  postTopRollZoomInfo: true # 文章顶部滚动时缩放 (文章标题等信息随滚动缩放)
  pageCommentsRollZoom: true # 非文章页面评论滚动时缩放显示（仅仅Twikoo生效） (非文章页的评论区，滚动到视窗时缩放显示)

# Inject (代码注入)
# Insert the code to head (before '</head>' tag) and the bottom (before '</body>' tag)
# (将代码插入到 head (</head> 标签之前) 和底部 (</body> 标签之前))
# 插入代码到头部 </head> 之前 和 底部 </body> 之前
inject:
  head: # 注入到 <head> 标签闭合前
