  top_background: "#87CEFA" # 页面顶部背景图片或颜色

# 深色模式粒子效果canvas
universe:
  enable: true # 是否在暗色模式下启用粒子背景特效

# 页面卡片顶部气泡升起效果
bubble:
  enable: true # 是否启用页面卡片顶部的气泡升起动效

#  控制台打印信息 (浏览器开发者工具控制台)
console:
  enable: true # 是否在控制台打印主题信息或个性化内容

# 51a统计配置 (51.la 统计)
LA:
  enable: false # 是否启用 51.la 统计
  ck: # 51.la 统计的ck参数 (ID)
  LingQueMonitorID: # 灵雀监控ID (如果使用)

# 标签卖萌 (浏览器标签页标题动态变化)
diytitle:
  enable: true # 是否启用
  leaveTitle: (ฅ>ω<*ฅ) 噫，我藏好了哦~~ # 离开当前标签页时显示的标题
  backTitle: (●—●) 喔唷，被发现了呀！ # 返回当前标签页时显示的标题

# 留言弹幕配置
comment_barrage_config:
  enable: true # 是否启用留言弹幕功能 (在页面上实时滚动显示最新评论)
  # 同时最多显示弹幕数
