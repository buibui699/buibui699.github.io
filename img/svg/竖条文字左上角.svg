<svg width="90" height="220" viewBox="0 0 90 220" xmlns="http://www.w3.org/2000/svg">
  <!-- 渐变和滤镜定义 -->
  <defs>
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#f5576c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4facfe;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>
    
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffd700;stop-opacity:1" />
    </linearGradient>
    
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="textShadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="1"/>
    </filter>
    
    <!-- 动画定义 -->
    <animateTransform id="rotate" attributeName="transform" type="rotate" 
                     values="0 45 110;360 45 110" dur="20s" repeatCount="indefinite"/>
  </defs>
  
  <!-- 背景装饰圆环 -->
  <circle cx="45" cy="110" r="100" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1" opacity="0.3">
    <animateTransform attributeName="transform" type="rotate" 
                     values="0 45 110;360 45 110" dur="30s" repeatCount="indefinite"/>
  </circle>
  
  <!-- 主卡片阴影 -->
  <rect x="5" y="3" width="80" height="214" rx="15" ry="15" fill="rgba(0,0,0,0.2)" filter="url(#softBlur)"/>
  
  <!-- 主卡片背景 -->
  <rect x="3" y="1" width="80" height="214" rx="15" ry="15" fill="url(#mainGradient)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  
  <!-- 内层光晕 -->
  <rect x="5" y="3" width="76" height="210" rx="13" ry="13" fill="url(#glowGradient)"/>
  
  <!-- 顶部装饰花纹 -->
  <g transform="translate(43,20)" opacity="0.7">
    <path d="M0,-8 Q4,-4 0,0 Q-4,-4 0,-8 Z" fill="#ffd700" filter="url(#strongGlow)"/>
    <circle cx="0" cy="0" r="3" fill="#ff69b4" opacity="0.8"/>
    <path d="M-6,-3 Q0,0 6,-3" stroke="#ffffff" stroke-width="1" fill="none" opacity="0.6"/>
  </g>
  
  <!-- 飘动的小星星 -->
  <g opacity="0.6">
    <polygon points="20,40 21,43 24,43 22,45 23,48 20,46 17,48 18,45 16,43 19,43" fill="#ffd700">
      <animateTransform attributeName="transform" type="translate" 
                       values="0,0;3,-2;0,0" dur="3s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="65,70 66,72 68,72 67,73 67,75 65,74 63,75 63,73 62,72 64,72" fill="#ff69b4">
      <animateTransform attributeName="transform" type="translate" 
                       values="0,0;-2,3;0,0" dur="4s" repeatCount="indefinite"/>
    </polygon>
  </g>
  
  <!-- 竖向文字 - 使用更飘逸的字体效果 -->
  <!-- 么 -->
  <text x="43" y="65" font-family="'Brush Script MT', '华文行楷', '楷体', cursive" 
        font-size="26" font-weight="normal" fill="url(#textGradient)" 
        text-anchor="middle" filter="url(#textShadow)" 
        transform="rotate(-2 43 65)">么</text>
  
  <!-- 么 -->
  <text x="43" y="95" font-family="'Brush Script MT', '华文行楷', '楷体', cursive" 
        font-size="26" font-weight="normal" fill="url(#textGradient)" 
        text-anchor="middle" filter="url(#textShadow)"
        transform="rotate(1 43 95)">么</text>
  
  <!-- 叽 -->
  <text x="43" y="125" font-family="'Brush Script MT', '华文行楷', '楷体', cursive" 
        font-size="26" font-weight="normal" fill="url(#textGradient)" 
        text-anchor="middle" filter="url(#textShadow)"
        transform="rotate(-1 43 125)">叽</text>
  
  <!-- 波浪符号 - 增强效果 -->
  <text x="43" y="145" font-family="'Brush Script MT', cursive" 
        font-size="22" fill="#ffd700" text-anchor="middle" 
        filter="url(#strongGlow)">~</text>
  
  <!-- 曼 -->
  <text x="43" y="175" font-family="'Brush Script MT', '华文行楷', '楷体', cursive" 
        font-size="26" font-weight="normal" fill="url(#textGradient)" 
        text-anchor="middle" filter="url(#textShadow)"
        transform="rotate(2 43 175)">曼</text>
  
  <!-- 波 -->
  <text x="43" y="200" font-family="'Brush Script MT', '华文行楷', '楷体', cursive" 
        font-size="26" font-weight="normal" fill="url(#textGradient)" 
        text-anchor="middle" filter="url(#textShadow)"
        transform="rotate(-1 43 200)">波</text>
  
  <!-- 底部装饰 -->
  <g transform="translate(43,210)" opacity="0.8">
    <path d="M0,0 Q-4,-3 -8,0 Q-4,3 0,0 Q4,-3 8,0 Q4,3 0,0" fill="#ff69b4" filter="url(#strongGlow)"/>
    <circle cx="0" cy="0" r="2" fill="#ffd700"/>
  </g>
  
  <!-- 侧边飘逸装饰 -->
  <g opacity="0.4">
    <!-- 左侧流线 -->
    <path d="M15,60 Q10,80 15,100 Q20,120 15,140 Q10,160 15,180" 
          stroke="rgba(255,255,255,0.6)" stroke-width="2" fill="none" stroke-linecap="round"/>
    
    <!-- 右侧流线 -->
    <path d="M71,70 Q76,90 71,110 Q66,130 71,150 Q76,170 71,190" 
          stroke="rgba(255,255,255,0.6)" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- 漂浮的小装饰 -->
  <g opacity="0.5">
    <circle cx="25" cy="85" r="2" fill="#4ecdc4">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="61" cy="135" r="1.5" fill="#ffeb3b">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="28" cy="165" r="1.5" fill="#ff69b4">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>