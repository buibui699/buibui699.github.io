<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本排版美化工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary: #4776E6; 
            --primary-dark: #3a56d4;
            --secondary: #8E54E9; 
            --success: #00b09b;
            --light-text: #ffffff;
            --dark-text: #333;
            --medium-text: #555;
            --very-light-text: #777;
            --border-color: #e0e0e0; 
            --input-focus-shadow: rgba(71, 118, 230, 0.2);
            --light-bg: #f8f9fa; 
            --container-bg: white; 
            --page-wrapper-bg: rgba(255, 255, 255, 0.95); 
            --shadow-main: 0 15px 30px rgba(0,0,0,0.2);
            --shadow-light: 0 5px 15px rgba(0,0,0,0.1);
            --transition: all 0.3s ease;
            --placeholder-text-color: #999; /* Color for simulated placeholder */
        }
        
        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            min-height: 100vh;
            padding: 20px;
            color: var(--dark-text); 
            display: flex; 
            justify-content: center;
            align-items: flex-start; 
        }

        .page-wrapper {
            width: 100%;
            max-width: 1200px; 
            background: var(--page-wrapper-bg);
            border-radius: 20px;
            box-shadow: var(--shadow-main);
            overflow: hidden;
            margin: 20px auto; 
        }
        
        .container {
            max-width: 100%; 
            margin: 0 auto;
            padding: 0 30px 30px; 
        }
        
        .page-wrapper > header {
            background: linear-gradient(90deg, var(--primary) 0%, var(--secondary) 100%);
            color: var(--light-text);
            padding: 25px 40px;
            text-align: center;
            text-shadow: none; 
        }
        
        .page-wrapper > header h1 {
            font-size: 2.2rem; 
            margin-bottom: 10px;
            background: none;
            -webkit-background-clip: unset;
            background-clip: unset;
            color: var(--light-text);
            display: inline-block;
        }
        
        .page-wrapper > header p {
            font-size: 1.1rem; 
            opacity: 0.9;
            max-width: 700px; 
            margin: 0 auto;
            line-height: 1.6;
        }
        
        .app-container {
            background: var(--container-bg); 
            border-radius: 15px; 
            box-shadow: var(--shadow-light); 
            overflow: hidden;
            margin-top: 30px; 
        }
        
        .toolbar {
            background: var(--light-bg);
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: flex-end; 
        }
        
        .control-group {
            display: flex;
            flex-direction: column;
            min-width: 180px; 
            flex: 1;
        }
        
        .control-group label {
            font-weight: 500; 
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--medium-text);
        }
        
        select, .toolbar button { 
            padding: 10px 12px; 
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: white;
            font-size: 15px; 
            cursor: pointer;
            transition: var(--transition);
            color: var(--dark-text); 
        }
        
        select:focus, .toolbar button:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--input-focus-shadow);
        }
        
        .toolbar button#process-btn { 
            background: var(--primary); 
            color: var(--light-text);
            font-weight: 600;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 20px; 
        }
        
        .toolbar button#process-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(71, 118, 230, 0.3); 
        }
        
        .panels {
            display: flex;
            height: 450px; 
        }
        
        .panel {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            background-color: white; 
        }
        
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .panel-title {
            font-weight: 600;
            color: var(--dark-text); 
            font-size: 16px; 
        }
        
        .panel-badge {
            background: rgba(71, 118, 230, 0.1); 
            color: var(--primary);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .panel textarea { 
            width: 100%;
            flex: 1;
            padding: 15px; 
            border: 1px solid var(--border-color);
            border-radius: 8px; 
            font-size: 15px; 
            line-height: 1.6;
            resize: none;
            transition: var(--transition);
            color: var(--dark-text);
            background-color: white;
        }

        /* Style for simulated placeholder */
        .panel textarea.placeholder-active {
            color: var(--placeholder-text-color);
            /* font-style: italic; */ /* Optional: if you want italic placeholder */
        }
        
        .panel textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--input-focus-shadow);
        }
        
        .input-panel {
            border-right: 1px solid var(--border-color);
        }
        
        .output-panel .panel textarea { 
            background: #fdfdff; 
            color: var(--dark-text); 
        }
        
        .stats {
            background: var(--light-bg);
            padding: 15px 20px; 
            display: flex;
            justify-content: space-around; 
            border-top: 1px solid var(--border-color);
            font-size: 14px;
            color: var(--medium-text);
        }
        
        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .stat-value {
            font-weight: 700;
            color: var(--primary);
        }
        
        .feature-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); 
            gap: 20px;
            padding: 30px 0; 
        }
        
        .feature-card {
            background: var(--container-bg); 
            padding: 25px;
            border-radius: 12px;
            box-shadow: var(--shadow-light);
            transition: transform 0.3s ease;
            border: 1px solid var(--border-color); 
        }
        
        .feature-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }
        
        .feature-card h3 {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            color: var(--dark-text); 
            font-size: 1.1rem;
        }
        
        .feature-icon {
            width: 32px; 
            height: 32px;
            background: var(--primary); 
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--light-text);
            font-size: 1rem; 
        }
        
        .feature-card p {
            color: var(--medium-text);
            line-height: 1.6;
            font-size: 0.9rem;
        }
        
        @media (max-width: 768px) {
            .panels {
                flex-direction: column;
                height: auto;
                min-height: 300px; 
            }
             .panel textarea {
                min-height: 150px; 
            }
            
            .input-panel {
                border-right: none;
                border-bottom: 1px solid var(--border-color);
            }
            
            .toolbar {
                flex-direction: column;
                align-items: stretch; 
            }
            .control-group {
                min-width: 100%; 
            }
            .page-wrapper > header h1 { font-size: 1.8rem; }
            .page-wrapper > header p { font-size: 1rem; }

            .stats { flex-direction: column; gap: 10px; align-items: flex-start; }
        }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <header>
            <h1>文本排版美化工具</h1>
            <p>自动优化文本排版，规范标点符号，调整段落间距，让您的文本更加专业美观</p>
        </header>
        
        <div class="container">
            <div class="app-container">
                <div class="toolbar">
                    <div class="control-group">
                        <label for="punctuation">标点符号规范</label>
                        <select id="punctuation">
                            <option value="full-width">全角标点（中文排版）</option>
                            <option value="half-width">半角标点（英文排版）</option>
                            <option value="smart">智能转换</option>
                        </select>
                    </div>
                    
                    <div class="control-group">
                        <label for="spacing">段落间距</label>
                        <select id="spacing">
                            <option value="compact">紧凑（无空行）</option> 
                            <option value="normal" selected>标准（段间空一行）</option>
                            <option value="loose">宽松（段间空两行）</option>
                        </select>
                    </div>
                    
                    <div class="control-group">
                        <label for="indent">段落缩进</label>
                        <select id="indent">
                            <option value="none">无缩进</option>
                            <option value="2spaces" selected>2字符缩进</option>
                            <option value="4spaces">4字符缩进</option>
                        </select>
                    </div>
                    
                    <button id="process-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16"> 
                            <path d="M0 4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V4zm11.5 1a.5.5 0 0 0-.5.5v3.793L9.854 8.146a.5.5 0 1 0-.708.708l2 2a.5.5 0 0 0 .708 0l2-2a.5.5 0 0 0-.708-.708L12 9.293V5.5a.5.5 0 0 0-.5-.5zM3.56 7.01h.056l1.428 3.239h.774l1.42-3.24h.056V11h1.073V5.001h-1.2l-1.71 3.894h-.039l-1.71-3.894H2.5V11h1.06V7.01z"/>
                        </svg>
                        美化文本
                    </button>
                </div>
                
                <div class="panels">
                    <div class="panel input-panel">
                        <div class="panel-header">
                            <div class="panel-title">输入文本</div>
                            <div class="panel-badge">原始内容</div>
                        </div>
                        <textarea id="input-text" class="panel-textarea" 
                                  placeholder="点击这里开始输入或粘贴文本..."></textarea>
                    </div>
                    
                    <div class="panel output-panel">
                        <div class="panel-header">
                            <div class="panel-title">美化结果</div>
                            <div class="panel-badge">优化完成</div>
                        </div>
                        <textarea id="output-text" class="panel-textarea" readonly></textarea>
                    </div>
                </div>
                
                <div class="stats">
                    <div class="stat-item">
                        <span>字符数：</span>
                        <span class="stat-value" id="char-count">0</span>
                    </div>
                    <div class="stat-item">
                        <span>段落数：</span>
                        <span class="stat-value" id="paragraph-count">0</span>
                    </div>
                    <div class="stat-item">
                        <span>处理时间：</span>
                        <span class="stat-value" id="process-time">0ms</span>
                    </div>
                </div>
            </div>
            
            <div class="feature-list">
                <div class="feature-card">
                    <h3>
                        <span class="feature-icon">✓</span>
                        标点规范
                    </h3>
                    <p>自动将半角标点转换为全角标点，智能处理中英文混排场景，确保标点使用规范统一。</p>
                </div>
                
                <div class="feature-card">
                    <h3>
                        <span class="feature-icon">↵</span>
                        段落优化
                    </h3>
                    <p>智能调整段落间距，添加段首缩进，清理多余空行，使文本结构清晰易读。</p>
                </div>
                
                <div class="feature-card">
                    <h3>
                        <span class="feature-icon">#</span>
                        空格处理
                    </h3>
                    <p>自动删除多余空格，保留必要空格，优化中英文之间的空格使用，使排版更专业。</p>
                </div>
                
                <div class="feature-card">
                    <h3>
                        <span class="feature-icon">⏱️</span>
                        实时统计
                    </h3>
                    <p>提供详细的文本统计信息，包括字符数、段落数和处理时间，帮助您了解文本特征。</p>
                </div>
            </div>
        </div> 
    </div> 

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const inputTextEl = document.getElementById('input-text'); 
            const outputTextEl = document.getElementById('output-text'); 
            const processBtn = document.getElementById('process-btn');
            const charCountEl = document.getElementById('char-count'); 
            const paragraphCountEl = document.getElementById('paragraph-count'); 
            const processTimeEl = document.getElementById('process-time'); 

            const defaultInputText = `现代排版设计不仅关注文字内容，也注重呈现形式。好的排版能提升阅读体验，让信息更易理解。

然而，许多人在日常写作中常忽略排版规范：比如使用英文标点、段落间缺少空行、首行没有缩进等。

本工具将帮助您自动解决这些问题：
1. 规范标点符号（中英文标点转换）
2. 智能调整段落间距
3. 添加段首缩进
4. 优化中英文混排效果
5. 清理多余空格和空行

让我们开始优化您的文本吧！点击或粘贴您的文本到这里。`;

            function setupPlaceholderBehavior(textareaElement, placeholderText) {
                const placeholderClass = 'placeholder-active';

                function showPlaceholder() {
                    if (textareaElement.value === '') {
                        textareaElement.value = placeholderText;
                        textareaElement.classList.add(placeholderClass);
                    }
                }

                function hidePlaceholder() {
                    if (textareaElement.classList.contains(placeholderClass)) {
                        textareaElement.value = '';
                        textareaElement.classList.remove(placeholderClass);
                    }
                }

                textareaElement.addEventListener('focus', hidePlaceholder);
                textareaElement.addEventListener('blur', showPlaceholder);
                
                showPlaceholder(); 
            }

            setupPlaceholderBehavior(inputTextEl, defaultInputText);
            
            updateStats(); 
            
            processBtn.addEventListener('click', processText);
            inputTextEl.addEventListener('input', function() {
                updateStats();
            });
            
            function getCurrentInputText() {
                if (inputTextEl.classList.contains('placeholder-active')) {
                    return ""; 
                }
                return inputTextEl.value;
            }

            function processText() {
                const startTime = performance.now();
                const text = getCurrentInputText(); 
                
                if (!text.trim()) {
                    outputTextEl.value = '';
                    updateStats(""); 
                    processTimeEl.textContent = '0ms';
                    return;
                }
                
                const punctuationMode = document.getElementById('punctuation').value;
                const spacingMode = document.getElementById('spacing').value;
                const indentMode = document.getElementById('indent').value;
                
                let result = text; 
                                
                result = result.replace(/\r\n/g, '\n').replace(/\r/g, '\n');

                result = normalizePunctuation(result, punctuationMode);
                result = normalizeSpacesPreParagraph(result);
                result = processParagraphs(result, spacingMode, indentMode);
                result = optimizeMixedTextAndNumbers(result);

                outputTextEl.value = result;
                updateStats(result); 
                
                const endTime = performance.now();
                processTimeEl.textContent = `${Math.round(endTime - startTime)}ms`;
            }
            
            function normalizePunctuation(text, mode) {
                const halfToFullMap = { ',': '，', '.': '。', ':': '：', ';': '；', '!': '！', '?': '？', '(': '（', ')': '）', '[': '【', ']': '】', '<': '《', '>': '》', "'": "’", '"': '”'};
                const fullToHalfMap = Object.fromEntries(Object.entries(halfToFullMap).map(([k, v]) => [v, k]));
                
                text = text.replace(/["“”]/g, '"'); 
                text = text.replace(/['‘’]/g, "'"); 

                if (mode === 'full-width') {
                    return text.replace(/[,.:;!?()\[\]<>'"]/g, match => halfToFullMap[match] || match);
                } else if (mode === 'half-width') {
                    const fullRegex = new RegExp(`[${Object.values(halfToFullMap).join('')}]`, 'g');
                    return text.replace(fullRegex, match => fullToHalfMap[match] || match);
                } else { 
                    text = text.replace(/([\u4e00-\u9fff])([,.:;!?()\[\]<>'"])/g, (m, c1, p) => c1 + (halfToFullMap[p] || p));
                    text = text.replace(/([a-zA-Z0-9])([，。：；！？（）【】《》’"])/g, (m, c1, p) => c1 + (fullToHalfMap[p] || p));
                    return text;
                }
            }
            
            function normalizeSpacesPreParagraph(text) {
                text = text.replace(/ +/g, ' '); 
                text = text.replace(/([\u4e00-\u9fff]) ([A-Za-z0-9])/g, '$1$2'); 
                text = text.replace(/([A-Za-z0-9]) ([\u4e00-\u9fff])/g, '$1$2'); 
                text = text.replace(/([\u4e00-\u9fff]) ([\u4e00-\u9fff])/g, '$1$2'); 
                return text;
            }

            function processParagraphs(text, spacingMode, indentMode) {
                let paragraphs = text.split('\n');
                let processedParagraphs = [];
                let currentParagraph = "";

                for (let line of paragraphs) {
                    const trimmedLine = line.trim();
                    if (trimmedLine === "") { 
                        if (currentParagraph.trim() !== "") { 
                            processedParagraphs.push(currentParagraph.trim());
                            currentParagraph = ""; 
                        }
                        processedParagraphs.push(""); 
                    } else {
                        if (currentParagraph.trim() === "") { 
                            currentParagraph = trimmedLine;
                        } else { 
                            currentParagraph += " " + trimmedLine; 
                        }
                    }
                }
                if (currentParagraph.trim() !== "") { 
                    processedParagraphs.push(currentParagraph.trim());
                }

                let finalParagraphs = [];
                processedParagraphs.forEach((p, index) => {
                    if (p.trim() !== "") {
                        let indentedP = p;
                        if (indentMode === '2spaces') indentedP = '　　' + p;
                        else if (indentMode === '4spaces') indentedP = '　　　　' + p;
                        finalParagraphs.push(indentedP);
                    } else if (index > 0 && finalParagraphs.length > 0 && finalParagraphs[finalParagraphs.length-1].trim() !== "") {
                        finalParagraphs.push(""); 
                    }
                });
                
                let result = "";
                for(let i=0; i < finalParagraphs.length; i++) {
                    if (finalParagraphs[i].trim() !== "") {
                        result += finalParagraphs[i];
                        if (i < finalParagraphs.length - 1 && (finalParagraphs[i+1].trim() !== "" || spacingMode !== 'compact') ) {
                           if (spacingMode === 'compact') result += '\n';
                           else if (spacingMode === 'normal') result += '\n\n';
                           else if (spacingMode === 'loose') result += '\n\n\n';
                        }
                    } else { 
                        if (spacingMode === 'normal' && i < finalParagraphs.length - 1 && finalParagraphs[i+1].trim() !== "") result += '\n'; 
                        else if (spacingMode === 'loose' && i < finalParagraphs.length - 1 && finalParagraphs[i+1].trim() !== "") result += '\n\n'; 
                    }
                }
                return result.replace(/^\n+/, '').replace(/\n+$/, '');
            }
            
            function optimizeMixedTextAndNumbers(text) {
                text = text.replace(/([\u4e00-\u9fff])([a-zA-Z0-9])/g, '$1 $2');
                text = text.replace(/([a-zA-Z0-9])([\u4e00-\u9fff])/g, '$1 $2');
                text = text.replace(/\s+([，。：；！？（）】》’”）])/g, '$1'); 
                text = text.replace(/([（【《‘“])\s+/g, '$1'); 
                return text;
            }

            function updateStats(textToStat) {
                const currentText = (textToStat !== undefined) ? textToStat : getCurrentInputText();
                
                charCountEl.textContent = currentText.length;
                const paragraphs = currentText.split('\n').filter(p => p.trim() !== '');
                paragraphCountEl.textContent = paragraphs.length > 0 ? paragraphs.length : (currentText.trim() ? 1: 0) ;
            }
        });
    </script>
</body>
</html>
