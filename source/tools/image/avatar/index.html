<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机卡通头像生成器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 800px;
            padding: 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 70%);
            z-index: 0;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 2.5rem;
            position: relative;
            z-index: 1;
        }
        
        .subtitle {
            color: #7f8c8d;
            margin-bottom: 30px;
            font-size: 1.1rem;
            position: relative;
            z-index: 1;
        }
        
        .avatar-container {
            position: relative;
            margin: 0 auto 30px;
            width: 300px;
            height: 300px;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4edf5 100%);
            border-radius: 50%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: transform 0.3s ease;
        }
        
        .avatar-container:hover {
            transform: scale(1.02);
        }
        
        canvas {
            border-radius: 50%;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            position: relative;
            z-index: 1;
        }
        
        button {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(37, 117, 252, 0.4);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(37, 117, 252, 0.6);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .download-btn {
            background: linear-gradient(135deg, #00b09b 0%, #96c93d 100%);
            box-shadow: 0 5px 15px rgba(0, 176, 155, 0.4);
        }
        
        .download-btn:hover {
            box-shadow: 0 8px 20px rgba(0, 176, 155, 0.6);
        }
        
        .features {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            margin-top: 30px;
            position: relative;
            z-index: 1;
        }
        
        .feature {
            background: white;
            padding: 20px;
            border-radius: 15px;
            width: calc(33.333% - 20px);
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }
        
        .feature:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
        
        .feature h3 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        
        .feature p {
            color: #7f8c8d;
            font-size: 0.9rem;
        }
        
        .footer {
            margin-top: 30px;
            color: #7f8c8d;
            font-size: 0.9rem;
            position: relative;
            z-index: 1;
        }
        
        @media (max-width: 768px) {
            .feature {
                width: calc(50% - 15px);
            }
        }
        
        @media (max-width: 480px) {
            .feature {
                width: 100%;
            }
            
            .controls {
                flex-direction: column;
                align-items: center;
            }
            
            button {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 随机卡通头像生成器</h1>
        <p class="subtitle">点击"生成头像"按钮，创建属于你的独特卡通形象</p>
        
        <div class="avatar-container">
            <canvas id="avatarCanvas" width="280" height="280"></canvas>
        </div>
        
        <div class="controls">
            <button id="generateBtn">
                <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                </svg>
                生成头像
            </button>
            <button id="downloadBtn" class="download-btn">
                <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                </svg>
                下载头像
            </button>
        </div>
        
        <div class="features">
            <div class="feature">
                <h3>无限组合</h3>
                <p>超过500,000种可能的头像组合，每次生成都是独一无二的</p>
            </div>
            <div class="feature">
                <h3>完全免费</h3>
                <p>无需注册，没有隐藏费用，尽情创建属于你的卡通形象</p>
            </div>
            <div class="feature">
                <h3>高清下载</h3>
                <p>一键下载高分辨率头像，适合各种社交媒体使用</p>
            </div>
        </div>
        
        <div class="footer">
            <p>© 2023 随机卡通头像生成器 | 所有头像均在本机生成</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const canvas = document.getElementById('avatarCanvas');
            const ctx = canvas.getContext('2d');
            const generateBtn = document.getElementById('generateBtn');
            const downloadBtn = document.getElementById('downloadBtn');
            
            // 头像组件库
            const components = {
                faceShapes: ['circle', 'square', 'heart', 'oval'],
                eyeShapes: ['circle', 'oval', 'rectangle', 'star', 'smile'],
                noseShapes: ['dot', 'triangle', 'circle', 'line'],
                mouthShapes: ['smile', 'frown', 'neutral', 'surprise', 'heart'],
                hairStyles: ['short', 'long', 'curly', 'spiky', 'bob', 'afro', 'mohawk'],
                accessories: ['glasses', 'hat', 'none', 'earring'],
                colors: {
                    skin: ['#FFDBAC', '#F1C27D', '#E0AC69', '#C68642', '#8D5524'],
                    hair: ['#2C1B1B', '#6B4C4C', '#A52A2A', '#D2691E', '#8B4513', '#000000', '#FFFFFF', '#FFD700'],
                    eyes: ['#00008B', '#008000', '#800080', '#FF0000', '#000000'],
                    bg: ['#FFB6C1', '#87CEEB', '#98FB98', '#FFD700', '#D8BFD8', '#FFA07A']
                }
            };
            
            // 初始化生成一个头像
            generateAvatar();
            
            // 生成按钮事件
            generateBtn.addEventListener('click', generateAvatar);
            
            // 下载按钮事件
            downloadBtn.addEventListener('click', function() {
                const link = document.createElement('a');
                link.download = 'cartoon-avatar.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
            
            // 生成头像函数
            function generateAvatar() {
                // 清空画布
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // 随机选择组件
                const faceShape = getRandomItem(components.faceShapes);
                const eyeShape = getRandomItem(components.eyeShapes);
                const noseShape = getRandomItem(components.noseShapes);
                const mouthShape = getRandomItem(components.mouthShapes);
                const hairStyle = getRandomItem(components.hairStyles);
                const accessory = getRandomItem(components.accessories);
                
                // 随机选择颜色
                const skinColor = getRandomItem(components.colors.skin);
                const hairColor = getRandomItem(components.colors.hair);
                const eyeColor = getRandomItem(components.colors.eyes);
                const bgColor = getRandomItem(components.colors.bg);
                
                // 绘制背景
                drawBackground(bgColor);
                
                // 绘制脸部
                drawFace(faceShape, skinColor);
                
                // 绘制眼睛
                drawEyes(eyeShape, eyeColor);
                
                // 绘制鼻子
                drawNose(noseShape);
                
                // 绘制嘴巴
                drawMouth(mouthShape);
                
                // 绘制头发
                drawHair(hairStyle, hairColor);
                
                // 绘制配饰
                drawAccessory(accessory);
            }
            
            // 辅助函数：从数组中随机获取一个元素
            function getRandomItem(array) {
                return array[Math.floor(Math.random() * array.length)];
            }
            
            // 绘制背景
            function drawBackground(color) {
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(canvas.width/2, canvas.height/2, 140, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // 绘制脸部
            function drawFace(shape, color) {
                ctx.fillStyle = color;
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                
                switch(shape) {
                    case 'circle':
                        ctx.beginPath();
                        ctx.arc(centerX, centerY, 80, 0, Math.PI * 2);
                        ctx.fill();
                        break;
                    case 'square':
                        ctx.fillRect(centerX - 70, centerY - 70, 140, 140);
                        break;
                    case 'heart':
                        ctx.beginPath();
                        ctx.moveTo(centerX, centerY - 50);
                        ctx.bezierCurveTo(
                            centerX, centerY - 30,
                            centerX + 70, centerY - 10,
                            centerX, centerY + 60
                        );
                        ctx.bezierCurveTo(
                            centerX - 70, centerY - 10,
                            centerX, centerY - 30,
                            centerX, centerY - 50
                        );
                        ctx.fill();
                        break;
                    case 'oval':
                        ctx.beginPath();
                        ctx.ellipse(centerX, centerY, 70, 90, 0, 0, Math.PI * 2);
                        ctx.fill();
                        break;
                }
            }
            
            // 绘制眼睛
            function drawEyes(shape, color) {
                ctx.fillStyle = color;
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                
                // 左眼位置
                const leftEyeX = centerX - 30;
                const rightEyeX = centerX + 30;
                const eyeY = centerY - 20;
                
                switch(shape) {
                    case 'circle':
                        ctx.beginPath();
                        ctx.arc(leftEyeX, eyeY, 10, 0, Math.PI * 2);
                        ctx.arc(rightEyeX, eyeY, 10, 0, Math.PI * 2);
                        ctx.fill();
                        break;
                    case 'oval':
                        ctx.beginPath();
                        ctx.ellipse(leftEyeX, eyeY, 8, 12, 0, 0, Math.PI * 2);
                        ctx.ellipse(rightEyeX, eyeY, 8, 12, 0, 0, Math.PI * 2);
                        ctx.fill();
                        break;
                    case 'rectangle':
                        ctx.fillRect(leftEyeX - 10, eyeY - 8, 20, 16);
                        ctx.fillRect(rightEyeX - 10, eyeY - 8, 20, 16);
                        break;
                    case 'star':
                        drawStar(leftEyeX, eyeY, 5, 8, 5);
                        drawStar(rightEyeX, eyeY, 5, 8, 5);
                        ctx.fill();
                        break;
                    case 'smile':
                        // 微笑的眼睛
                        ctx.beginPath();
                        ctx.arc(leftEyeX, eyeY, 8, 0, Math.PI);
                        ctx.arc(rightEyeX, eyeY, 8, 0, Math.PI);
                        ctx.strokeStyle = color;
                        ctx.lineWidth = 3;
                        ctx.stroke();
                        break;
                }
                
                // 绘制眼珠
                ctx.fillStyle = '#FFFFFF';
                ctx.beginPath();
                ctx.arc(leftEyeX - 3, eyeY - 2, 4, 0, Math.PI * 2);
                ctx.arc(rightEyeX - 3, eyeY - 2, 4, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // 绘制鼻子
            function drawNose(shape) {
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                const noseY = centerY + 10;
                
                ctx.fillStyle = '#FFB6C1'; // 粉色鼻子
                
                switch(shape) {
                    case 'dot':
                        ctx.beginPath();
                        ctx.arc(centerX, noseY, 4, 0, Math.PI * 2);
                        ctx.fill();
                        break;
                    case 'triangle':
                        ctx.beginPath();
                        ctx.moveTo(centerX, noseY - 8);
                        ctx.lineTo(centerX - 6, noseY + 5);
                        ctx.lineTo(centerX + 6, noseY + 5);
                        ctx.closePath();
                        ctx.fill();
                        break;
                    case 'circle':
                        ctx.beginPath();
                        ctx.arc(centerX, noseY, 6, 0, Math.PI * 2);
                        ctx.fill();
                        break;
                    case 'line':
                        ctx.beginPath();
                        ctx.moveTo(centerX, noseY - 5);
                        ctx.lineTo(centerX, noseY + 5);
                        ctx.strokeStyle = '#333';
                        ctx.lineWidth = 2;
                        ctx.stroke();
                        break;
                }
            }
            
            // 绘制嘴巴
            function drawMouth(shape) {
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                const mouthY = centerY + 40;
                
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 3;
                ctx.fillStyle = '#FF6B6B';
                
                switch(shape) {
                    case 'smile':
                        ctx.beginPath();
                        ctx.arc(centerX, mouthY, 25, 0.2, Math.PI - 0.2, false);
                        ctx.stroke();
                        break;
                    case 'frown':
                        ctx.beginPath();
                        ctx.arc(centerX, mouthY + 25, 25, Math.PI + 0.2, Math.PI * 2 - 0.2, true);
                        ctx.stroke();
                        break;
                    case 'neutral':
                        ctx.beginPath();
                        ctx.moveTo(centerX - 20, mouthY);
                        ctx.lineTo(centerX + 20, mouthY);
                        ctx.stroke();
                        break;
                    case 'surprise':
                        ctx.beginPath();
                        ctx.arc(centerX, mouthY, 15, 0, Math.PI * 2);
                        ctx.stroke();
                        break;
                    case 'heart':
                        ctx.beginPath();
                        ctx.moveTo(centerX, mouthY);
                        ctx.bezierCurveTo(
                            centerX, mouthY - 15,
                            centerX - 15, mouthY - 15,
                            centerX, mouthY + 10
                        );
                        ctx.bezierCurveTo(
                            centerX + 15, mouthY - 15,
                            centerX, mouthY - 15,
                            centerX, mouthY
                        );
                        ctx.fill();
                        break;
                }
            }
            
            // 绘制头发
            function drawHair(style, color) {
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                
                ctx.fillStyle = color;
                
                switch(style) {
                    case 'short':
                        // 简单的短发
                        ctx.beginPath();
                        ctx.arc(centerX, centerY - 100, 90, 0, Math.PI);
                        ctx.fill();
                        break;
                    case 'long':
                        // 长发
                        ctx.beginPath();
                        ctx.arc(centerX, centerY - 100, 90, 0, Math.PI);
                        ctx.fill();
                        ctx.fillRect(centerX - 90, centerY - 100, 180, 120);
                        break;
                    case 'curly':
                        // 卷发
                        for (let i = 0; i < 10; i++) {
                            const x = centerX - 70 + i * 15;
                            const y = centerY - 100;
                            ctx.beginPath();
                            ctx.arc(x, y, 12, 0, Math.PI * 2);
                            ctx.fill();
                        }
                        break;
                    case 'spiky':
                        // 刺猬头
                        for (let i = 0; i < 12; i++) {
                            const angle = (i / 12) * Math.PI * 2;
                            const x = centerX + Math.cos(angle) * 70;
                            const y = centerY - 100 + Math.sin(angle) * 20;
                            
                            ctx.beginPath();
                            ctx.moveTo(centerX, centerY - 100);
                            ctx.lineTo(x, y);
                            ctx.lineTo(centerX + Math.cos(angle + 0.2) * 80, centerY - 110 + Math.sin(angle + 0.2) * 20);
                            ctx.closePath();
                            ctx.fill();
                        }
                        break;
                    case 'bob':
                        // 波波头
                        ctx.beginPath();
                        ctx.arc(centerX, centerY - 70, 80, 0, Math.PI);
                        ctx.fill();
                        ctx.fillRect(centerX - 80, centerY - 70, 160, 80);
                        break;
                    case 'afro':
                        // 爆炸头
                        ctx.beginPath();
                        ctx.arc(centerX, centerY - 70, 90, 0, Math.PI * 2);
                        ctx.fill();
                        break;
                    case 'mohawk':
                        // 莫西干头
                        ctx.fillRect(centerX - 10, centerY - 150, 20, 80);
                        for (let i = 0; i < 7; i++) {
                            const x = centerX - 8 + i * 3;
                            const height = 30 + Math.random() * 20;
                            ctx.fillRect(x, centerY - 150 - height, 2, height);
                        }
                        break;
                }
            }
            
            // 绘制配饰
            function drawAccessory(accessory) {
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                
                ctx.strokeStyle = '#333';
                ctx.fillStyle = '#D3D3D3';
                ctx.lineWidth = 2;
                
                switch(accessory) {
                    case 'glasses':
                        // 眼镜
                        ctx.beginPath();
                        ctx.arc(centerX - 30, centerY - 20, 15, 0, Math.PI * 2);
                        ctx.arc(centerX + 30, centerY - 20, 15, 0, Math.PI * 2);
                        ctx.stroke();
                        
                        // 眼镜桥
                        ctx.beginPath();
                        ctx.moveTo(centerX - 15, centerY - 20);
                        ctx.lineTo(centerX + 15, centerY - 20);
                        ctx.stroke();
                        break;
                    case 'hat':
                        // 帽子
                        ctx.fillStyle = '#FF6347';
                        ctx.beginPath();
                        ctx.arc(centerX, centerY - 130, 60, 0, Math.PI);
                        ctx.fill();
                        ctx.fillRect(centerX - 70, centerY - 130, 140, 20);
                        break;
                    case 'earring':
                        // 耳环
                        ctx.fillStyle = '#FFD700';
                        ctx.beginPath();
                        ctx.arc(centerX - 70, centerY, 5, 0, Math.PI * 2);
                        ctx.arc(centerX + 70, centerY, 5, 0, Math.PI * 2);
                        ctx.fill();
                        break;
                }
            }
            
            // 绘制星星函数
            function drawStar(cx, cy, spikes, outerRadius, innerRadius) {
                let rot = Math.PI / 2 * 3;
                let x = cx;
                let y = cy;
                let step = Math.PI / spikes;
                
                ctx.beginPath();
                ctx.moveTo(cx, cy - outerRadius);
                
                for (let i = 0; i < spikes; i++) {
                    x = cx + Math.cos(rot) * outerRadius;
                    y = cy + Math.sin(rot) * outerRadius;
                    ctx.lineTo(x, y);
                    rot += step;
                    
                    x = cx + Math.cos(rot) * innerRadius;
                    y = cy + Math.sin(rot) * innerRadius;
                    ctx.lineTo(x, y);
                    rot += step;
                }
                
                ctx.lineTo(cx, cy - outerRadius);
                ctx.closePath();
            }
        });
    </script>
</body>
</html>
