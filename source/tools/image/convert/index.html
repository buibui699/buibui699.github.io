<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片格式转换工具</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 1000px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(90deg, #4776E6 0%, #8E54E9 100%);
            color: white;
            padding: 25px 40px;
            text-align: center;
        }
        
        header h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        
        header h1 i {
            font-size: 1.8rem;
        }
        
        header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }
        
        .main-content {
            display: flex;
            padding: 30px;
        }
        
        .left-panel {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        
        .right-panel {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        
        .panel-title {
            font-size: 1.3rem;
            color: #2c3e50;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .panel-title i {
            color: #4776E6;
        }
        
        .upload-area {
            border: 3px dashed #4776E6;
            border-radius: 15px;
            padding: 30px 20px;
            text-align: center;
            background-color: rgba(71, 118, 230, 0.05);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .upload-area:hover {
            background-color: rgba(71, 118, 230, 0.1);
            transform: translateY(-3px);
        }
        
        .upload-area i {
            font-size: 3.5rem;
            color: #4776E6;
            margin-bottom: 15px;
        }
        
        .upload-area h3 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        
        .upload-area p {
            color: #7f8c8d;
            font-size: 0.95rem;
        }
        
        .file-input {
            display: none;
        }
        
        .format-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .format-option {
            flex: 1;
            min-width: 120px;
            text-align: center;
            padding: 15px;
            border-radius: 12px;
            background: white;
            border: 2px solid #e0e0e0;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .format-option:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .format-option.active {
            border-color: #4776E6;
            background: rgba(71, 118, 230, 0.1);
            box-shadow: 0 5px 15px rgba(71, 118, 230, 0.2);
        }
        
        .format-option i {
            font-size: 2.5rem;
            margin-bottom: 10px;
            display: block;
        }
        
        .format-option .jpg i { color: #FF6384; }
        .format-option .png i { color: #36A2EB; }
        .format-option .webp i { color: #FFCE56; }
        .format-option .gif i { color: #4BC0C0; }
        
        .preview-container {
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(45deg, #f5f7fa, #e4e7eb);
            position: relative;
        }
        
        .preview-container img {
            max-width: 100%;
            max-height: 100%;
            display: none;
            object-fit: contain;
        }
        
        .preview-placeholder {
            text-align: center;
            color: #7f8c8d;
        }
        
        .preview-placeholder i {
            font-size: 4rem;
            margin-bottom: 15px;
            color: #bdc3c7;
        }
        
        .file-info {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            font-size: 0.95rem;
        }
        
        .file-info p {
            margin-bottom: 8px;
            color: #2c3e50;
        }
        
        .file-info span {
            color: #7f8c8d;
            font-weight: 500;
        }
        
        .action-buttons {
            display: flex;
            gap: 15px;
        }
        
        .btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        }
        
        .btn-convert {
            background: linear-gradient(90deg, #4776E6 0%, #8E54E9 100%);
            color: white;
        }
        
        .btn-download {
            background: linear-gradient(90deg, #00b09b 0%, #96c93d 100%);
            color: white;
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .conversion-status {
            background: #e3f2fd;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            font-size: 1.1rem;
            color: #4776E6;
            display: none;
        }
        
        footer {
            text-align: center;
            padding: 20px;
            color: #7f8c8d;
            font-size: 0.9rem;
            background: #f8f9fa;
            border-top: 1px solid #eee;
        }
        
        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }
            
            .action-buttons {
                flex-direction: column;
            }
        }
        
        /* Animation for conversion status */
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
        
        .converting {
            animation: pulse 1.5s infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-exchange-alt"></i> 图片格式转换工具</h1>
            <p>支持 JPG, PNG, WebP, GIF 格式互转</p>
        </header>
        
        <div class="main-content">
            <div class="left-panel">
                <div>
                    <h2 class="panel-title"><i class="fas fa-upload"></i> 上传图片</h2>
                    <div class="upload-area" id="dropArea">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <h3>拖放图片到此处或点击上传</h3>
                        <p>支持 JPG, PNG, WebP, GIF 格式 (最大 5MB)</p>
                        <input type="file" id="fileInput" class="file-input" accept="image/jpeg,image/png,image/webp,image/gif">
                    </div>
                </div>
                
                <div>
                    <h2 class="panel-title"><i class="fas fa-cog"></i> 转换设置</h2>
                    <div class="format-selector">
                        <div class="format-option" data-format="jpg">
                            <i class="fab fa-java"></i>
                            <div>JPG</div>
                        </div>
                        <div class="format-option" data-format="png">
                            <i class="fas fa-image"></i>
                            <div>PNG</div>
                        </div>
                        <div class="format-option" data-format="webp">
                            <i class="fab fa-chrome"></i>
                            <div>WebP</div>
                        </div>
                        <div class="format-option" data-format="gif">
                            <i class="fas fa-film"></i>
                            <div>GIF</div>
                        </div>
                    </div>
                </div>
                
                <div class="file-info">
                    <p>文件名: <span id="fileName">未选择文件</span></p>
                    <p>原始格式: <span id="originalFormat">-</span></p>
                    <p>文件大小: <span id="fileSize">-</span></p>
                    <p>转换格式: <span id="targetFormat">-</span></p>
                </div>
                
                <div class="action-buttons">
                    <button class="btn btn-convert" id="convertBtn" disabled>
                        <i class="fas fa-sync"></i> 开始转换
                    </button>
                    <button class="btn btn-download" id="downloadBtn" disabled>
                        <i class="fas fa-download"></i> 下载图片
                    </button>
                </div>
                
                <div class="conversion-status" id="conversionStatus">
                    <i class="fas fa-spinner fa-spin"></i> 正在转换图片，请稍候...
                </div>
            </div>
            
            <div class="right-panel">
                <div>
                    <h2 class="panel-title"><i class="fas fa-image"></i> 原始图片预览</h2>
                    <div class="preview-container" id="originalPreview">
                        <div class="preview-placeholder">
                            <i class="fas fa-image"></i>
                            <p>原始图片预览区域</p>
                        </div>
                        <img id="originalImage">
                    </div>
                </div>
                
                <div>
                    <h2 class="panel-title"><i class="fas fa-file-export"></i> 转换结果预览</h2>
                    <div class="preview-container" id="convertedPreview">
                        <div class="preview-placeholder">
                            <i class="fas fa-file-image"></i>
                            <p>转换结果预览区域</p>
                        </div>
                        <img id="convertedImage">
                    </div>
                </div>
            </div>
        </div>
        
        <footer>
            <p>© 2023 图片格式转换工具 | 基于HTML5和JavaScript构建</p>
        </footer>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // DOM元素
            const dropArea = document.getElementById('dropArea');
            const fileInput = document.getElementById('fileInput');
            const originalImage = document.getElementById('originalImage');
            const convertedImage = document.getElementById('convertedImage');
            const convertBtn = document.getElementById('convertBtn');
            const downloadBtn = document.getElementById('downloadBtn');
            const conversionStatus = document.getElementById('conversionStatus');
            const fileName = document.getElementById('fileName');
            const originalFormat = document.getElementById('originalFormat');
            const fileSize = document.getElementById('fileSize');
            const targetFormat = document.getElementById('targetFormat');
            
            // 当前选中的格式
            let selectedFormat = null;
            let uploadedFile = null;
            let convertedImageData = null;
            
            // 设置拖放事件
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                dropArea.addEventListener(eventName, preventDefaults, false);
            });
            
            function preventDefaults(e) {
                e.preventDefault();
                e.stopPropagation();
            }
            
            ['dragenter', 'dragover'].forEach(eventName => {
                dropArea.addEventListener(eventName, highlight, false);
            });
            
            ['dragleave', 'drop'].forEach(eventName => {
                dropArea.addEventListener(eventName, unhighlight, false);
            });
            
            function highlight() {
                dropArea.style.backgroundColor = 'rgba(71, 118, 230, 0.15)';
                dropArea.style.borderColor = '#FF6384';
            }
            
            function unhighlight() {
                dropArea.style.backgroundColor = 'rgba(71, 118, 230, 0.05)';
                dropArea.style.borderColor = '#4776E6';
            }
            
            // 处理文件拖放
            dropArea.addEventListener('drop', handleDrop, false);
            
            function handleDrop(e) {
                const dt = e.dataTransfer;
                const file = dt.files[0];
                handleFile(file);
            }
            
            // 处理文件选择
            dropArea.addEventListener('click', () => {
                fileInput.click();
            });
            
            fileInput.addEventListener('change', function() {
                if (this.files && this.files[0]) {
                    handleFile(this.files[0]);
                }
            });
            
            // 处理文件
            function handleFile(file) {
                // 检查文件类型
                const validTypes = ['image/jpeg', 'image/png', 'image/webp', 'image/gif'];
                if (!validTypes.includes(file.type)) {
                    alert('请上传有效的图片文件 (JPG, PNG, WebP, GIF)');
                    return;
                }
                
                // 检查文件大小 (5MB)
                if (file.size > 5 * 1024 * 1024) {
                    alert('文件大小不能超过5MB');
                    return;
                }
                
                uploadedFile = file;
                
                // 显示文件信息
                fileName.textContent = file.name;
                originalFormat.textContent = file.type.split('/')[1].toUpperCase();
                fileSize.textContent = formatFileSize(file.size);
                
                // 显示预览
                const reader = new FileReader();
                reader.onload = function(e) {
                    originalImage.src = e.target.result;
                    originalImage.style.display = 'block';
                    
                    // 隐藏原始预览的placeholder
                    const placeholder = document.querySelector('#originalPreview .preview-placeholder');
                    if (placeholder) placeholder.style.display = 'none';
                };
                reader.readAsDataURL(file);
                
                // 启用转换按钮
                convertBtn.disabled = false;
                
                // 如果已经选择了格式，启用转换按钮
                if (selectedFormat) {
                    convertBtn.disabled = false;
                }
            }
            
            // 格式化文件大小
            function formatFileSize(bytes) {
                if (bytes === 0) return '0 Bytes';
                const k = 1024;
                const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            }
            
            // 格式选择
            document.querySelectorAll('.format-option').forEach(option => {
                option.addEventListener('click', function() {
                    // 移除所有active类
                    document.querySelectorAll('.format-option').forEach(el => {
                        el.classList.remove('active');
                    });
                    
                    // 为当前选项添加active类
                    this.classList.add('active');
                    
                    // 设置选中的格式
                    selectedFormat = this.getAttribute('data-format');
                    targetFormat.textContent = selectedFormat.toUpperCase();
                    
                    // 如果已经上传了文件，启用转换按钮
                    if (uploadedFile) {
                        convertBtn.disabled = false;
                    }
                });
            });
            
            // 转换按钮事件
            convertBtn.addEventListener('click', function() {
                if (!uploadedFile || !selectedFormat) return;
                
                // 显示转换状态
                conversionStatus.style.display = 'block';
                conversionStatus.classList.add('converting');
                
                // 模拟转换过程（在实际应用中，这里会进行实际的图像转换）
                setTimeout(function() {
                    // 在实际应用中，这里应该是转换后的图像数据
                    // 这里我们只是使用原始图像作为示例
                    convertedImage.src = originalImage.src;
                    convertedImage.style.display = 'block';
                    
                    // 隐藏转换后的预览的placeholder
                    const placeholder = document.querySelector('#convertedPreview .preview-placeholder');
                    if (placeholder) placeholder.style.display = 'none';
                    
                    // 启用下载按钮
                    downloadBtn.disabled = false;
                    
                    // 更新转换状态
                    conversionStatus.innerHTML = '<i class="fas fa-check-circle"></i> 转换成功！';
                    conversionStatus.classList.remove('converting');
                    conversionStatus.style.background = 'linear-gradient(90deg, #00b09b 0%, #96c93d 100%)';
                    conversionStatus.style.color = 'white';
                    
                    // 3秒后隐藏状态
                    setTimeout(() => {
                        conversionStatus.style.display = 'none';
                    }, 3000);
                }, 1500);
            });
            
            // 下载按钮事件
            downloadBtn.addEventListener('click', function() {
                if (!convertedImage.src) return;
                
                // 创建下载链接
                const link = document.createElement('a');
                link.href = convertedImage.src;
                link.download = `converted-image.${selectedFormat}`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            });
        });
    </script>
</body>
</html>
