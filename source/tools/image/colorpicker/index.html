<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片取色器 - 提取图片颜色值</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }

        header {
            background: linear-gradient(90deg, #6a11cb 0%, #2575fc 100%);
            color: white;
            padding: 25px 30px;
            text-align: center;
            position: relative;
        }

        header h1 {
            font-size: 2.2rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .main-content {
            display: flex;
            flex-wrap: wrap;
            padding: 30px;
            gap: 30px;
        }

        .upload-section {
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .preview-section {
            flex: 1;
            min-width: 300px;
        }

        .card {
            background: #f9fbfd;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            border: 1px solid #eef2f7;
            height: 100%;
        }

        .card-title {
            font-size: 1.4rem;
            color: #2c3e50;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .upload-area {
            border: 3px dashed #dce6f1;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8fafc;
            position: relative;
            overflow: hidden;
        }

        .upload-area:hover {
            border-color: #6a11cb;
            background: #f0f5ff;
        }

        .upload-area i {
            font-size: 4rem;
            color: #6a11cb;
            margin-bottom: 15px;
            opacity: 0.7;
        }

        .upload-area h3 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 1.3rem;
        }

        .upload-area p {
            color: #7f8c8d;
            margin-bottom: 20px;
            font-size: 0.95rem;
        }

        .btn {
            background: linear-gradient(90deg, #6a11cb 0%, #2575fc 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 5px 15px rgba(37, 117, 252, 0.4);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(37, 117, 252, 0.6);
        }

        #file-input {
            display: none;
        }

        .canvas-container {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            background: #f8fafc;
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #image-canvas {
            max-width: 100%;
            max-height: 100%;
            display: none;
            cursor: crosshair;
        }

        .placeholder {
            text-align: center;
            padding: 40px;
            color: #7f8c8d;
        }

        .placeholder i {
            font-size: 4rem;
            margin-bottom: 20px;
            color: #dce6f1;
        }

        .color-info {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 25px;
        }

        .color-preview {
            width: 100px;
            height: 100px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            border: 1px solid #eef2f7;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
        }

        .color-values {
            flex: 1;
            min-width: 200px;
        }

        .color-value {
            background: white;
            border: 1px solid #eef2f7;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .color-value:last-child {
            margin-bottom: 0;
        }

        .value-label {
            font-weight: 600;
            color: #2c3e50;
        }

        .value-content {
            font-family: 'Courier New', monospace;
            font-weight: 600;
            padding: 5px 12px;
            border-radius: 6px;
            background: #f8fafc;
            color: #2c3e50;
        }

        .copied-message {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #27ae60;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            transform: translateX(150%);
            transition: transform 0.3s ease;
        }

        .copied-message.show {
            transform: translateX(0);
        }

        .color-value {
            cursor: pointer;
            transition: transform 0.2s;
        }

        .color-value:hover {
            transform: translateX(5px);
            border-color: #6a11cb;
        }

        .instructions {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 15px;
            border-radius: 0 8px 8px 0;
            margin-top: 20px;
            font-size: 0.95rem;
            color: #2c3e50;
        }

        .instructions ul {
            padding-left: 20px;
            margin-top: 10px;
        }

        .instructions li {
            margin-bottom: 8px;
            line-height: 1.5;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #7f8c8d;
            font-size: 0.9rem;
            border-top: 1px solid #eef2f7;
            background: #f9fbfd;
        }

        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }
            
            .canvas-container {
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-palette"></i> 图片取色器</h1>
            <p>上传图片，点击任意位置提取颜色值，支持十六进制和RGB格式</p>
        </header>
        
        <div class="main-content">
            <div class="upload-section">
                <div class="card">
                    <h2 class="card-title"><i class="fas fa-cloud-upload-alt"></i> 上传图片</h2>
                    
                    <div class="upload-area" id="drop-area">
                        <i class="fas fa-file-image"></i>
                        <h3>拖放图片或点击上传</h3>
                        <p>支持 JPG, PNG, GIF 格式的图片文件</p>
                        <button class="btn"><i class="fas fa-folder-open"></i> 选择图片</button>
                        <input type="file" id="file-input" accept="image/*">
                    </div>
                    
                    <div class="instructions">
                        <strong>使用说明：</strong>
                        <ul>
                            <li>点击上方按钮或拖放图片到虚线区域</li>
                            <li>图片加载后，点击图片上的任意位置</li>
                            <li>颜色值和预览将显示在右侧面板</li>
                            <li>点击颜色值可以复制到剪贴板</li>
                        </ul>
                    </div>
                </div>
            </div>
            
            <div class="preview-section">
                <div class="card">
                    <h2 class="card-title"><i class="fas fa-eye-dropper"></i> 颜色提取</h2>
                    
                    <div class="canvas-container">
                        <canvas id="image-canvas"></canvas>
                        <div class="placeholder" id="canvas-placeholder">
                            <i class="fas fa-mountain"></i>
                            <p>请上传图片开始提取颜色</p>
                        </div>
                    </div>
                    
                    <div class="color-info">
                        <div class="color-preview" id="color-preview"></div>
                        
                        <div class="color-values">
                            <div class="color-value" id="hex-value">
                                <span class="value-label">HEX 颜色值</span>
                                <span class="value-content">#------</span>
                            </div>
                            <div class="color-value" id="rgb-value">
                                <span class="value-label">RGB 颜色值</span>
                                <span class="value-content">rgb(---, ---, ---)</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <footer>
            <p>图片取色器工具 &copy; 2023 | 在浏览器中直接提取图片中的颜色</p>
        </footer>
    </div>
    
    <div class="copied-message" id="copied-message">
        <i class="fas fa-check-circle"></i> 已复制到剪贴板！
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const fileInput = document.getElementById('file-input');
            const dropArea = document.getElementById('drop-area');
            const canvas = document.getElementById('image-canvas');
            const ctx = canvas.getContext('2d');
            const canvasPlaceholder = document.getElementById('canvas-placeholder');
            const colorPreview = document.getElementById('color-preview');
            const hexValue = document.getElementById('hex-value');
            const rgbValue = document.getElementById('rgb-value');
            const copiedMessage = document.getElementById('copied-message');
            
            // 文件上传处理
            dropArea.addEventListener('click', () => {
                fileInput.click();
            });
            
            fileInput.addEventListener('change', function(e) {
                if (this.files && this.files[0]) {
                    loadImage(this.files[0]);
                }
            });
            
            // 拖放功能
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                dropArea.addEventListener(eventName, preventDefaults, false);
            });
            
            function preventDefaults(e) {
                e.preventDefault();
                e.stopPropagation();
            }
            
            ['dragenter', 'dragover'].forEach(eventName => {
                dropArea.addEventListener(eventName, highlight, false);
            });
            
            ['dragleave', 'drop'].forEach(eventName => {
                dropArea.addEventListener(eventName, unhighlight, false);
            });
            
            function highlight() {
                dropArea.style.borderColor = '#6a11cb';
                dropArea.style.backgroundColor = '#e0e7ff';
            }
            
            function unhighlight() {
                dropArea.style.borderColor = '#dce6f1';
                dropArea.style.backgroundColor = '#f8fafc';
            }
            
            dropArea.addEventListener('drop', handleDrop, false);
            
            function handleDrop(e) {
                const dt = e.dataTransfer;
                const file = dt.files[0];
                if (file && file.type.match('image.*')) {
                    loadImage(file);
                }
            }
            
            // 加载图片到画布
            function loadImage(file) {
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        // 设置画布尺寸
                        const maxWidth = 600;
                        const maxHeight = 400;
                        let width = img.width;
                        let height = img.height;
                        
                        if (width > maxWidth) {
                            height *= maxWidth / width;
                            width = maxWidth;
                        }
                        
                        if (height > maxHeight) {
                            width *= maxHeight / height;
                            height = maxHeight;
                        }
                        
                        canvas.width = width;
                        canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        canvas.style.display = 'block';
                        canvasPlaceholder.style.display = 'none';
                    };
                    img.src = e.target.result;
                };
                
                reader.readAsDataURL(file);
            }
            
            // 从画布获取颜色
            canvas.addEventListener('click', function(e) {
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                const pixel = ctx.getImageData(x, y, 1, 1).data;
                const r = pixel[0];
                const g = pixel[1];
                const b = pixel[2];
                
                // 转换为十六进制
                const hex = rgbToHex(r, g, b);
                
                // 更新UI
                colorPreview.style.background = `rgb(${r}, ${g}, ${b})`;
                hexValue.querySelector('.value-content').textContent = hex;
                rgbValue.querySelector('.value-content').textContent = `rgb(${r}, ${g}, ${b})`;
                
                // 存储颜色值用于复制
                hexValue.dataset.value = hex;
                rgbValue.dataset.value = `rgb(${r}, ${g}, ${b})`;
            });
            
            // RGB转十六进制
            function rgbToHex(r, g, b) {
                return '#' + [r, g, b].map(x => {
                    const hex = x.toString(16);
                    return hex.length === 1 ? '0' + hex : hex;
                }).join('');
            }
            
            // 复制颜色值功能
            [hexValue, rgbValue].forEach(element => {
                element.addEventListener('click', function() {
                    const textToCopy = this.dataset.value;
                    if (!textToCopy) return;
                    
                    navigator.clipboard.writeText(textToCopy).then(() => {
                        showCopiedMessage();
                    });
                });
            });
            
            function showCopiedMessage() {
                copiedMessage.classList.add('show');
                setTimeout(() => {
                    copiedMessage.classList.remove('show');
                }, 2000);
            }
            
            // 初始演示颜色
            colorPreview.style.background = 'linear-gradient(135deg, #6a11cb 0%, #2575fc 100%)';
        });
    </script>
</body>
</html>
