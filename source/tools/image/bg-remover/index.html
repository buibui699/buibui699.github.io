<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一键抠图去背景工具</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.11.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/body-pix@2.0.5"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #333;
        }
        
        .container {
            width: 100%;
            max-width: 1200px;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            backdrop-filter: blur(10px);
        }
        
        header {
            background: linear-gradient(90deg, #6a11cb 0%, #2575fc 100%);
            color: white;
            padding: 25px 40px;
            text-align: center;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .main-content {
            display: flex;
            flex-wrap: wrap;
            padding: 30px;
        }
        
        .upload-section {
            flex: 1;
            min-width: 300px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .result-section {
            flex: 1;
            min-width: 300px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .section-title {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #2c3e50;
            text-align: center;
        }
        
        .drop-area {
            width: 100%;
            height: 250px;
            border: 3px dashed #6a11cb;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.3s;
            cursor: pointer;
            background-color: #f8f9fa;
            margin-bottom: 20px;
        }
        
        .drop-area:hover, .drop-area.drag-over {
            background-color: #eef2ff;
            border-color: #2575fc;
        }
        
        .drop-area i {
            font-size: 60px;
            color: #6a11cb;
            margin-bottom: 15px;
        }
        
        .drop-area p {
            font-size: 1.1rem;
            color: #555;
            text-align: center;
        }
        
        .btn {
            background: linear-gradient(90deg, #6a11cb 0%, #2575fc 100%);
            color: white;
            border: none;
            padding: 14px 30px;
            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }
        
        .btn:active {
            transform: translateY(-1px);
        }
        
        .btn:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .btn i {
            font-size: 1.3rem;
        }
        
        .file-input {
            display: none;
        }
        
        .preview-container {
            width: 100%;
            height: 300px;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            border: 2px solid #e0e0e0;
        }
        
        .preview-image {
            max-width: 100%;
            max-height: 100%;
            display: none;
        }
        
        .placeholder-text {
            color: #95a5a6;
            font-size: 1.1rem;
            text-align: center;
            padding: 20px;
        }
        
        .result-container {
            position: relative;
            width: 100%;
            height: 300px;
            border-radius: 15px;
            overflow: hidden;
            background: 
                linear-gradient(45deg, #f0f0f0 25%, transparent 25%, transparent 75%, #f0f0f0 75%),
                linear-gradient(45deg, #f0f0f0 25%, transparent 25%, transparent 75%, #f0f0f0 75%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            border: 2px solid #e0e0e0;
        }
        
        .result-image {
            max-width: 100%;
            max-height: 100%;
            display: none;
        }
        
        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            margin-top: 15px;
        }
        
        .processing {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            margin: 20px 0;
            display: none;
        }
        
        .progress-container {
            width: 100%;
            max-width: 400px;
            height: 12px;
            background-color: #ecf0f1;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #6a11cb 0%, #2575fc 100%);
            width: 0%;
            transition: width 0.3s;
        }
        
        .status-text {
            color: #2c3e50;
            font-size: 1.1rem;
        }
        
        .features {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 30px;
            background-color: #f8f9fa;
            border-top: 1px solid #eee;
        }
        
        .feature-card {
            flex: 1;
            min-width: 250px;
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            text-align: center;
            transition: transform 0.3s;
        }
        
        .feature-card:hover {
            transform: translateY(-5px);
        }
        
        .feature-card i {
            font-size: 40px;
            color: #6a11cb;
            margin-bottom: 15px;
        }
        
        .feature-card h3 {
            font-size: 1.4rem;
            margin-bottom: 10px;
            color: #2c3e50;
        }
        
        .feature-card p {
            color: #7f8c8d;
            line-height: 1.6;
        }
        
        footer {
            text-align: center;
            padding: 20px;
            color: #7f8c8d;
            font-size: 0.9rem;
            background-color: rgba(0, 0, 0, 0.02);
            border-top: 1px solid #eee;
        }
        
        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .btn {
                width: 100%;
                padding: 12px;
            }
            
            .controls {
                flex-direction: column;
            }
        }
        
        .quality-info {
            margin-top: 15px;
            color: #7f8c8d;
            font-size: 0.9rem;
            text-align: center;
            padding: 0 20px;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>一键抠图去背景工具</h1>
            <p class="subtitle">上传图片，AI自动去除背景，快速获取透明PNG图片</p>
        </header>
        
        <div class="main-content">
            <div class="upload-section">
                <h2 class="section-title">上传图片</h2>
                <div class="drop-area" id="dropArea">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <p>拖放图片到此处或点击上传</p>
                    <p class="quality-info">支持 JPG、PNG 格式，建议使用人物照片效果最佳</p>
                </div>
                <input type="file" id="fileInput" class="file-input" accept="image/*">
                
                <div class="preview-container">
                    <img id="previewImage" class="preview-image" alt="预览图片">
                    <p id="previewPlaceholder" class="placeholder-text">图片预览区域</p>
                </div>
                
                <button id="processBtn" class="btn" disabled>
                    <i class="fas fa-magic"></i> 一键抠图
                </button>
            </div>
            
            <div class="result-section">
                <h2 class="section-title">处理结果</h2>
                <div class="result-container">
                    <canvas id="resultCanvas"></canvas>
                    <img id="resultImage" class="result-image" alt="处理结果">
                    <p id="resultPlaceholder" class="placeholder-text">处理结果将显示在这里</p>
                </div>
                
                <div class="processing" id="processing">
                    <div class="progress-container">
                        <div class="progress-bar" id="progressBar"></div>
                    </div>
                    <p class="status-text" id="statusText">正在初始化模型...</p>
                </div>
                
                <div class="controls">
                    <button id="downloadBtn" class="btn" disabled>
                        <i class="fas fa-download"></i> 下载结果
                    </button>
                    <button id="resetBtn" class="btn">
                        <i class="fas fa-redo"></i> 重新开始
                    </button>
                </div>
            </div>
        </div>
        
        <div class="features">
            <div class="feature-card">
                <i class="fas fa-bolt"></i>
                <h3>快速处理</h3>
                <p>利用先进的AI技术，只需几秒钟即可完成背景去除</p>
            </div>
            <div class="feature-card">
                <i class="fas fa-lock"></i>
                <h3>隐私保护</h3>
                <p>所有处理都在浏览器中完成，图片不会上传到任何服务器</p>
            </div>
            <div class="feature-card">
                <i class="fas fa-image"></i>
                <h3>高质量结果</h3>
                <p>生成透明背景的PNG图片，保留原始图像质量</p>
            </div>
        </div>
        
        <footer>
            <p>© 2023 一键抠图去背景工具 | 基于TensorFlow.js和BodyPix技术</p>
        </footer>
    </div>

    <script>
        // 全局变量
        let net;
        let originalImage;
        
        // DOM元素
        const dropArea = document.getElementById('dropArea');
        const fileInput = document.getElementById('fileInput');
        const previewImage = document.getElementById('previewImage');
        const previewPlaceholder = document.getElementById('previewPlaceholder');
        const processBtn = document.getElementById('processBtn');
        const resultCanvas = document.getElementById('resultCanvas');
        const resultImage = document.getElementById('resultImage');
        const resultPlaceholder = document.getElementById('resultPlaceholder');
        const downloadBtn = document.getElementById('downloadBtn');
        const resetBtn = document.getElementById('resetBtn');
        const processing = document.getElementById('processing');
        const progressBar = document.getElementById('progressBar');
        const statusText = document.getElementById('statusText');
        
        // 初始化
        document.addEventListener('DOMContentLoaded', async function() {
            // 设置事件监听器
            setupEventListeners();
            
            // 初始化模型
            processing.style.display = 'flex';
            statusText.textContent = '正在加载AI模型...';
            
            try {
                net = await bodyPix.load({
                    architecture: 'MobileNetV1',
                    outputStride: 16,
                    multiplier: 0.75,
                    quantBytes: 2
                });
                
                progressBar.style.width = '100%';
                statusText.textContent = '模型加载完成！';
                
                // 2秒后隐藏进度条
                setTimeout(() => {
                    processing.style.display = 'none';
                }, 2000);
            } catch (error) {
                console.error('模型加载失败:', error);
                statusText.textContent = '模型加载失败，请刷新页面重试';
                progressBar.style.backgroundColor = '#e74c3c';
            }
        });
        
        // 设置事件监听器
        function setupEventListeners() {
            // 点击上传区域触发文件选择
            dropArea.addEventListener('click', () => {
                fileInput.click();
            });
            
            // 拖放功能
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                dropArea.addEventListener(eventName, preventDefaults, false);
            });
            
            function preventDefaults(e) {
                e.preventDefault();
                e.stopPropagation();
            }
            
            ['dragenter', 'dragover'].forEach(eventName => {
                dropArea.addEventListener(eventName, highlight, false);
            });
            
            ['dragleave', 'drop'].forEach(eventName => {
                dropArea.addEventListener(eventName, unhighlight, false);
            });
            
            function highlight() {
                dropArea.classList.add('drag-over');
            }
            
            function unhighlight() {
                dropArea.classList.remove('drag-over');
            }
            
            // 处理文件放置
            dropArea.addEventListener('drop', handleDrop, false);
            
            function handleDrop(e) {
                const dt = e.dataTransfer;
                const files = dt.files;
                handleFiles(files);
            }
            
            // 处理文件选择
            fileInput.addEventListener('change', function() {
                handleFiles(this.files);
            });
            
            // 处理按钮点击
            processBtn.addEventListener('click', processImage);
            downloadBtn.addEventListener('click', downloadResult);
            resetBtn.addEventListener('click', resetAll);
        }
        
        // 处理选择的文件
        function handleFiles(files) {
            if (files.length === 0) return;
            
            const file = files[0];
            if (!file.type.match('image.*')) {
                alert('请选择图片文件 (JPG, PNG)');
                return;
            }
            
            const reader = new FileReader();
            reader.onload = function(e) {
                originalImage = new Image();
                originalImage.onload = function() {
                    // 显示预览
                    previewImage.src = originalImage.src;
                    previewImage.style.display = 'block';
                    previewPlaceholder.style.display = 'none';
                    
                    // 重置结果区域
                    resultImage.style.display = 'none';
                    resultPlaceholder.style.display = 'block';
                    
                    // 启用处理按钮
                    processBtn.disabled = false;
                };
                originalImage.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }
        
        // 处理图像
        async function processImage() {
            if (!originalImage || !net) return;
            
            // 禁用按钮
            processBtn.disabled = true;
            
            // 显示处理状态
            processing.style.display = 'flex';
            progressBar.style.width = '30%';
            statusText.textContent = '正在分析图像...';
            
            try {
                // 设置canvas尺寸
                resultCanvas.width = originalImage.width;
                resultCanvas.height = originalImage.height;
                const ctx = resultCanvas.getContext('2d');
                
                // 绘制原始图像
                ctx.drawImage(originalImage, 0, 0);
                
                // 更新进度
                progressBar.style.width = '60%';
                statusText.textContent = '正在去除背景...';
                
                // 执行分割
                const segmentation = await net.segmentPerson(originalImage, {
                    flipHorizontal: false,
                    internalResolution: 'high',
                    segmentationThreshold: 0.7
                });
                
                // 更新进度
                progressBar.style.width = '80%';
                statusText.textContent = '正在生成结果...';
                
                // 创建掩码
                const mask = bodyPix.toMask(segmentation);
                const opacity = 1;
                const maskBlurAmount = 3;
                const flipHorizontal = false;
                
                // 绘制背景透明结果
                bodyPix.drawMask(
                    resultCanvas, 
                    originalImage, 
                    mask, 
                    opacity, 
                    maskBlurAmount, 
                    flipHorizontal
                );
                
                // 显示结果
                resultImage.src = resultCanvas.toDataURL('image/png');
                resultImage.style.display = 'block';
                resultPlaceholder.style.display = 'none';
                
                // 完成
                progressBar.style.width = '100%';
                statusText.textContent = '处理完成！';
                
                // 启用下载按钮
                downloadBtn.disabled = false;
                
                // 2秒后隐藏进度条
                setTimeout(() => {
                    processing.style.display = 'none';
                }, 2000);
            } catch (error) {
                console.error('处理失败:', error);
                statusText.textContent = '处理失败，请重试';
                progressBar.style.backgroundColor = '#e74c3c';
                
                // 重新启用处理按钮
                processBtn.disabled = false;
            }
        }
        
        // 下载结果
        function downloadResult() {
            if (!resultImage.src) return;
            
            const link = document.createElement('a');
            link.download = '去背景图片.png';
            link.href = resultImage.src;
            link.click();
        }
        
        // 重置所有
        function resetAll() {
            // 重置上传区域
            fileInput.value = '';
            previewImage.src = '';
            previewImage.style.display = 'none';
            previewPlaceholder.style.display = 'block';
            
            // 重置结果区域
            resultImage.src = '';
            resultImage.style.display = 'none';
            resultPlaceholder.style.display = 'block';
            
            // 重置按钮状态
            processBtn.disabled = true;
            downloadBtn.disabled = true;
            
            // 隐藏处理状态
            processing.style.display = 'none';
            progressBar.style.width = '0%';
            progressBar.style.backgroundColor = '';
        }
    </script>
</body>
</html>
