<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今天吃什么？ - 随机美食选择器</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --accent: #FFD166;
            --dark: #1A535C;
            --light: #F7FFF7;
            --gray: #6c757d;
        }

        body {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #333;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            color: white;
            text-align: center;
            padding: 30px 20px;
            position: relative;
        }

        h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto;
        }

        .main-content {
            display: flex;
            flex-wrap: wrap;
            padding: 20px;
            gap: 20px;
        }

        .left-panel {
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .result-container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            text-align: center;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .food-display {
            font-size: 3.5rem;
            margin: 20px 0;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .food-image {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            object-fit: cover;
            margin: 15px 0;
            border: 5px solid var(--accent);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        }

        .btn-primary:hover {
            background: #ff5252;
            transform: translateY(-3px);
        }

        .btn-secondary {
            background: var(--secondary);
            color: white;
        }

        .btn-secondary:hover {
            background: #3bbdb5;
            transform: translateY(-3px);
        }

        .btn-accent {
            background: var(--accent);
            color: #333;
        }

        .btn-accent:hover {
            background: #ffc54d;
            transform: translateY(-3px);
        }

        .right-panel {
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .panel {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }

        .panel-title {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .food-list {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 15px;
        }

        .food-tag {
            background: #e9ecef;
            padding: 8px 15px;
            border-radius: 50px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .food-tag .remove {
            cursor: pointer;
            color: var(--gray);
            transition: color 0.2s;
        }

        .food-tag .remove:hover {
            color: var(--primary);
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 200px;
            overflow-y: auto;
            padding-right: 10px;
        }

        .history-item {
            padding: 10px 15px;
            background: #f8f9fa;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
        }

        .history-item .time {
            color: var(--gray);
            font-size: 0.8rem;
        }

        .add-food-form {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .add-food-input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e9ecef;
            border-radius: 50px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .add-food-input:focus {
            outline: none;
            border-color: var(--secondary);
        }

        footer {
            text-align: center;
            padding: 20px;
            background: var(--dark);
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }
            
            h1 {
                font-size: 2.2rem;
            }
            
            .food-display {
                font-size: 2.5rem;
            }
        }

        /* Animation for food selection */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .pulse {
            animation: pulse 0.5s ease;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #aaa;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-utensils"></i> 今天吃什么？</h1>
            <p class="subtitle">让随机美食选择器帮你解决每日的饮食难题！点击按钮获取美食推荐，收藏喜欢的选项，记录历史选择</p>
        </header>
        
        <div class="main-content">
            <div class="left-panel">
                <div class="result-container">
                    <h2>今日美食推荐</h2>
                    <div class="food-display" id="foodResult">点击下方按钮开始</div>
                    <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=600&q=80" alt="美食图片" class="food-image" id="foodImage">
                    <div class="action-buttons">
                        <button class="btn btn-primary" id="randomBtn">
                            <i class="fas fa-random"></i> 随机选择
                        </button>
                        <button class="btn btn-secondary" id="favoriteBtn">
                            <i class="fas fa-heart"></i> 收藏
                        </button>
                        <button class="btn btn-accent" id="addCustomBtn">
                            <i class="fas fa-plus"></i> 添加美食
                        </button>
                    </div>
                </div>
                
                <div class="panel">
                    <h3 class="panel-title"><i class="fas fa-history"></i> 历史记录</h3>
                    <div class="history-list" id="historyList">
                        <!-- 历史记录会动态添加到这里 -->
                    </div>
                </div>
            </div>
            
            <div class="right-panel">
                <div class="panel">
                    <h3 class="panel-title"><i class="fas fa-star"></i> 我的收藏夹</h3>
                    <div class="food-list" id="favoritesList">
                        <!-- 收藏夹内容会动态添加到这里 -->
                    </div>
                </div>
                
                <div class="panel">
                    <h3 class="panel-title"><i class="fas fa-list"></i> 美食选项库</h3>
                    <div class="food-list" id="foodOptions">
                        <!-- 美食选项会动态添加到这里 -->
                    </div>
                    
                    <div class="add-food-form">
                        <input type="text" class="add-food-input" id="newFoodInput" placeholder="输入新的美食选项...">
                        <button class="btn btn-secondary" id="addFoodBtn">
                            <i class="fas fa-plus"></i> 添加
                        </button>
                    </div>
                </div>
            </div>
        </div>
        
        <footer>
            <p>© 2023 随机美食选择器 | 解决你的"今天吃什么"难题</p>
        </footer>
    </div>

    <script>
        // 初始美食选项
        const initialFoods = [
            "火锅", "披萨", "寿司", "汉堡", "炸鸡", "拉面", "饺子", 
            "炒饭", "牛排", "沙拉", "烧烤", "咖喱", "意大利面", "麻辣烫",
            "三明治", "粥", "汤面", "盖浇饭", "烤肉", "馄饨", "烤鸭", "海鲜"
        ];
        
        // 获取DOM元素
        const foodResult = document.getElementById('foodResult');
        const foodImage = document.getElementById('foodImage');
        const randomBtn = document.getElementById('randomBtn');
        const favoriteBtn = document.getElementById('favoriteBtn');
        const addCustomBtn = document.getElementById('addCustomBtn');
        const favoritesList = document.getElementById('favoritesList');
        const foodOptions = document.getElementById('foodOptions');
        const historyList = document.getElementById('historyList');
        const newFoodInput = document.getElementById('newFoodInput');
        const addFoodBtn = document.getElementById('addFoodBtn');
        
        // 状态数据
        let foods = [...initialFoods];
        let favorites = JSON.parse(localStorage.getItem('favorites')) || [];
        let history = JSON.parse(localStorage.getItem('history')) || [];
        
        // 美食图片映射
        const foodImages = {
            "火锅": "https://images.unsplash.com/photo-1585032226651-759b368d7246?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=600&q=80",
            "披萨": "https://images.unsplash.com/photo-1513104890138-7c749659a591?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=600&q=80",
            "寿司": "https://images.unsplash.com/photo-1617196034796-73dfa7b1fd56?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=600&q=80",
            "汉堡": "https://images.unsplash.com/photo-1572802419224-296b0aeee0d9?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=600&q=80",
            "炸鸡": "https://images.unsplash.com/photo-1626082927389-6cd097cee6a6?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=600&q=80",
            "拉面": "https://images.unsplash.com/photo-1569718212165-3a8278d5f624?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=600&q=80",
            "饺子": "https://images.unsplash.com/photo-1603894584373-5ac82b2ae398?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=600&q=80",
            "炒饭": "https://images.unsplash.com/photo-1630918326541-08b7dab1fb5d?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=600&q=80",
            "牛排": "https://images.unsplash.com/photo-1607116667981-ffbcba8b8e4d?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=600&q=80",
            "沙拉": "https://images.unsplash.com/photo-1512621776951-a57141f2eefd?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=600&q=80",
            "烧烤": "https://images.unsplash.com/photo-1555939594-58d7cb561ad1?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=600&q=80",
            "咖喱": "https://images.unsplash.com/photo-1633945274309-2c16c9682a8c?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=600&q=80",
            "意大利面": "https://images.unsplash.com/photo-1608897013039-887f21d8c804?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=600&q=80",
            "麻辣烫": "https://images.unsplash.com/photo-1617093727343-374698b1b7dd?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=600&q=80",
            "三明治": "https://images.unsplash.com/photo-1485451456034-3f9391c6f769?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=600&q=80",
            "粥": "https://images.unsplash.com/photo-1587049633312-d628ae50a8ae?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=600&q=80",
            "汤面": "https://images.unsplash.com/photo-1612927601601-6638404737ce?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=600&q=80",
            "盖浇饭": "https://images.unsplash.com/photo-1603133872878-684f208fb84b?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=600&q=80",
            "烤肉": "https://images.unsplash.com/photo-1544025162-d76694265947?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=600&q=80",
            "馄饨": "https://images.unsplash.com/photo-1589101738692-4a5c6c0c8a0b?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=600&q=80",
            "烤鸭": "https://images.unsplash.com/photo-1585032226651-759b368d7246?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=600&q=80",
            "海鲜": "https://images.unsplash.com/photo-1519708227418-c8fd9a32b7a2?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=600&q=80"
        };
        
        // 初始化页面
        function initPage() {
            renderFoodOptions();
            renderFavorites();
            renderHistory();
            
            // 如果历史记录不为空，显示最后一次选择
            if (history.length > 0) {
                const lastSelection = history[0];
                foodResult.textContent = lastSelection.food;
                foodImage.src = foodImages[lastSelection.food] || foodImages["火锅"];
            }
        }
        
        // 渲染美食选项
        function renderFoodOptions() {
            foodOptions.innerHTML = '';
            foods.forEach(food => {
                const foodTag = document.createElement('div');
                foodTag.className = 'food-tag';
                foodTag.innerHTML = `
                    ${food}
                    <span class="remove" onclick="removeFood('${food}')">
                        <i class="fas fa-times"></i>
                    </span>
                `;
                foodOptions.appendChild(foodTag);
            });
        }
        
        // 渲染收藏夹
        function renderFavorites() {
            favoritesList.innerHTML = '';
            if (favorites.length === 0) {
                favoritesList.innerHTML = '<p style="color: var(--gray);">暂无收藏，点击❤️收藏喜欢的美食</p>';
                return;
            }
            
            favorites.forEach(food => {
                const foodTag = document.createElement('div');
                foodTag.className = 'food-tag';
                foodTag.innerHTML = `
                    ${food}
                    <span class="remove" onclick="removeFavorite('${food}')">
                        <i class="fas fa-times"></i>
                    </span>
                `;
                favoritesList.appendChild(foodTag);
            });
        }
        
        // 渲染历史记录
        function renderHistory() {
            historyList.innerHTML = '';
            if (history.length === 0) {
                historyList.innerHTML = '<p style="color: var(--gray); padding: 20px; text-align: center;">暂无历史记录</p>';
                return;
            }
            
            history.slice(0, 10).forEach(item => {
                const historyItem = document.createElement('div');
                historyItem.className = 'history-item';
                historyItem.innerHTML = `
                    <span>${item.food}</span>
                    <span class="time">${formatTime(item.time)}</span>
                `;
                historyList.appendChild(historyItem);
            });
        }
        
        // 格式化时间
        function formatTime(timestamp) {
            const date = new Date(timestamp);
            return `${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}`;
        }
        
        // 随机选择美食
        function selectRandomFood() {
            if (foods.length === 0) {
                foodResult.textContent = "请先添加美食选项";
                return;
            }
            
            // 添加动画效果
            foodResult.classList.add('pulse');
            setTimeout(() => {
                foodResult.classList.remove('pulse');
            }, 500);
            
            // 随机选择一个美食
            const randomIndex = Math.floor(Math.random() * foods.length);
            const selectedFood = foods[randomIndex];
            
            // 更新显示
            foodResult.textContent = selectedFood;
            foodImage.src = foodImages[selectedFood] || foodImages["火锅"];
            
            // 添加到历史记录
            addToHistory(selectedFood);
        }
        
        // 添加到历史记录
        function addToHistory(food) {
            const now = new Date();
            history.unshift({
                food: food,
                time: now.getTime()
            });
            
            // 只保留最近10条记录
            if (history.length > 10) {
                history.pop();
            }
            
            // 保存到localStorage
            localStorage.setItem('history', JSON.stringify(history));
            
            // 更新显示
            renderHistory();
        }
        
        // 添加到收藏夹
        function addToFavorites() {
            const currentFood = foodResult.textContent;
            
            if (currentFood === "点击下方按钮开始" || currentFood === "请先添加美食选项") {
                alert("请先选择一个美食");
                return;
            }
            
            if (!favorites.includes(currentFood)) {
                favorites.push(currentFood);
                localStorage.setItem('favorites', JSON.stringify(favorites));
                renderFavorites();
                
                // 添加动画效果
                favoriteBtn.innerHTML = '<i class="fas fa-check"></i> 已收藏';
                favoriteBtn.style.backgroundColor = '#28a745';
                setTimeout(() => {
                    favoriteBtn.innerHTML = '<i class="fas fa-heart"></i> 收藏';
                    favoriteBtn.style.backgroundColor = '';
                }, 2000);
            } else {
                alert("该美食已在收藏夹中");
            }
        }
        
        // 从收藏夹中移除
        function removeFavorite(food) {
            favorites = favorites.filter(f => f !== food);
            localStorage.setItem('favorites', JSON.stringify(favorites));
            renderFavorites();
        }
        
        // 添加新的美食选项
        function addNewFood() {
            const newFood = newFoodInput.value.trim();
            
            if (!newFood) {
                alert("请输入美食名称");
                return;
            }
            
            if (foods.includes(newFood)) {
                alert("该美食已在选项库中");
                return;
            }
            
            foods.push(newFood);
            renderFoodOptions();
            newFoodInput.value = '';
            
            // 添加动画效果
            addFoodBtn.innerHTML = '<i class="fas fa-check"></i> 已添加';
            setTimeout(() => {
                addFoodBtn.innerHTML = '<i class="fas fa-plus"></i> 添加';
            }, 2000);
        }
        
        // 从选项库中移除
        function removeFood(food) {
            foods = foods.filter(f => f !== food);
            renderFoodOptions();
        }
        
        // 事件监听
        randomBtn.addEventListener('click', selectRandomFood);
        favoriteBtn.addEventListener('click', addToFavorites);
        addFoodBtn.addEventListener('click', addNewFood);
        
        // 支持按回车键添加美食
        newFoodInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                addNewFood();
            }
        });
        
        // 页面加载时初始化
        window.onload = initPage;
    </script>
</body>
</html>
