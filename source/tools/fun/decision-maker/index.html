<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抽签决策器 - 帮你做选择</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #333;
        }
        
        .container {
            width: 100%;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.92);
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(90deg, #4b6cb7, #182848);
            color: white;
            text-align: center;
            padding: 25px 20px;
            position: relative;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        
        h1 i {
            font-size: 2.2rem;
            color: #FFD700;
        }
        
        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .main-content {
            display: flex;
            flex-wrap: wrap;
            padding: 25px;
        }
        
        .options-section {
            flex: 1;
            min-width: 300px;
            padding: 20px;
        }
        
        .draw-section {
            flex: 1;
            min-width: 300px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .section-title {
            font-size: 1.4rem;
            margin-bottom: 20px;
            color: #2c3e50;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .section-title i {
            color: #3498db;
        }
        
        .input-group {
            display: flex;
            margin-bottom: 20px;
        }
        
        .input-group input {
            flex: 1;
            padding: 14px;
            border: 2px solid #ddd;
            border-radius: 8px 0 0 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }
        
        .input-group input:focus {
            border-color: #3498db;
        }
        
        .btn {
            padding: 14px 20px;
            border: none;
            border-radius: 0 8px 8px 0;
            background: #3498db;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn:hover {
            background: #2980b9;
        }
        
        .btn:active {
            transform: scale(0.98);
        }
        
        .btn-danger {
            background: #e74c3c;
        }
        
        .btn-danger:hover {
            background: #c0392b;
        }
        
        .btn-success {
            background: #2ecc71;
        }
        
        .btn-success:hover {
            background: #27ae60;
        }
        
        .options-list {
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 20px;
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 10px;
        }
        
        .option-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: #f9f9f9;
            border-radius: 6px;
            margin-bottom: 10px;
            transition: all 0.3s;
            animation: fadeIn 0.4s ease-out;
        }
        
        .option-item:hover {
            background: #f0f7ff;
            transform: translateX(5px);
        }
        
        .option-item:last-child {
            margin-bottom: 0;
        }
        
        .option-text {
            flex: 1;
            padding-right: 10px;
            font-size: 1.05rem;
        }
        
        .option-actions {
            display: flex;
            gap: 8px;
        }
        
        .option-actions button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        
        .option-actions .edit-btn {
            color: #3498db;
        }
        
        .option-actions .delete-btn {
            color: #e74c3c;
        }
        
        .option-actions button:hover {
            background: rgba(0, 0, 0, 0.05);
        }
        
        .draw-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 300px;
        }
        
        .wheel-container {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 20px 0;
        }
        
        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(90deg, #3498db, #2ecc71, #f1c40f, #e74c3c, #9b59b6);
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.83, 0.67);
        }
        
        .wheel-pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 40px;
            background: #e74c3c;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            z-index: 10;
        }
        
        .result-container {
            width: 100%;
            text-align: center;
            margin: 25px 0;
            min-height: 100px;
        }
        
        .result {
            font-size: 2.2rem;
            font-weight: bold;
            color: #e74c3c;
            background: #f9f9f9;
            padding: 25px;
            border-radius: 12px;
            margin: 20px 0;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .actions {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }
        
        .draw-btn {
            padding: 16px 35px;
            font-size: 1.2rem;
            border-radius: 50px;
            background: linear-gradient(90deg, #FF512F, #F09819);
            border: none;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(240, 152, 25, 0.4);
        }
        
        .draw-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(240, 152, 25, 0.6);
        }
        
        .draw-btn:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .empty-message {
            text-align: center;
            color: #7f8c8d;
            padding: 20px;
            font-style: italic;
        }
        
        .history-section {
            padding: 20px;
            background: #f8f9fa;
            border-top: 1px solid #eee;
        }
        
        .history-title {
            font-size: 1.3rem;
            margin-bottom: 15px;
            color: #2c3e50;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .history-list {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding: 10px 5px;
        }
        
        .history-item {
            background: white;
            padding: 12px 20px;
            border-radius: 8px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
            min-width: 150px;
            text-align: center;
            font-weight: 500;
            animation: fadeIn 0.5s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .pulse {
            animation: pulse 0.5s ease-in-out;
        }
        
        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }
            
            .wheel-container {
                width: 220px;
                height: 220px;
            }
            
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-dice"></i> 抽签决策器</h1>
            <p class="subtitle">输入您的选项，让命运为您做出选择！支持添加、编辑、删除选项，记录历史结果</p>
        </header>
        
        <div class="main-content">
            <div class="options-section">
                <h2 class="section-title"><i class="fas fa-list"></i> 选项列表</h2>
                <div class="input-group">
                    <input type="text" id="newOption" placeholder="输入一个新选项...">
                    <button class="btn" id="addBtn"><i class="fas fa-plus"></i> 添加</button>
                </div>
                
                <div class="options-list" id="optionsList">
                    <div class="empty-message">暂无选项，请添加您的选择项</div>
                </div>
                
                <div class="actions">
                    <button class="btn btn-danger" id="clearBtn"><i class="fas fa-trash"></i> 清空列表</button>
                    <button class="btn btn-success" id="exampleBtn"><i class="fas fa-lightbulb"></i> 示例选项</button>
                </div>
            </div>
            
            <div class="draw-section">
                <h2 class="section-title"><i class="fas fa-magic"></i> 抽签区</h2>
                
                <div class="wheel-container">
                    <div class="wheel-pointer"></div>
                    <div class="wheel" id="wheel"></div>
                </div>
                
                <div class="result-container">
                    <h3>抽签结果：</h3>
                    <div class="result" id="result">等待抽签...</div>
                    <button class="draw-btn" id="drawBtn" disabled><i class="fas fa-play"></i> 开始抽签</button>
                </div>
            </div>
        </div>
        
        <div class="history-section">
            <h3 class="history-title"><i class="fas fa-history"></i> 历史记录</h3>
            <div class="history-list" id="historyList">
                <div class="empty-message">暂无历史记录</div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // DOM 元素
            const newOptionInput = document.getElementById('newOption');
            const addBtn = document.getElementById('addBtn');
            const optionsList = document.getElementById('optionsList');
            const clearBtn = document.getElementById('clearBtn');
            const exampleBtn = document.getElementById('exampleBtn');
            const drawBtn = document.getElementById('drawBtn');
            const resultDiv = document.getElementById('result');
            const wheel = document.getElementById('wheel');
            const historyList = document.getElementById('historyList');
            
            // 存储选项和历史的数组
            let options = [];
            let history = [];
            
            // 添加选项
            addBtn.addEventListener('click', addOption);
            newOptionInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') addOption();
            });
            
            function addOption() {
                const optionText = newOptionInput.value.trim();
                if (optionText) {
                    options.push(optionText);
                    renderOptions();
                    newOptionInput.value = '';
                    newOptionInput.focus();
                    updateDrawButton();
                }
            }
            
            // 渲染选项列表
            function renderOptions() {
                if (options.length === 0) {
                    optionsList.innerHTML = '<div class="empty-message">暂无选项，请添加您的选择项</div>';
                    return;
                }
                
                optionsList.innerHTML = '';
                options.forEach((option, index) => {
                    const optionItem = document.createElement('div');
                    optionItem.className = 'option-item';
                    optionItem.innerHTML = `
                        <div class="option-text">${index + 1}. ${option}</div>
                        <div class="option-actions">
                            <button class="edit-btn" data-index="${index}"><i class="fas fa-edit"></i></button>
                            <button class="delete-btn" data-index="${index}"><i class="fas fa-trash"></i></button>
                        </div>
                    `;
                    optionsList.appendChild(optionItem);
                });
                
                // 添加事件监听器
                document.querySelectorAll('.edit-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const index = this.getAttribute('data-index');
                        editOption(index);
                    });
                });
                
                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const index = this.getAttribute('data-index');
                        deleteOption(index);
                    });
                });
            }
            
            // 编辑选项
            function editOption(index) {
                const newText = prompt('编辑选项:', options[index]);
                if (newText !== null && newText.trim() !== '') {
                    options[index] = newText.trim();
                    renderOptions();
                }
            }
            
            // 删除选项
            function deleteOption(index) {
                if (confirm('确定要删除这个选项吗?')) {
                    options.splice(index, 1);
                    renderOptions();
                    updateDrawButton();
                }
            }
            
            // 清空选项
            clearBtn.addEventListener('click', function() {
                if (options.length > 0 && confirm('确定要清空所有选项吗?')) {
                    options = [];
                    renderOptions();
                    updateDrawButton();
                }
            });
            
            // 示例选项
            exampleBtn.addEventListener('click', function() {
                options = [
                    '吃火锅',
                    '看电影',
                    '去公园散步',
                    '在家休息',
                    '学习新技能',
                    '和朋友聚会'
                ];
                renderOptions();
                updateDrawButton();
            });
            
            // 更新抽签按钮状态
            function updateDrawButton() {
                drawBtn.disabled = options.length < 2;
            }
            
            // 抽签功能
            drawBtn.addEventListener('click', startDraw);
            
            function startDraw() {
                if (options.length < 2) return;
                
                // 禁用按钮
                drawBtn.disabled = true;
                resultDiv.textContent = '抽签中...';
                resultDiv.style.color = '#3498db';
                
                // 模拟抽签动画
                let count = 0;
                const maxCount = 20 + Math.floor(Math.random() * 10);
                const interval = setInterval(() => {
                    const randomIndex = Math.floor(Math.random() * options.length);
                    resultDiv.textContent = options[randomIndex];
                    
                    // 旋转转盘
                    wheel.style.transform = `rotate(${count * 180}deg)`;
                    
                    count++;
                    if (count > maxCount) {
                        clearInterval(interval);
                        finishDraw();
                    }
                }, 100);
            }
            
            function finishDraw() {
                const randomIndex = Math.floor(Math.random() * options.length);
                const selectedOption = options[randomIndex];
                
                // 显示结果
                resultDiv.textContent = selectedOption;
                resultDiv.style.color = '#e74c3c';
                resultDiv.classList.add('pulse');
                
                // 添加到历史
                history.unshift(selectedOption);
                if (history.length > 10) history.pop();
                renderHistory();
                
                // 启用按钮
                setTimeout(() => {
                    drawBtn.disabled = false;
                    resultDiv.classList.remove('pulse');
                }, 1000);
            }
            
            // 渲染历史记录
            function renderHistory() {
                if (history.length === 0) {
                    historyList.innerHTML = '<div class="empty-message">暂无历史记录</div>';
                    return;
                }
                
                historyList.innerHTML = '';
                history.forEach(item => {
                    const historyItem = document.createElement('div');
                    historyItem.className = 'history-item';
                    historyItem.textContent = item;
                    historyList.appendChild(historyItem);
                });
            }
            
            // 初始化
            renderOptions();
            renderHistory();
        });
    </script>
</body>
</html>
