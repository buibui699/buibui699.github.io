<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>答案之书 </title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 1000px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            padding: 30px;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #4776E6 0%, #8E54E9 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        
        header p {
            color: #555;
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }
        
        .main-content {
            display: flex;
            gap: 30px;
            margin-bottom: 30px;
        }
        
        .book-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .info-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        
        .book-container {
            perspective: 2000px;
            width: 100%;
            max-width: 400px;
            height: 500px;
            position: relative;
            margin-bottom: 30px;
        }
        
        .book {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 1.2s cubic-bezier(0.645, 0.045, 0.355, 1);
        }
        
        .book-page {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            text-align: center;
        }
        
        .front-cover {
            background: linear-gradient(45deg, #4776E6 0%, #8E54E9 100%);
            color: white;
            transform: rotateY(0deg);
            z-index: 2;
        }
        
        .content-page {
            background: #fffdf5;
            color: #333;
            transform: rotateY(180deg);
            z-index: 3;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.05);
            border: 1px solid #e0d6c3;
        }
        
        .book.open {
            transform: rotateY(-180deg);
        }
        
        .book-title {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            color: white;
        }
        
        .book-subtitle {
            font-size: 1.3rem;
            font-style: italic;
            margin-bottom: 40px;
            max-width: 80%;
            color: rgba(255, 255, 255, 0.9);
        }
        
        .advice-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            position: relative;
        }
        
        .advice-text {
            font-size: 2rem;
            line-height: 1.5;
            margin-bottom: 30px;
            font-weight: 500;
            color: #2c3e50;
            max-width: 90%;
            position: relative;
            padding: 20px;
        }
        
        .advice-text::before, .advice-text::after {
            content: """;
            font-size: 5rem;
            position: absolute;
            color: rgba(139, 0, 0, 0.15);
            font-family: serif;
        }
        
        .advice-text::before {
            top: -30px;
            left: -15px;
        }
        
        .advice-text::after {
            bottom: -50px;
            right: -15px;
            transform: rotate(180deg);
        }
        
        .advice-number {
            position: absolute;
            bottom: 20px;
            right: 30px;
            color: #8e8e8e;
            font-size: 0.9rem;
        }
        
        .bookmark-icon {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #FF6384;
            font-size: 1.8rem;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .bookmarked .bookmark-icon {
            opacity: 1;
        }
        
        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            width: 100%;
        }
        
        button {
            padding: 15px 30px;
            font-size: 1.1rem;
            border: none;
            border-radius: 50px;
            background: linear-gradient(to right, #4776E6, #8E54E9);
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(71, 118, 230, 0.4);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 200px;
        }
        
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(71, 118, 230, 0.6);
        }
        
        button:active {
            transform: translateY(1px);
        }
        
        .btn-open {
            background: linear-gradient(to right, #00b09b, #96c93d);
        }
        
        .btn-open:hover {
            box-shadow: 0 8px 20px rgba(0, 176, 155, 0.6);
        }
        
        .btn-new {
            background: linear-gradient(to right, #FF6384, #FF9F40);
        }
        
        .btn-new:hover {
            box-shadow: 0 8px 20px rgba(255, 99, 132, 0.6);
        }
        
        .btn-bookmark {
            background: linear-gradient(to right, #FFCE56, #FF9F40);
        }
        
        .btn-bookmark:hover {
            box-shadow: 0 8px 20px rgba(255, 206, 86, 0.6);
        }
        
        .btn-history {
            background: linear-gradient(to right, #4BC0C0, #36A2EB);
        }
        
        .btn-history:hover {
            box-shadow: 0 8px 20px rgba(75, 192, 192, 0.6);
        }
        
        .info-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        }
        
        .info-card h2 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #4776E6;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .current-advice {
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .history-panel {
            max-height: 300px;
            overflow-y: auto;
        }
        
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .history-item {
            background: white;
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #8E54E9;
            font-size: 1.1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
        }
        
        .history-item .advice {
            flex-grow: 1;
            font-weight: 500;
        }
        
        .history-item .timestamp {
            color: #777;
            font-size: 0.9rem;
            min-width: 90px;
            text-align: right;
        }
        
        footer {
            text-align: center;
            color: #777;
            padding-top: 20px;
            border-top: 1px solid #eee;
            font-size: 0.9rem;
        }
        
        /* 响应式设计 */
        @media (max-width: 900px) {
            .main-content {
                flex-direction: column;
            }
            
            .book-container {
                height: 400px;
                max-width: 350px;
            }
            
            .advice-text {
                font-size: 1.7rem;
            }
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            
            header h1 {
                font-size: 2rem;
            }
            
            .book-container {
                height: 350px;
            }
            
            .advice-text {
                font-size: 1.5rem;
            }
            
            .book-title {
                font-size: 2.8rem;
            }
            
            button {
                min-width: 100%;
            }
        }
        
        /* 动画效果 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .fade-in {
            animation: fadeIn 0.8s ease forwards;
        }
        
        .pulse {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(0.98); }
            50% { transform: scale(1.02); }
            100% { transform: scale(0.98); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-book"></i> 答案之书</h1>
            <p>当生活让你困惑时，让这本智慧之书为你指引方向。集中精神思考你的问题，然后翻开书页获取建议。</p>
        </header>
        
        <div class="main-content">
            <div class="book-panel">
                <div class="book-container">
                    <div class="book" id="book">
                        <div class="book-page front-cover">
                            <div class="book-title">答案之书</div>
                            <div class="book-subtitle">生命问题的随机智慧</div>
                            <button class="btn-open pulse" id="open-book-btn">
                                <i class="fas fa-book-open"></i> 翻开书页
                            </button>
                        </div>
                        
                        <div class="book-page content-page">
                            <div class="advice-container" id="advice-container">
                                <div class="bookmark-icon">
                                    <i class="fas fa-bookmark"></i>
                                </div>
                                <div class="advice-text" id="advice-text">
                                    当你准备好时，翻开书页获取人生建议
                                </div>
                                <div class="advice-number" id="advice-number">#000</div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="controls">
                    <button class="btn-new" id="new-advice-btn">
                        <i class="fas fa-lightbulb"></i> 获取新建议
                    </button>
                    <button class="btn-bookmark" id="bookmark-btn">
                        <i class="fas fa-bookmark"></i> 收藏建议
                    </button>
                    <button class="btn-history" id="history-btn">
                        <i class="fas fa-history"></i> 查看历史
                    </button>
                </div>
            </div>
            
            <div class="info-panel">
                <div class="info-card current-advice fade-in">
                    <h2><i class="fas fa-star"></i> 当前建议</h2>
                    <div class="advice-text">
                        请翻开书页获取人生建议
                    </div>
                </div>
                
                <div class="info-card history-panel">
                    <h2><i class="fas fa-history"></i> 历史记录</h2>
                    <div class="history-list" id="history-list">
                        <div class="history-item">
                            <div class="advice">耐心是解决大多数问题的钥匙</div>
                            <div class="timestamp">12:30</div>
                        </div>
                        <div class="history-item">
                            <div class="advice">接受变化，它是成长的唯一途径</div>
                            <div class="timestamp">12:25</div>
                        </div>
                        <div class="history-item">
                            <div class="advice">真正的勇气是在恐惧中前行</div>
                            <div class="timestamp">12:18</div>
                        </div>
                        <div class="history-item">
                            <div class="advice">不要为小事烦恼，专注于真正重要的事情</div>
                            <div class="timestamp">12:10</div>
                        </div>
                        <div class="history-item">
                            <div class="advice">学会说'不'，保护你的时间和精力</div>
                            <div class="timestamp">12:05</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <footer>
            <p>每一则建议都是随机生成的智慧。答案之书不提供具体答案，而是提供思考的方向。</p>
            <p>© 2025 答案之书 </p>
        </footer>
    </div>

    <script>
        // 建议数据库
        const adviceList = [
            "跟随你的直觉，它比理性更了解你真正的需求",
            "耐心是解决大多数问题的钥匙",
            "接受变化，它是成长的唯一途径",
            "真正的勇气是在恐惧中前行",
            "不要为小事烦恼，专注于真正重要的事情",
            "学会说'不'，保护你的时间和精力",
            "每天花时间感恩，它会改变你的视角",
            "投资于人际关系，它们是你最宝贵的财富",
            "失败是成功路上必经的驿站",
            "倾听内心的声音，它知道正确的方向",
            "真正的财富在于经历而非物质",
            "宽恕他人最终是解放自己",
            "每天学习一点新东西，保持好奇心",
            "行动胜过完美的计划",
            "健康是最大的财富，好好珍惜它",
            "给予比接受更能带来快乐",
            "相信过程，即使看不到立即的结果",
            "你的思想塑造你的现实",
            "在风暴中寻找平静",
            "小步前进胜过大步停滞",
            "做真实的自己，无需向他人证明",
            "沉默有时是最好的回答",
            "梦想要大，行动要实",
            "比较是快乐的小偷",
            "拥抱不确定性，那里充满可能性",
            "善良不需要理由",
            "休息不是懒惰，而是必要的充电",
            "问题中蕴藏着机会",
            "信任需要时间建立，但瞬间可毁",
            "真正的智慧在于知道自己的无知",
            "过去是参考书，不是生活指南",
            "简单中蕴含着优雅",
            "勇气不是没有恐惧，而是战胜恐惧",
            "最好的投资是投资于自己",
            "言语有力量，谨慎使用",
            "理解比评判更有价值",
            "寻找平衡，而非完美",
            "每个结束都是新开始的机会",
            "快乐是一种选择，而非结果",
            "真正的力量来自内心的平静",
            "最深的智慧往往是最简单的真理",
            "耐心培育所有美好的事物",
            "你的价值不由他人定义",
            "放手你无法控制的事物",
            "在给予中，你会发现自己",
            "困难时刻塑造品格",
            "微笑是最简单的善意",
            "今日的选择创造明日的现实",
            "感恩将平凡变为祝福",
            "爱是唯一合理的冒险"
        ];
        
        // 获取DOM元素
        const book = document.getElementById('book');
        const openBookBtn = document.getElementById('open-book-btn');
        const newAdviceBtn = document.getElementById('new-advice-btn');
        const bookmarkBtn = document.getElementById('bookmark-btn');
        const historyBtn = document.getElementById('history-btn');
        const adviceText = document.getElementById('advice-text');
        const adviceNumber = document.getElementById('advice-number');
        const adviceContainer = document.getElementById('advice-container');
        const historyList = document.getElementById('history-list');
        const currentAdviceText = document.querySelector('.current-advice .advice-text');
        
        // 状态变量
        let isBookOpen = false;
        let currentAdvice = "";
        let currentIndex = 0;
        let bookmarkedAdvices = new Set();
        let adviceHistory = [];
        
        // 打开书本
        openBookBtn.addEventListener('click', () => {
            if (!isBookOpen) {
                book.classList.add('open');
                isBookOpen = true;
                generateNewAdvice();
            }
        });
        
        // 生成新建议
        function generateNewAdvice() {
            // 获取随机建议
            const randomIndex = Math.floor(Math.random() * adviceList.length);
            currentIndex = randomIndex;
            currentAdvice = adviceList[randomIndex];
            
            // 显示建议
            adviceText.textContent = currentAdvice;
            adviceNumber.textContent = `#${String(randomIndex + 1).padStart(3, '0')}`;
            currentAdviceText.textContent = currentAdvice;
            
            // 添加动画效果
            adviceText.style.opacity = '0';
            adviceText.style.transform = 'translateY(20px)';
            
            setTimeout(() => {
                adviceText.style.transition = 'all 0.6s ease';
                adviceText.style.opacity = '1';
                adviceText.style.transform = 'translateY(0)';
            }, 50);
            
            // 添加到历史记录
            addToHistory(currentAdvice, randomIndex);
            
            // 更新书签状态
            updateBookmarkState();
        }
        
        // 添加到历史记录
        function addToHistory(advice, index) {
            const timestamp = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            adviceHistory.unshift({ advice, index, timestamp });
            
            // 最多保存10条历史记录
            if (adviceHistory.length > 10) {
                adviceHistory.pop();
            }
            
            // 更新历史列表显示
            updateHistoryList();
        }
        
        // 更新历史列表显示
        function updateHistoryList() {
            historyList.innerHTML = '';
            
            adviceHistory.forEach((item, idx) => {
                const historyItem = document.createElement('div');
                historyItem.className = 'history-item';
                
                const adviceEl = document.createElement('div');
                adviceEl.className = 'advice';
                adviceEl.textContent = item.advice;
                
                const timestampEl = document.createElement('div');
                timestampEl.className = 'timestamp';
                timestampEl.textContent = item.timestamp;
                
                historyItem.appendChild(adviceEl);
                historyItem.appendChild(timestampEl);
                
                historyList.appendChild(historyItem);
            });
        }
        
        // 更新书签状态
        function updateBookmarkState() {
            if (bookmarkedAdvices.has(currentIndex)) {
                adviceContainer.classList.add('bookmarked');
                bookmarkBtn.innerHTML = '<i class="fas fa-bookmark"></i> 已收藏';
            } else {
                adviceContainer.classList.remove('bookmarked');
                bookmarkBtn.innerHTML = '<i class="fas fa-bookmark"></i> 收藏建议';
            }
        }
        
        // 事件监听器
        newAdviceBtn.addEventListener('click', generateNewAdvice);
        
        bookmarkBtn.addEventListener('click', () => {
            if (bookmarkedAdvices.has(currentIndex)) {
                bookmarkedAdvices.delete(currentIndex);
            } else {
                bookmarkedAdvices.add(currentIndex);
            }
            updateBookmarkState();
            
            // 添加视觉反馈
            bookmarkBtn.classList.add('pulse');
            setTimeout(() => {
                bookmarkBtn.classList.remove('pulse');
            }, 500);
        });
        
        historyBtn.addEventListener('click', () => {
            // 滚动到历史记录区域
            document.querySelector('.history-panel').scrollIntoView({ behavior: 'smooth' });
            
            // 添加视觉反馈
            historyBtn.classList.add('pulse');
            setTimeout(() => {
                historyBtn.classList.remove('pulse');
            }, 500);
        });
        
        // 初始化
        updateBookmarkState();
        
        // 添加初始动画
        document.querySelectorAll('.fade-in').forEach((el, index) => {
            el.style.animationDelay = `${index * 0.2}s`;
        });
    </script>
</body>
</html>
