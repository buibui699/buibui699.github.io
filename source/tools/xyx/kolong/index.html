<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>恐龙快跑</title>
    <style>
        /* 重置样式，避免博客样式冲突 */
        .dino-game * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .dino-game {
            font-family: 'Arial', sans-serif;
            width: 100%;
            height: 500px;
            min-height: 400px;
            position: relative;
            overflow: hidden;
            touch-action: manipulation;
            border: 2px solid #333;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .game-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #87CEEB 0%, #98FB98 70%, #90EE90 100%);
            overflow: hidden;
        }

        .ground {
            position: absolute;
            bottom: 0;
            width: 200%;
            height: 100px;
            background: repeating-linear-gradient(
                90deg,
                #8B4513 0px,
                #8B4513 10px,
                #A0522D 10px,
                #A0522D 20px
            );
            animation: moveGround 3s linear infinite;
        }

        @keyframes moveGround {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); }
        }

        .clouds {
            position: absolute;
            top: 20%;
            width: 100%;
            height: 60px;
        }

        .cloud {
            position: absolute;
            background: white;
            border-radius: 50px;
            opacity: 0.8;
            animation: moveClouds 12s linear infinite;
        }

        .cloud:before,
        .cloud:after {
            content: '';
            position: absolute;
            background: white;
            border-radius: 50px;
        }

        .cloud1 {
            width: 50px;
            height: 20px;
            top: 10px;
            left: 10%;
        }

        .cloud1:before {
            width: 25px;
            height: 25px;
            top: -12px;
            left: 8px;
        }

        .cloud1:after {
            width: 30px;
            height: 20px;
            top: -8px;
            right: 8px;
        }

        .cloud2 {
            width: 40px;
            height: 15px;
            top: 30px;
            left: 60%;
            animation-delay: -4s;
        }

        .cloud2:before {
            width: 20px;
            height: 20px;
            top: -8px;
            left: 5px;
        }

        .cloud2:after {
            width: 25px;
            height: 15px;
            top: -5px;
            right: 5px;
        }

        @keyframes moveClouds {
            from { transform: translateX(100%); }
            to { transform: translateX(-100px); }
        }

        .dino {
            position: absolute;
            width: 60px;
            height: 60px;
            left: 100px;
            bottom: 100px;
            background: #32CD32;
            border-radius: 15px 15px 5px 5px;
            transition: all 0.2s ease;
            z-index: 10;
        }

        .dino:before {
            content: '';
            position: absolute;
            width: 15px;
            height: 15px;
            background: #228B22;
            border-radius: 50%;
            top: 10px;
            left: 35px;
        }

        .dino:after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            background: black;
            border-radius: 50%;
            top: 15px;
            left: 38px;
        }

        .dino.jumping {
            animation: jump 0.6s ease-in-out;
        }

        .dino.ducking {
            height: 30px;
            width: 80px;
            border-radius: 25px 5px 5px 25px;
            bottom: 100px;
        }

        .dino.ducking:before {
            top: 5px;
            left: 50px;
        }

        .dino.ducking:after {
            top: 8px;
            left: 53px;
        }

        @keyframes jump {
            0%, 100% { bottom: 100px; }
            50% { bottom: 200px; }
        }

        .obstacle {
            position: absolute;
            bottom: 100px;
            right: -50px;
            background: #8B4513;
            border-radius: 5px;
            animation: moveObstacle 3.5s linear infinite;
        }

        .obstacle.cactus {
            width: 25px;
            height: 50px;
            background: #228B22;
            border-radius: 10px 10px 5px 5px;
        }

        .obstacle.cactus:before {
            content: '';
            position: absolute;
            width: 15px;
            height: 20px;
            background: #228B22;
            border-radius: 8px;
            top: 15px;
            left: -8px;
        }

        .obstacle.cactus:after {
            content: '';
            position: absolute;
            width: 12px;
            height: 15px;
            background: #228B22;
            border-radius: 6px;
            top: 10px;
            right: -7px;
        }

        .obstacle.bird {
            width: 40px;
            height: 20px;
            bottom: 180px;
            background: #4169E1;
            border-radius: 20px 5px 5px 20px;
            animation: moveObstacle 3s linear infinite, flap 0.3s ease-in-out infinite;
        }

        .obstacle.bird:before {
            content: '';
            position: absolute;
            width: 20px;
            height: 15px;
            background: #4169E1;
            border-radius: 10px;
            top: -8px;
            left: 10px;
            animation: flap 0.3s ease-in-out infinite reverse;
        }

        @keyframes flap {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-15deg); }
        }

        @keyframes moveObstacle {
            from { right: -50px; }
            to { right: 100%; }
        }

        .score {
            position: absolute;
            top: 30px;
            right: 30px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            z-index: 100;
        }

        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            font-size: 32px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 1000;
            display: none;
        }

        .game-over button {
            margin-top: 20px;
            padding: 15px 30px;
            font-size: 18px;
            background: #32CD32;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .game-over button:hover {
            background: #228B22;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }

        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: white;
            font-size: 14px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            z-index: 100;
        }

        .mobile-controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: none;
            justify-content: space-around;
            padding: 0 50px;
            z-index: 100;
        }

        .control-btn {
            width: 80px;
            height: 80px;
            background: rgba(255,255,255,0.3);
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 50%;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
            user-select: none;
        }

        .control-btn:active {
            background: rgba(255,255,255,0.5);
            transform: scale(0.95);
        }

        @media (max-width: 768px) {
            .dino-game {
                height: 400px;
            }
            
            .dino {
                width: 50px;
                height: 50px;
                left: 80px;
            }

            .dino.ducking {
                height: 25px;
                width: 70px;
            }

            .score {
                font-size: 20px;
                top: 20px;
                right: 20px;
            }

            .game-over {
                font-size: 24px;
            }

            .controls {
                display: none;
            }

            .mobile-controls {
                display: flex;
            }
        }

        @media (max-width: 480px) {
            .dino-game {
                height: 350px;
            }
            
            .dino {
                width: 40px;
                height: 40px;
                left: 60px;
            }

            .dino.ducking {
                height: 20px;
                width: 60px;
            }

            .control-btn {
                width: 60px;
                height: 60px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="dino-game">
        <div class="game-container">
        <div class="clouds">
            <div class="cloud cloud1"></div>
            <div class="cloud cloud2"></div>
            </div>
    </div>
        
        <div class="ground"></div>
        <div class="dino" id="dino"></div>
        
        <div class="score" id="score">分数: 0</div>
        
        <div class="game-over" id="gameOver">
            <div>游戏结束!</div>
            <div style="font-size: 18px; margin: 10px 0;">最终分数: <span id="finalScore">0</span></div>
            <button onclick="restartGame()">重新开始</button>
        </div>
        
        <div class="controls">
            <div>空格键 - 跳跃 | S键或下箭头 - 下蹲</div>
        </div>
        
        <div class="mobile-controls">
            <div class="control-btn" id="jumpBtn">跳跃</div>
            <div class="control-btn" id="duckBtn">下蹲</div>
        </div>
    </div>

    <script>
        class DinoGame {
            constructor() {
                this.dino = document.getElementById('dino');
                this.scoreElement = document.getElementById('score');
                this.gameOverElement = document.getElementById('gameOver');
                this.finalScoreElement = document.getElementById('finalScore');
                
                this.isJumping = false;
                this.isDucking = false;
                this.isGameRunning = false;
                this.score = 0;
                this.obstacles = [];
                this.gameSpeed = 2.5;
                this.spawnRate = 0.015;
                
                this.init();
            }
            
            init() {
                this.setupEventListeners();
                this.startGame();
            }
            
            setupEventListeners() {
                // 键盘事件
                document.addEventListener('keydown', (e) => {
                    if (!this.isGameRunning) return;
                    
                    switch(e.code) {
                        case 'Space':
                            e.preventDefault();
                            this.jump();
                            break;
                        case 'KeyS':
                        case 'ArrowDown':
                            e.preventDefault();
                            this.duck();
                            break;
                    }
                });
                
                document.addEventListener('keyup', (e) => {
                    if (e.code === 'KeyS' || e.code === 'ArrowDown') {
                        this.stopDuck();
                    }
                });
                
                // 移动端触摸事件
                const jumpBtn = document.getElementById('jumpBtn');
                const duckBtn = document.getElementById('duckBtn');
                
                jumpBtn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    if (this.isGameRunning) this.jump();
                });
                
                duckBtn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    if (this.isGameRunning) this.duck();
                });
                
                duckBtn.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    this.stopDuck();
                });
                
                // 鼠标事件（作为备选）
                jumpBtn.addEventListener('click', () => {
                    if (this.isGameRunning) this.jump();
                });
                
                duckBtn.addEventListener('mousedown', () => {
                    if (this.isGameRunning) this.duck();
                });
                
                duckBtn.addEventListener('mouseup', () => {
                    this.stopDuck();
                });
            }
            
            jump() {
                if (this.isJumping || this.isDucking) return;
                
                this.isJumping = true;
                this.dino.classList.add('jumping');
                
                setTimeout(() => {
                    this.isJumping = false;
                    this.dino.classList.remove('jumping');
                }, 600);
            }
            
            duck() {
                if (this.isJumping || this.isDucking) return;
                
                this.isDucking = true;
                this.dino.classList.add('ducking');
            }
            
            stopDuck() {
                if (!this.isDucking) return;
                
                this.isDucking = false;
                this.dino.classList.remove('ducking');
            }
            
            createObstacle() {
                const obstacle = document.createElement('div');
                obstacle.classList.add('obstacle');
                
                // 随机选择障碍物类型
                const obstacleTypes = ['cactus', 'bird'];
                const type = obstacleTypes[Math.floor(Math.random() * obstacleTypes.length)];
                obstacle.classList.add(type);
                
                // 设置动画持续时间
                const duration = 3500 / this.gameSpeed;
                obstacle.style.animationDuration = `${duration}ms`;
                
                document.querySelector('.game-container').appendChild(obstacle);
                this.obstacles.push({
                    element: obstacle,
                    passed: false
                });
                
                // 清理已经移出屏幕的障碍物
                setTimeout(() => {
                    if (obstacle.parentNode) {
                        obstacle.parentNode.removeChild(obstacle);
                    }
                    this.obstacles = this.obstacles.filter(obs => obs.element !== obstacle);
                }, duration + 1000);
            }
            
            checkCollision() {
                const dinoRect = this.dino.getBoundingClientRect();
                
                this.obstacles.forEach(obstacle => {
                    const obstacleRect = obstacle.element.getBoundingClientRect();
                    
                    // 检查碰撞
                    if (dinoRect.left < obstacleRect.right &&
                        dinoRect.right > obstacleRect.left &&
                        dinoRect.top < obstacleRect.bottom &&
                        dinoRect.bottom > obstacleRect.top) {
                        this.gameOver();
                        return;
                    }
                    
                    // 检查是否通过障碍物（用于计分）
                    if (!obstacle.passed && obstacleRect.right < dinoRect.left) {
                        obstacle.passed = true;
                        this.score += 10;
                        this.scoreElement.textContent = `分数: ${this.score}`;
                        
                        // 逐渐增加游戏难度
                        if (this.score % 150 === 0) {
                            this.gameSpeed += 0.15;
                            this.spawnRate = Math.min(this.spawnRate + 0.002, 0.03);
                        }
                    }
                });
            }
            
            gameLoop() {
                if (!this.isGameRunning) return;
                
                // 生成障碍物
                if (Math.random() < this.spawnRate) {
                    this.createObstacle();
                }
                
                // 检查碰撞
                this.checkCollision();
                
                // 更新分数（时间奖励）
                if (this.score % 8 === 0) {
                    this.score += 1;
                    this.scoreElement.textContent = `分数: ${this.score}`;
                }
                
                requestAnimationFrame(() => this.gameLoop());
            }
            
            startGame() {
                this.isGameRunning = true;
                this.score = 0;
                this.gameSpeed = 2.5;
                this.spawnRate = 0.015;
                this.obstacles = [];
                
                this.scoreElement.textContent = `分数: ${this.score}`;
                this.gameOverElement.style.display = 'none';
                
                // 清理现有障碍物
                document.querySelectorAll('.obstacle').forEach(obs => {
                    obs.remove();
                });
                
                this.gameLoop();
            }
            
            gameOver() {
                this.isGameRunning = false;
                this.finalScoreElement.textContent = this.score;
                this.gameOverElement.style.display = 'block';
                
                // 停止所有动画
                this.dino.classList.remove('jumping', 'ducking');
                this.isJumping = false;
                this.isDucking = false;
            }
        }
        
        function restartGame() {
            game.startGame();
        }
        
        // 初始化游戏
        const game = new DinoGame();
        
        // 防止页面滚动
        document.addEventListener('touchmove', (e) => {
            e.preventDefault();
        }, { passive: false });
        
        // 防止双击缩放
        let lastTouchEnd = 0;
        document.addEventListener('touchend', (e) => {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                e.preventDefault();
            }
            lastTouchEnd = now;
        }, false);
    </script>
</body>
</html>
