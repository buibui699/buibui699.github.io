<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Bird 风格小游戏</title>
    <style>
        .flappy-game * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: manipulation; /* Important for touch responsiveness */
        }
        
        .flappy-game {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 500px; /* Ensure it has some height */
            background: linear-gradient(to bottom, #64b3f4, #c2e59c);
            font-family: 'Arial Rounded MT Bold', 'Arial', sans-serif;
            overflow: hidden;
            padding: 10px;
            margin: 20px 0;
            border-radius: 15px;
        }
        
        .flappy-game #game-container {
            position: relative;
            width: 100%;
            max-width: 400px;  /* Design width */
            height: 600px; /* Design height */
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        .flappy-game #game-canvas {
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA); /* Moved to JS for dynamic BG */
            width: 100%;
            height: 100%;
            display: block;
        }
        
        .flappy-game #start-screen, 
        .flappy-game #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            z-index: 10;
            text-align: center;
            padding: 20px;
        }
        
        .flappy-game #game-over-screen {
            display: none;
        }
        
        .flappy-game h1 {
            font-size: 2rem;
            margin-bottom: 20px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            color: #FFD700;
        }
        
        .flappy-game p {
            font-size: 1rem;
            margin-bottom: 15px;
            max-width: 90%;
            line-height: 1.4;
        }
        
        .flappy-game .score-display {
            font-size: 1.5rem;
            margin: 10px 0;
            font-weight: bold;
            color: white;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        
        .flappy-game #final-score {
            font-size: 2rem;
            color: #FFD700;
            margin: 20px 0;
        }
        
        .flappy-game button {
            background: linear-gradient(to bottom, #FF9800, #F57C00);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            transition: all 0.2s;
        }
        
        .flappy-game button:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
        }
        
        .flappy-game button:active {
            transform: scale(0.98);
        }
        
        .flappy-game #score-display {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 2rem;
            font-weight: bold;
            color: white;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            z-index: 5;
        }
        
        .flappy-game .instructions {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #ccc;
            max-width: 90%;
        }
        
        @media (max-width: 500px) { /* This primarily affects the container, canvas drawing scales within it */
            .flappy-game #game-container {
                /* max-width: 350px; Let JS handle canvas size based on actual container clientWidth */
                /* height: 500px; Let JS handle canvas size based on actual container clientHeight */
                /* We can adjust container aspect ratio here if desired, but fixed height might be better */
                max-width: 90vw; /* Example: use viewport units for more flexibility */
                height: 70vh; /* Example */

                 /* Or keep it simpler if the blog layout constrains it well */
                /* max-width: 350px; */
                /* height: 500px; */

            }
            
            .flappy-game h1 {
                font-size: 1.6rem;
            }
            
            .flappy-game p {
                font-size: 0.9rem;
            }
            
            .flappy-game button {
                padding: 10px 25px;
                font-size: 1rem;
            }
            
            .flappy-game .score-display {
                font-size: 1.3rem;
            }
            
            .flappy-game #score-display {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="flappy-game">
        <div id="game-container">
            <canvas id="game-canvas"></canvas>
            <div id="score-display">0</div>
            
            <div id="start-screen">
                <h1>飞翔的小鸟</h1>
                <p>点击屏幕或按空格键控制小鸟飞行</p>
                <p>穿过柱子间的空隙，不要碰到柱子或地面</p>
                <button id="start-button">开始游戏</button>
                <div class="instructions">
                    电脑：空格键或鼠标点击<br>
                    手机：触摸屏幕
                </div>
            </div>
            
            <div id="game-over-screen">
                <h1>游戏结束</h1>
                <p>你的分数</p>
                <div id="final-score" class="score-display">0</div>
                <button id="restart-button">再来一次</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('game-canvas');
            const ctx = canvas.getContext('2d');
            const startScreen = document.getElementById('start-screen');
            const gameOverScreen = document.getElementById('game-over-screen');
            const scoreDisplay = document.getElementById('score-display');
            const finalScoreDisplay = document.getElementById('final-score');
            const startButton = document.getElementById('start-button');
            const restartButton = document.getElementById('restart-button');
            const gameContainer = document.getElementById('game-container');

            // --- SCALING VARIABLES ---
            const BASE_WIDTH = 400;  // Your original design width
            const BASE_HEIGHT = 600; // Your original design height
            let scaleX = 1;
            let scaleY = 1;
            let currentCanvasWidth = BASE_WIDTH;
            let currentCanvasHeight = BASE_HEIGHT;

            // --- Game Variables that need scaling ---
            let BIRD_X, BIRD_RADIUS, BIRD_GRAVITY, BIRD_JUMP;
            let PIPE_WIDTH, PIPE_GAP, PIPE_SPEED, PIPE_SPACING_FRAMES;
            let GROUND_HEIGHT;
            let CLOUD_BASE_Y, CLOUD_X_OFFSET, CLOUD_RADIUS_1, CLOUD_RADIUS_2;

            function updateScaledValues() {
                scaleX = currentCanvasWidth / BASE_WIDTH;
                scaleY = currentCanvasHeight / BASE_HEIGHT;

                // Bird
                BIRD_X = 50 * scaleX;
                BIRD_RADIUS = 15 * Math.min(scaleX, scaleY); // Keep bird somewhat circular
                BIRD_GRAVITY = 0.4 * scaleY;
                BIRD_JUMP = -8 * scaleY;

                // Pipes
                PIPE_WIDTH = 50 * scaleX;
                PIPE_GAP = 150 * scaleY;
                PIPE_SPEED = 1.5 * scaleX; // Pipes move horizontally
                PIPE_SPACING_FRAMES = 120; // This is frame-based, might not need scaling or scale with speed

                // Ground
                GROUND_HEIGHT = 60 * scaleY;

                // Cloud visual details (example, adjust as needed)
                CLOUD_BASE_Y = 40 * scaleY;
                CLOUD_X_OFFSET = 15 * scaleX;
                CLOUD_RADIUS_1 = 18 * Math.min(scaleX, scaleY);
                CLOUD_RADIUS_2 = 15 * Math.min(scaleX, scaleY);
            }
            
            function resizeCanvas() {
                if (gameContainer) {
                    // Option 1: Maintain aspect ratio of BASE_WIDTH/BASE_HEIGHT
                    // const containerWidth = gameContainer.clientWidth;
                    // const containerHeight = gameContainer.clientHeight; // Or a fixed CSS height
                    // const aspectRatio = BASE_WIDTH / BASE_HEIGHT;
                    // if (containerWidth / containerHeight > aspectRatio) {
                    //     currentCanvasHeight = containerHeight;
                    //     currentCanvasWidth = currentCanvasHeight * aspectRatio;
                    // } else {
                    //     currentCanvasWidth = containerWidth;
                    //     currentCanvasHeight = currentCanvasWidth / aspectRatio;
                    // }
                    // canvas.style.width = currentCanvasWidth + 'px'; // For display
                    // canvas.style.height = currentCanvasHeight + 'px'; // For display

                    // Option 2: Fill container (might distort if aspect ratio changes significantly)
                    currentCanvasWidth = gameContainer.clientWidth;
                    currentCanvasHeight = gameContainer.clientHeight;
                    
                    canvas.width = currentCanvasWidth;   // Internal drawing resolution
                    canvas.height = currentCanvasHeight; // Internal drawing resolution
                    
                    updateScaledValues();
                    
                    // If game is not running, reset bird to reflect new scaled positions
                    if (!gameRunning) {
                        bird.reset(); 
                        // Redraw static elements if needed, though animate loop will handle it if running
                        if (ctx && canvas.width > 0) { // Ensure canvas is ready
                           drawBackground(); // Redraw background with new dimensions
                           drawGround(); // Redraw ground
                           bird.draw(); // Redraw bird at its reset position
                        }
                    }
                }
            }
            
            window.addEventListener('resize', resizeCanvas);
            // Call resizeCanvas initially after a short delay to ensure layout is complete
            setTimeout(() => {
                resizeCanvas();
                // Reset bird position after first resize, even before game starts
                bird.reset();
                 if (ctx && canvas.width > 0) {
                    drawBackground();
                    drawGround();
                    bird.draw(); // Draw bird on start screen correctly scaled
                 }
            }, 100); // 100ms delay might be needed if container size depends on other elements loading
            
            let gameRunning = false;
            let score = 0;
            let animationId = null;
            
            const bird = {
                x: 0, // Will be set by BIRD_X in reset
                y: 0, // Will be set in reset
                radius: 0, // Will be set by BIRD_RADIUS
                velocity: 0,
                // gravity: 0, // Will use BIRD_GRAVITY
                // jump: 0,    // Will use BIRD_JUMP
                color: '#FFD700',
                
                reset() {
                    this.x = BIRD_X;
                    this.y = currentCanvasHeight / 2;
                    this.velocity = 0;
                    this.radius = BIRD_RADIUS; // Set radius here
                },
                
                draw() {
                    if (!ctx || !currentCanvasWidth) return;
                    
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                    ctx.strokeStyle = '#E65100';
                    ctx.lineWidth = 2 * Math.min(scaleX, scaleY); // Scale line width too
                    ctx.stroke();
                    
                    // Relative eye and beak positions based on radius
                    const eyeOffsetX = this.radius * 0.4; // 6 / 15
                    const eyeOffsetY = this.radius * 0.2; // 3 / 15
                    const eyeRadiusOuter = this.radius * 0.27; // 4 / 15
                    const eyeRadiusInner = this.radius * 0.13; // 2 / 15

                    const beakTipX = this.radius * 1.2; // 18 / 15
                    const beakOffsetY = this.radius * 0.13; // 2 / 15
                    const beakBaseX = this.radius * 0.8; // 12/15
                    
                    // Draw Eyes
                    ctx.beginPath();
                    ctx.arc(this.x + eyeOffsetX, this.y - eyeOffsetY, eyeRadiusOuter, 0, Math.PI * 2);
                    ctx.fillStyle = 'white';
                    ctx.fill();
                    
                    ctx.beginPath();
                    ctx.arc(this.x + eyeOffsetX + (eyeRadiusOuter*0.25), this.y - eyeOffsetY, eyeRadiusInner, 0, Math.PI * 2);
                    ctx.fillStyle = 'black';
                    ctx.fill();
                    
                    // Draw Beak
                    ctx.beginPath();
                    ctx.moveTo(this.x + beakBaseX, this.y);
                    ctx.lineTo(this.x + beakTipX, this.y - beakOffsetY);
                    ctx.lineTo(this.x + beakTipX, this.y + beakOffsetY);
                    ctx.closePath();
                    ctx.fillStyle = '#FF5722';
                    ctx.fill();
                },
                
                update() {
                    this.velocity += BIRD_GRAVITY;
                    this.y += this.velocity;
                    
                    if (this.y + this.radius > currentCanvasHeight - GROUND_HEIGHT) {
                        this.y = currentCanvasHeight - GROUND_HEIGHT - this.radius;
                        gameOver();
                    }
                    
                    if (this.y - this.radius < 0) {
                        this.y = this.radius;
                        this.velocity = 0;
                    }
                },
                
                flap() {
                    this.velocity = BIRD_JUMP;
                }
            };
            
            const pipes = [];
            let pipeFrameCount = 0;
            
            function drawGround() {
                if (!ctx || !currentCanvasWidth) return;
                
                ctx.fillStyle = '#8BC34A';
                ctx.fillRect(0, currentCanvasHeight - GROUND_HEIGHT, currentCanvasWidth, GROUND_HEIGHT);
                
                ctx.fillStyle = '#7CB342';
                const grassDetailRadius = 8 * Math.min(scaleX, scaleY);
                for (let i = 0; i < currentCanvasWidth; i += (15 * scaleX)) {
                    ctx.beginPath();
                    ctx.arc(i, currentCanvasHeight - GROUND_HEIGHT, grassDetailRadius, 0, Math.PI, true);
                    ctx.fill();
                }
                
                ctx.fillStyle = '#5D4037';
                ctx.fillRect(0, currentCanvasHeight - (15 * scaleY), currentCanvasWidth, (15 * scaleY));
            }
            
            function drawBackground() {
                if (!ctx || !currentCanvasWidth) return;
                
                const gradient = ctx.createLinearGradient(0, 0, 0, currentCanvasHeight);
                gradient.addColorStop(0, '#87CEEB');
                gradient.addColorStop(1, '#E0F7FA');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, currentCanvasWidth, currentCanvasHeight);
                
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                for (let i = 0; i < 3; i++) {
                    // Cloud X needs to wrap around currentCanvasWidth
                    const cloudLoopWidth = currentCanvasWidth + (100 * scaleX); // Ensure clouds are off-screen before looping
                    const x = (i * (150*scaleX) + (frameCount * 0.5 * scaleX)) % cloudLoopWidth - (50*scaleX);
                    const y = CLOUD_BASE_Y + Math.sin(i) * (15 * scaleY);
                    drawCloud(x, y);
                }
            }
            
            function drawCloud(x, y) {
                if (!ctx) return;
                
                ctx.beginPath();
                ctx.arc(x, y, CLOUD_RADIUS_1, 0, Math.PI * 2);
                ctx.arc(x + CLOUD_X_OFFSET, y - (10 * scaleY), CLOUD_RADIUS_2, 0, Math.PI * 2);
                ctx.arc(x + (CLOUD_X_OFFSET * 2), y, CLOUD_RADIUS_1, 0, Math.PI * 2);
                ctx.arc(x + CLOUD_X_OFFSET, y + (10 * scaleY), CLOUD_RADIUS_2, 0, Math.PI * 2);
                ctx.fill();
            }
            
            function createPipe() {
                // Ensure gap position is calculated correctly with scaled values
                const minTopPipeHeight = 60 * scaleY; // Minimum height for the top pipe
                const maxTopPipeHeight = currentCanvasHeight - GROUND_HEIGHT - PIPE_GAP - (60 * scaleY); // Max height for top pipe
                const topHeight = Math.random() * (maxTopPipeHeight - minTopPipeHeight) + minTopPipeHeight;

                pipes.push({
                    x: currentCanvasWidth,
                    topHeight: topHeight,
                    bottomY: topHeight + PIPE_GAP,
                    passed: false,
                    // width: PIPE_WIDTH // width is global now
                });
            }
            
            function drawPipes() {
                if (!ctx) return;
                
                pipes.forEach(pipe => {
                    ctx.fillStyle = '#4CAF50';
                    ctx.fillRect(pipe.x, 0, PIPE_WIDTH, pipe.topHeight);
                    
                    ctx.fillStyle = '#388E3C';
                    ctx.fillRect(pipe.x - (3*scaleX), pipe.topHeight - (15*scaleY), PIPE_WIDTH + (6*scaleX), (15*scaleY));
                    
                    ctx.fillStyle = '#4CAF50';
                    ctx.fillRect(pipe.x, pipe.bottomY, PIPE_WIDTH, currentCanvasHeight - pipe.bottomY - GROUND_HEIGHT);
                    
                    ctx.fillStyle = '#388E3C';
                    ctx.fillRect(pipe.x - (3*scaleX), pipe.bottomY, PIPE_WIDTH + (6*scaleX), (15*scaleY));
                });
            }
            
            function updatePipes() {
                pipeFrameCount++;
                
                if (pipeFrameCount % PIPE_SPACING_FRAMES === 0) {
                    createPipe();
                }
                
                for (let i = pipes.length - 1; i >= 0; i--) {
                    pipes[i].x -= PIPE_SPEED;
                    
                    if (!pipes[i].passed && pipes[i].x + PIPE_WIDTH < bird.x - bird.radius) { // bird.x - bird.radius: bird has fully passed the front of the pipe
                        pipes[i].passed = true;
                        score++;
                        scoreDisplay.textContent = score;
                    }
                    
                    // Collision detection
                    if (
                        bird.x + bird.radius > pipes[i].x && 
                        bird.x - bird.radius < pipes[i].x + PIPE_WIDTH && 
                        (bird.y - bird.radius < pipes[i].topHeight || 
                         bird.y + bird.radius > pipes[i].bottomY)
                    ) {
                        gameOver();
                    }
                    
                    if (pipes[i].x + PIPE_WIDTH < 0) {
                        pipes.splice(i, 1);
                    }
                }
            }
            
            function gameOver() {
                gameRunning = false;
                if (animationId) {
                    cancelAnimationFrame(animationId);
                    animationId = null;
                }
                finalScoreDisplay.textContent = score;
                gameOverScreen.style.display = 'flex';
            }
            
            function resetGame() {
                updateScaledValues(); // Ensure scaled values are current
                bird.reset();
                pipes.length = 0;
                pipeFrameCount = 0;
                score = 0;
                scoreDisplay.textContent = score;
                gameOverScreen.style.display = 'none';
                gameRunning = true;
                frameCount = 0;
                animate();
            }
            
            let frameCount = 0;
            function animate() {
                if (!gameRunning || !currentCanvasWidth || !currentCanvasHeight) return;
                
                animationId = requestAnimationFrame(animate); // Request next frame first
                
                frameCount++;
                
                drawBackground();
                
                updatePipes();
                drawPipes();
                
                bird.update();
                bird.draw();
                
                drawGround();
            }
            
            startButton.addEventListener('click', () => {
                startScreen.style.display = 'none';
                resetGame();
            });
            
            restartButton.addEventListener('click', resetGame);
            
            function controlBird(e) {
                if (e) e.preventDefault(); // Prevent page scroll on touch
                if (gameRunning) {
                    bird.flap();
                } else if (startScreen.style.display !== 'none') {
                    // Optional: allow tap/space on start screen to start game
                    // startScreen.style.display = 'none';
                    // resetGame();
                }
            }
            
            canvas.addEventListener('click', controlBird);
            canvas.addEventListener('touchstart', controlBird, { passive: false });
            
            document.addEventListener('keydown', (e) => {
                if (e.code === 'Space') {
                    e.preventDefault(); // Prevent page scroll
                    if (gameRunning) {
                        controlBird();
                    } else if (startScreen.style.display !== 'none') {
                         // Optional: allow space on start screen to start game
                        startScreen.style.display = 'none';
                        resetGame();
                    } else if (gameOverScreen.style.display !== 'none') {
                        // Optional: allow space on game over screen to restart
                        resetGame();
                    }
                }
            });

            // Initial setup call after DOM is ready
            // resizeCanvas is now called with a timeout to ensure layout is stable.
            // bird.reset(); // bird.reset() is now called within resizeCanvas or after first resize
            // Initial draw for start screen can also be done in resizeCanvas after timeout
        })();
    </script>
</body>
</html>
