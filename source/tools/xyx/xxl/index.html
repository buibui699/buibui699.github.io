<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>消消乐游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }

        /* 重置可能影响游戏的外部样式 */
        .game-container * {
            box-sizing: border-box;
        }

        /* 确保游戏容器不受外部CSS影响 */
        .game-wrapper {
            all: initial;
            font-family: 'Arial', sans-serif;
            display: block;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        .game-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            width: 90%;
            backdrop-filter: blur(10px);
            margin: 20px auto;
            position: relative;
            z-index: 1;
            min-width: 320px;
            box-sizing: border-box;
        }

        .game-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .game-title {
            font-size: 2.5em;
            color: #4a4a4a;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .game-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #ff6b6b, #feca57);
            padding: 15px;
            border-radius: 15px;
            color: white;
            font-weight: bold;
        }

        .score, .moves {
            font-size: 1.2em;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 3px;
            background: #f0f0f0;
            padding: 10px;
            border-radius: 15px;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            aspect-ratio: 1;
            box-sizing: border-box;
            position: relative;
        }

        .gem {
            aspect-ratio: 1;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
            user-select: none;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .gem:hover {
            transform: scale(1.1);
            z-index: 10;
        }

        .gem.selected {
            transform: scale(1.15);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
            border: 3px solid #fff;
        }

        .gem.red { background: linear-gradient(135deg, #ff6b6b, #ee5a52); }
        .gem.blue { background: linear-gradient(135deg, #4ecdc4, #44a08d); }
        .gem.green { background: linear-gradient(135deg, #95e1d3, #48cab2); }
        .gem.yellow { background: linear-gradient(135deg, #fce38a, #f38181); }
        .gem.purple { background: linear-gradient(135deg, #a8edea, #fed6e3); }
        .gem.orange { background: linear-gradient(135deg, #ffb347, #ff8c42); }

        .gem.falling {
            animation: fall 0.5s ease-in;
        }

        .gem.matching {
            animation: match 0.6s ease-out forwards;
        }

        .gem.exploding {
            animation: explode 0.8s ease-out forwards;
        }

        .gem.spark {
            animation: spark 0.5s ease-out forwards;
        }

        @keyframes fall {
            from {
                transform: translateY(-100px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes match {
            0% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
                box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            }
            25% {
                transform: scale(1.2) rotate(5deg);
                opacity: 0.9;
                box-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
            }
            50% {
                transform: scale(1.4) rotate(-5deg);
                opacity: 0.7;
                box-shadow: 0 0 30px rgba(255, 215, 0, 0.8);
            }
            75% {
                transform: scale(1.1) rotate(2deg);
                opacity: 0.4;
                box-shadow: 0 0 40px rgba(255, 105, 180, 0.6);
            }
            100% {
                transform: scale(0) rotate(180deg);
                opacity: 0;
                box-shadow: 0 0 50px rgba(255, 255, 255, 0);
            }
        }

        @keyframes explode {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            20% {
                transform: scale(1.3);
                opacity: 0.8;
                box-shadow: 0 0 25px rgba(255, 255, 255, 0.9);
            }
            40% {
                transform: scale(0.8);
                opacity: 0.6;
                filter: brightness(1.5) saturate(1.5);
            }
            60% {
                transform: scale(1.2);
                opacity: 0.4;
                filter: brightness(2) saturate(2);
            }
            80% {
                transform: scale(0.5);
                opacity: 0.2;
                filter: brightness(3) hue-rotate(90deg);
            }
            100% {
                transform: scale(0);
                opacity: 0;
                filter: brightness(4) hue-rotate(180deg);
            }
        }

        @keyframes spark {
            0% {
                transform: scale(1);
                opacity: 1;
                filter: brightness(1);
            }
            25% {
                transform: scale(1.1);
                opacity: 0.9;
                filter: brightness(1.5);
                box-shadow: 0 0 15px rgba(255, 255, 255, 0.7);
            }
            50% {
                transform: scale(1.05);
                opacity: 0.8;
                filter: brightness(2);
                box-shadow: 0 0 25px rgba(255, 215, 0, 0.8);
            }
            75% {
                transform: scale(0.95);
                opacity: 0.6;
                filter: brightness(1.5);
                box-shadow: 0 0 35px rgba(255, 105, 180, 0.6);
            }
            100% {
                transform: scale(1);
                opacity: 1;
                filter: brightness(1);
                box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            }
        }

        .buttons {
            text-align: center;
            margin-top: 20px;
        }

        .btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 1.1em;
            cursor: pointer;
            margin: 5px;
            transition: transform 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .game-over {
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 15px;
            margin-top: 20px;
            display: none;
        }

        @media (max-width: 600px) {
            .game-title {
                font-size: 2em;
            }
            
            .gem {
                font-size: 1.2em;
            }
            
            .game-board {
                max-width: 350px;
                width: 90vw;
            }
            
            .game-container {
                width: 95%;
                padding: 15px;
            }
        }

        @media (max-width: 400px) {
            .game-container {
                padding: 15px;
                width: 98%;
                min-width: 300px;
            }
            
            .game-board {
                max-width: 300px;
                width: 85vw;
                gap: 2px;
                padding: 8px;
            }
            
            .gem {
                font-size: 1em;
            }
            
            .game-title {
                font-size: 1.8em;
            }
        }

        /* 博客嵌入样式优化 */
        @media (max-width: 768px) {
            body {
                padding: 10px;
                min-height: auto;
            }
            
            .game-container {
                margin: 10px auto;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            }
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <div class="game-container">
            <div class="game-header">
                <h1 class="game-title">✨ 消消乐 ✨</h1>
            </div>
            
            <div class="game-info">
                <div class="score">得分: <span id="score">0</span></div>
                <div class="moves">步数: <span id="moves">30</span></div>
            </div>
            
            <div class="game-board" id="gameBoard"></div>
            
            <div class="buttons">
                <button class="btn" onclick="resetGame()">重新开始</button>
                <button class="btn" onclick="showHint()">提示</button>
            </div>
            
            <div class="game-over" id="gameOver">
                <h2>游戏结束！</h2>
                <p>最终得分: <span id="finalScore">0</span></p>
                <button class="btn" onclick="resetGame()">再玩一次</button>
            </div>
        </div>
    </div>

    <script>
        class Match3Game {
            constructor() {
                this.board = [];
                this.size = 8;
                this.score = 0;
                this.moves = 30;
                this.selectedGem = null;
                this.gemTypes = ['💎', '💍', '🔮', '⭐', '🌟', '💫'];
                this.colors = ['red', 'blue', 'green', 'yellow', 'purple', 'orange'];
                this.isProcessing = false;
                
                this.initBoard();
                this.renderBoard();
            }

            initBoard() {
                this.board = [];
                for (let row = 0; row < this.size; row++) {
                    this.board[row] = [];
                    for (let col = 0; col < this.size; col++) {
                        let gemType;
                        do {
                            gemType = Math.floor(Math.random() * this.gemTypes.length);
                        } while (this.wouldCreateMatch(row, col, gemType));
                        
                        this.board[row][col] = gemType;
                    }
                }
            }

            wouldCreateMatch(row, col, gemType) {
                // 检查水平匹配
                let horizontalCount = 1;
                for (let c = col - 1; c >= 0 && this.board[row][c] === gemType; c--) horizontalCount++;
                for (let c = col + 1; c < this.size && this.board[row] && this.board[row][c] === gemType; c++) horizontalCount++;
                
                // 检查垂直匹配
                let verticalCount = 1;
                for (let r = row - 1; r >= 0 && this.board[r][col] === gemType; r--) verticalCount++;
                for (let r = row + 1; r < this.size && this.board[r] && this.board[r][col] === gemType; r++) verticalCount++;
                
                return horizontalCount >= 3 || verticalCount >= 3;
            }

            renderBoard() {
                const gameBoard = document.getElementById('gameBoard');
                gameBoard.innerHTML = '';
                
                for (let row = 0; row < this.size; row++) {
                    for (let col = 0; col < this.size; col++) {
                        const gem = document.createElement('div');
                        gem.className = `gem ${this.colors[this.board[row][col]]}`;
                        gem.textContent = this.gemTypes[this.board[row][col]];
                        gem.dataset.row = row;
                        gem.dataset.col = col;
                        
                        gem.addEventListener('click', () => this.handleGemClick(row, col));
                        
                        gameBoard.appendChild(gem);
                    }
                }
                
                this.updateUI();
            }

            handleGemClick(row, col) {
                if (this.isProcessing || this.moves <= 0) return;
                
                const clickedGem = document.querySelector(`[data-row="${row}"][data-col="${col}"]`);
                
                if (!this.selectedGem) {
                    this.selectedGem = { row, col };
                    clickedGem.classList.add('selected');
                } else {
                    if (this.selectedGem.row === row && this.selectedGem.col === col) {
                        // 取消选择
                        clickedGem.classList.remove('selected');
                        this.selectedGem = null;
                    } else if (this.isAdjacent(this.selectedGem, { row, col })) {
                        // 交换宝石
                        this.swapGems(this.selectedGem, { row, col });
                    } else {
                        // 选择新宝石
                        document.querySelector('.selected').classList.remove('selected');
                        this.selectedGem = { row, col };
                        clickedGem.classList.add('selected');
                    }
                }
            }

            isAdjacent(gem1, gem2) {
                const rowDiff = Math.abs(gem1.row - gem2.row);
                const colDiff = Math.abs(gem1.col - gem2.col);
                return (rowDiff === 1 && colDiff === 0) || (rowDiff === 0 && colDiff === 1);
            }

            swapGems(gem1, gem2) {
                // 交换宝石
                const temp = this.board[gem1.row][gem1.col];
                this.board[gem1.row][gem1.col] = this.board[gem2.row][gem2.col];
                this.board[gem2.row][gem2.col] = temp;
                
                // 检查是否有匹配
                const matches = this.findMatches();
                
                if (matches.length > 0) {
                    this.moves--;
                    this.clearSelection();
                    this.processMatches();
                } else {
                    // 如果没有匹配，交换回来
                    const temp = this.board[gem1.row][gem1.col];
                    this.board[gem1.row][gem1.col] = this.board[gem2.row][gem2.col];
                    this.board[gem2.row][gem2.col] = temp;
                    this.clearSelection();
                }
                
                this.renderBoard();
            }

            clearSelection() {
                this.selectedGem = null;
                const selected = document.querySelector('.selected');
                if (selected) selected.classList.remove('selected');
            }

            findMatches() {
                const matches = [];
                
                // 检查水平匹配
                for (let row = 0; row < this.size; row++) {
                    let count = 1;
                    let currentType = this.board[row][0];
                    
                    for (let col = 1; col < this.size; col++) {
                        if (this.board[row][col] === currentType) {
                            count++;
                        } else {
                            if (count >= 3) {
                                for (let c = col - count; c < col; c++) {
                                    matches.push({ row, col: c });
                                }
                            }
                            count = 1;
                            currentType = this.board[row][col];
                        }
                    }
                    
                    if (count >= 3) {
                        for (let c = this.size - count; c < this.size; c++) {
                            matches.push({ row, col: c });
                        }
                    }
                }
                
                // 检查垂直匹配
                for (let col = 0; col < this.size; col++) {
                    let count = 1;
                    let currentType = this.board[0][col];
                    
                    for (let row = 1; row < this.size; row++) {
                        if (this.board[row][col] === currentType) {
                            count++;
                        } else {
                            if (count >= 3) {
                                for (let r = row - count; r < row; r++) {
                                    matches.push({ row: r, col });
                                }
                            }
                            count = 1;
                            currentType = this.board[row][col];
                        }
                    }
                    
                    if (count >= 3) {
                        for (let r = this.size - count; r < this.size; r++) {
                            matches.push({ row: r, col });
                        }
                    }
                }
                
                return matches;
            }

            async processMatches() {
                this.isProcessing = true;
                
                while (true) {
                    const matches = this.findMatches();
                    if (matches.length === 0) break;
                    
                    // 创建粒子效果和多样化的消除动画
                    await this.animateMatches(matches);
                    
                    // 计算得分
                    this.score += matches.length * 10;
                    
                    // 移除匹配的宝石
                    matches.forEach(match => {
                        this.board[match.row][match.col] = null;
                    });
                    
                    // 下落宝石
                    this.dropGems();
                    
                    // 填充新宝石
                    this.fillBoard();
                    
                    this.renderBoard();
                    await this.delay(300);
                }
                
                this.isProcessing = false;
                this.checkGameOver();
            }

            async animateMatches(matches) {
                // 为不同数量的匹配使用不同的动画效果
                const animationTypes = ['matching', 'exploding', 'spark'];
                const matchCount = matches.length;
                
                // 根据匹配数量选择动画类型
                let animationType = 'matching';
                if (matchCount >= 5) {
                    animationType = 'exploding';
                } else if (matchCount >= 4) {
                    animationType = 'spark';
                }
                
                // 分批添加动画效果，创造连锁反应
                const batches = this.groupMatchesByDistance(matches);
                
                for (let batchIndex = 0; batchIndex < batches.length; batchIndex++) {
                    const batch = batches[batchIndex];
                    
                    batch.forEach((match, index) => {
                        setTimeout(() => {
                            const gem = document.querySelector(`[data-row="${match.row}"][data-col="${match.col}"]`);
                            if (gem) {
                                gem.classList.add(animationType);
                                // 添加粒子效果
                                this.createParticleEffect(gem, match.row, match.col);
                            }
                        }, index * 50); // 每个宝石间隔50ms
                    });
                    
                    // 等待这批动画完成
                    await this.delay(300 + batch.length * 50);
                }
                
                // 额外等待所有动画完成
                await this.delay(400);
            }

            groupMatchesByDistance(matches) {
                // 根据位置距离将匹配分组，创造波浪式消除效果
                const batches = [];
                const processed = new Set();
                
                matches.forEach(match => {
                    const key = `${match.row}-${match.col}`;
                    if (processed.has(key)) return;
                    
                    const batch = [match];
                    processed.add(key);
                    
                    // 找到相邻的匹配
                    matches.forEach(otherMatch => {
                        const otherKey = `${otherMatch.row}-${otherMatch.col}`;
                        if (processed.has(otherKey)) return;
                        
                        const distance = Math.abs(match.row - otherMatch.row) + Math.abs(match.col - otherMatch.col);
                        if (distance <= 2) {
                            batch.push(otherMatch);
                            processed.add(otherKey);
                        }
                    });
                    
                    batches.push(batch);
                });
                
                return batches;
            }

            createParticleEffect(gemElement, row, col) {
                const rect = gemElement.getBoundingClientRect();
                const gameBoard = document.getElementById('gameBoard');
                const boardRect = gameBoard.getBoundingClientRect();
                
                // 创建多个粒子
                for (let i = 0; i < 6; i++) {
                    const particle = document.createElement('div');
                    particle.style.position = 'absolute';
                    particle.style.left = (rect.left - boardRect.left + rect.width / 2) + 'px';
                    particle.style.top = (rect.top - boardRect.top + rect.height / 2) + 'px';
                    particle.style.width = '4px';
                    particle.style.height = '4px';
                    particle.style.background = this.getRandomColor();
                    particle.style.borderRadius = '50%';
                    particle.style.pointerEvents = 'none';
                    particle.style.zIndex = '1000';
                    
                    const angle = (i * 60) * Math.PI / 180;
                    const velocity = 30 + Math.random() * 20;
                    const vx = Math.cos(angle) * velocity;
                    const vy = Math.sin(angle) * velocity;
                    
                    particle.style.transform = `translate(${vx}px, ${vy}px)`;
                    particle.style.opacity = '0';
                    particle.style.transition = 'all 0.8s ease-out';
                    
                    gameBoard.appendChild(particle);
                    
                    // 立即触发动画
                    setTimeout(() => {
                        particle.style.transform = `translate(${vx * 2}px, ${vy * 2 + 50}px)`;
                        particle.style.opacity = '1';
                    }, 10);
                    
                    // 清理粒子
                    setTimeout(() => {
                        if (particle.parentNode) {
                            particle.parentNode.removeChild(particle);
                        }
                    }, 800);
                }
            }

            getRandomColor() {
                const colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#96ceb4', '#feca57', '#ff9ff3'];
                return colors[Math.floor(Math.random() * colors.length)];
            }

            dropGems() {
                for (let col = 0; col < this.size; col++) {
                    let writePos = this.size - 1;
                    
                    for (let row = this.size - 1; row >= 0; row--) {
                        if (this.board[row][col] !== null) {
                            this.board[writePos][col] = this.board[row][col];
                            if (writePos !== row) {
                                this.board[row][col] = null;
                            }
                            writePos--;
                        }
                    }
                }
            }

            fillBoard() {
                for (let col = 0; col < this.size; col++) {
                    for (let row = 0; row < this.size; row++) {
                        if (this.board[row][col] === null) {
                            this.board[row][col] = Math.floor(Math.random() * this.gemTypes.length);
                        }
                    }
                }
            }

            delay(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            }

            updateUI() {
                document.getElementById('score').textContent = this.score;
                document.getElementById('moves').textContent = this.moves;
            }

            checkGameOver() {
                if (this.moves <= 0) {
                    document.getElementById('finalScore').textContent = this.score;
                    document.getElementById('gameOver').style.display = 'block';
                }
            }

            showHint() {
                // 简单的提示功能
                for (let row = 0; row < this.size; row++) {
                    for (let col = 0; col < this.size - 1; col++) {
                        // 尝试水平交换
                        const temp = this.board[row][col];
                        this.board[row][col] = this.board[row][col + 1];
                        this.board[row][col + 1] = temp;
                        
                        if (this.findMatches().length > 0) {
                            // 找到可能的移动，闪烁提示
                            const gem1 = document.querySelector(`[data-row="${row}"][data-col="${col}"]`);
                            const gem2 = document.querySelector(`[data-row="${row}"][data-col="${col + 1}"]`);
                            gem1.style.animation = 'none';
                            gem2.style.animation = 'none';
                            setTimeout(() => {
                                gem1.style.animation = 'match 1s ease-in-out infinite';
                                gem2.style.animation = 'match 1s ease-in-out infinite';
                                setTimeout(() => {
                                    gem1.style.animation = '';
                                    gem2.style.animation = '';
                                }, 2000);
                            }, 10);
                            
                            // 交换回来
                            this.board[row][col + 1] = this.board[row][col];
                            this.board[row][col] = temp;
                            return;
                        }
                        
                        // 交换回来
                        this.board[row][col + 1] = this.board[row][col];
                        this.board[row][col] = temp;
                    }
                }
            }
        }

        let game;

        function initGame() {
            game = new Match3Game();
        }

        function resetGame() {
            document.getElementById('gameOver').style.display = 'none';
            initGame();
        }

        function showHint() {
            if (game && !game.isProcessing) {
                game.showHint();
            }
        }

        // 初始化游戏
        window.onload = initGame;
    </script>
</body>
</html>
