<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 主背景渐变 - 更加丰富的层次 -->
    <radialGradient id="mainGradient" cx="25%" cy="35%" r="90%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#ff8e8e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </radialGradient>
    
    <!-- 大型装饰球体渐变 -->
    <radialGradient id="sphereGradient1" cx="30%" cy="25%" r="80%">
      <stop offset="0%" style="stop-color:#fde047;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#facc15;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#eab308;stop-opacity:0.1" />
    </radialGradient>
    
    <radialGradient id="sphereGradient2" cx="35%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#f472b6;stop-opacity:0.7" />
      <stop offset="50%" style="stop-color:#ec4899;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#be185d;stop-opacity:0.1" />
    </radialGradient>
    
    <radialGradient id="sphereGradient3" cx="40%" cy="35%" r="75%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:0.6" />
      <stop offset="50%" style="stop-color:#06b6d4;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:0.1" />
    </radialGradient>
    
    <radialGradient id="sphereGradient4" cx="45%" cy="40%" r="65%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:0.5" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.1" />
    </radialGradient>
    
    <!-- 玻璃效果卡片渐变 -->
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.25" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.05" />
    </linearGradient>
    
    <!-- 边框渐变 -->
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.6" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.4" />
    </linearGradient>
    
    <!-- 各种模糊滤镜 -->
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12"/>
    </filter>
    
    <filter id="mediumBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6"/>
    </filter>
    
    <filter id="lightBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3"/>
    </filter>
    
    <!-- 发光效果 -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 主背景 -->
  <rect width="1200" height="630" fill="url(#mainGradient)"/>
  
  <!-- 大型背景装饰球体 -->
  <ellipse cx="180" cy="120" rx="150" ry="130" fill="url(#sphereGradient1)" filter="url(#softBlur)"/>
  <ellipse cx="980" cy="450" rx="160" ry="140" fill="url(#sphereGradient2)" filter="url(#softBlur)"/>
  <ellipse cx="1080" cy="100" rx="110" ry="95" fill="url(#sphereGradient3)" filter="url(#softBlur)"/>
  <ellipse cx="750" cy="520" rx="120" ry="100" fill="url(#sphereGradient4)" filter="url(#softBlur)"/>
  
  <!-- 中层装饰元素 -->
  <circle cx="400" cy="80" r="60" fill="rgba(255,255,255,0.15)" filter="url(#mediumBlur)"/>
  <circle cx="850" cy="150" r="45" fill="rgba(255,255,255,0.12)" filter="url(#mediumBlur)"/>
  <circle cx="120" cy="450" r="40" fill="rgba(255,255,255,0.18)" filter="url(#mediumBlur)"/>
  <circle cx="1150" cy="380" r="35" fill="rgba(255,255,255,0.14)" filter="url(#mediumBlur)"/>
  
  <!-- 小装饰点和光斑 -->
  <circle cx="320" cy="200" r="15" fill="rgba(255,255,255,0.4)" filter="url(#lightBlur)"/>
  <circle cx="680" cy="100" r="12" fill="rgba(255,255,255,0.5)" filter="url(#lightBlur)"/>
  <circle cx="200" cy="350" r="8" fill="rgba(255,255,255,0.6)"/>
  <circle cx="950" cy="280" r="10" fill="rgba(255,255,255,0.4)"/>
  <circle cx="550" cy="480" r="6" fill="rgba(255,255,255,0.7)"/>
  <circle cx="1050" cy="250" r="7" fill="rgba(255,255,255,0.5)"/>
  
  <!-- 增强的星光效果 -->
  <g fill="rgba(255,255,255,0.9)" filter="url(#glow)">
    <polygon points="480,90 483,103 496,106 483,109 480,122 477,109 464,106 477,103"/>
    <polygon points="820,160 822,170 832,172 822,174 820,184 818,174 808,172 818,170"/>
    <polygon points="300,280 301,286 807,287 301,288 300,294 299,288 293,287 299,286"/>
    <polygon points="1080,320 1081,325 1086,326 1081,327 1080,332 1079,327 1074,326 1079,325"/>
    <polygon points="150,250 151,254 155,255 151,256 150,260 149,256 145,255 149,254"/>
  </g>
  
  <!-- 流动的装饰曲线 -->
  <path d="M 0,250 Q 200,180 400,220 T 800,200 Q 1000,180 1200,220" stroke="rgba(255,255,255,0.15)" stroke-width="3" fill="none" filter="url(#lightBlur)"/>
  <path d="M 0,400 Q 300,330 600,380 T 1200,360" stroke="rgba(255,255,255,0.12)" stroke-width="2" fill="none" filter="url(#lightBlur)"/>
  <path d="M 0,520 Q 400,470 800,510 T 1200,490" stroke="rgba(255,255,255,0.08)" stroke-width="4" fill="none" filter="url(#lightBlur)"/>
  
  <!-- 主内容卡片 - 玻璃形态效果 -->
  <rect x="200" y="180" width="800" height="270" fill="url(#cardGradient)" rx="30" ry="30" filter="url(#lightBlur)"/>
  <rect x="200" y="180" width="800" height="270" fill="none" stroke="url(#borderGradient)" stroke-width="2" rx="30" ry="30"/>
  
  <!-- 卡片内部装饰线条 -->
  <rect x="250" y="230" width="120" height="4" fill="rgba(255,255,255,0.7)" rx="2"/>
  <rect x="250" y="240" width="80" height="2" fill="rgba(255,255,255,0.5)" rx="1"/>
  
  <!-- 文本区域装饰线条 -->
  <rect x="250" y="370" width="500" height="2" fill="rgba(255,255,255,0.4)" rx="1"/>
  <rect x="250" y="385" width="420" height="2" fill="rgba(255,255,255,0.35)" rx="1"/>
  <rect x="250" y="400" width="350" height="2" fill="rgba(255,255,255,0.3)" rx="1"/>
  <rect x="250" y="415" width="280" height="2" fill="rgba(255,255,255,0.25)" rx="1"/>
  
  <!-- 主标题 -->
  <text x="600" y="310" text-anchor="middle" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="48" font-weight="800" fill="rgba(255,255,255,0.95)" filter="url(#glow)">
    我的博客
  </text>
  
  <!-- 副标题 -->
  <text x="600" y="350" text-anchor="middle" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="rgba(255,255,255,0.8)">
    探索思想的边界 · 记录成长的足迹 · 分享知识的力量
  </text>
  
  <!-- 装饰性几何图形 -->
  <g opacity="0.3">
    <polygon points="950,200 970,220 950,240 930,220" fill="rgba(255,255,255,0.6)" filter="url(#lightBlur)"/>
    <polygon points="280,400 300,415 280,430 260,415" fill="rgba(255,255,255,0.5)" filter="url(#lightBlur)"/>
  </g>
  
  <!-- 额外光效装饰 -->
  <ellipse cx="600" cy="315" rx="400" ry="50" fill="rgba(255,255,255,0.05)" filter="url(#softBlur)"/>
  
</svg>