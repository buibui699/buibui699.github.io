<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <!-- 渐变定义 -->
  <defs>
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shadowGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.3" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 阴影 -->
  <rect x="2" y="4" width="196" height="54" rx="12" ry="12" fill="url(#shadowGradient)" opacity="0.3"/>
  
  <!-- 主卡片背景 -->
  <rect x="0" y="2" width="196" height="54" rx="12" ry="12" fill="url(#cardGradient)" stroke="#ffffff" stroke-width="1" opacity="0.95"/>
  
  <!-- 内层高光 -->
  <rect x="2" y="4" width="192" height="50" rx="10" ry="10" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  
  <!-- 装饰圆点 -->
  <circle cx="15" cy="18" r="3" fill="#ffd700" opacity="0.8" filter="url(#glow)"/>
  <circle cx="25" cy="18" r="2" fill="#ff6b9d" opacity="0.8"/>
  <circle cx="33" cy="18" r="2.5" fill="#4ecdc4" opacity="0.8"/>
  
  <!-- 主文本 -->
  <text x="98" y="25" font-family="'Arial', '微软雅黑', sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" filter="url(#glow)">
    biubiu-下班啦
  </text>
  
  <!-- 表情符号 -->
  <text x="98" y="45" font-family="'Arial', sans-serif" font-size="18" fill="#ffd700" text-anchor="middle" filter="url(#glow)">
    ╰(*°▽°*)╯
  </text>
  
  <!-- 右侧装饰星星 -->
  <polygon points="180,15 182,19 186,19 183,22 184,26 180,24 176,26 177,22 174,19 178,19" fill="#ffd700" opacity="0.7"/>
  <polygon points="185,35 186,37 188,37 187,38 187,40 185,39 183,40 183,38 182,37 184,37" fill="#ff6b9d" opacity="0.6"/>
</svg>