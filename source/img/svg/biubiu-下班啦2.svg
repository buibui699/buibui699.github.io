<svg xmlns="http://www.w3.org/2000/svg" width="215" height="36" font-family="'Poppins', 'Helvetica Neue', 'Arial', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
  <title>biubiu-下班啦╰(*°▽°*)╯</title>
  <defs>
    <linearGradient id="hipCardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#76DBFF;stop-opacity:1"></stop> <stop offset="100%" style="stop-color:#B39DFF;stop-opacity:1"></stop> </linearGradient>
    <filter id="sleekShadow" height="150%" width="140%" x="-20%" y="-20%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"></feGaussianBlur>
      <feOffset dx="1.5" dy="1.5" in="blur" result="offsetBlur"></feOffset>
      <feFlood flood-color="#000000" flood-opacity="0.12" result="offsetColor"></feFlood>
      <feComposite in="offsetColor" in2="offsetBlur" operator="in" result="offsetShadow"></feComposite>
      <feMerge>
        <feMergeNode in="offsetShadow"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="213" height="34" rx="7" ry="7" fill="url(#hipCardGradient)" stroke="rgba(255,255,255,0.3)" stroke-width="0.8" style="filter: url(#sleekShadow);"></rect>

  <g id="coffee-icon" transform="translate(12, 10)"> <path d="M0,1.5 C0,0.5 0.5,0 1.5,0 H10.5 C11.5,0 12,0.5 12,1.5 V7.5 C12,8.5 11.5,9 10.5,9 H1.5 C0.5,9 0,8.5 0,7.5 V1.5 Z" fill="#FFFFFF"></path>
    <path d="M12,2.5 C14,2.5 14,6.5 12,6.5" stroke="#FFFFFF" stroke-width="1.8" fill="none" stroke-linecap="round"></path>
    <path d="M3.5,0 Q4,-1.8 4.8,-0.5" stroke="rgba(255,255,255,0.8)" stroke-width="1.2" fill="none" stroke-linecap="round" transform="translate(0,-1.2)"></path>
    <path d="M7,0 Q7.5,-1.8 8.3,-0.5" stroke="rgba(255,255,255,0.8)" stroke-width="1.2" fill="none" stroke-linecap="round" transform="translate(0,-2.2)"></path>
  </g>

  <text x="36" y="22.5" font-size="13px" fill="#FFFFFF" font-weight="600">biubiu</text>

  <line x1="85" y1="9" x2="85" y2="27" stroke="rgba(255,255,255,0.5)" stroke-width="1"></line>

  <text x="97" y="22.5" font-size="13px" fill="#FFFFFF" font-weight="500">下班啦╰(*°▽°*)╯</text>

</svg>