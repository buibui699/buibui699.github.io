# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: 辋川のBlog
subtitle: '欢迎来到辋川的博客'
description: '于比特之海中构建属于自己的岛屿，用文字丈量思考的深度，用分享连接有趣的灵魂。这里是我的思考记录本，也是与世界对话的窗口'
keywords: Hexo, 博客, 技术, 分享, 学习笔记 # 修改为您的博客关键词，用逗号分隔
author: 辋川
language: zh-CN
timezone: 'Asia/Shanghai'

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: http://example.com
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render: 

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: 作者很懒哦~尚未分类
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

#envelope_comment
#seehttps://akilar.top/posts/e2d3c450/
envelope_comment:
  enable: true #控制开关
  custom_pic:
    cover: https://npm.elemecdn.com/hexo-butterfly-envelope/lib/violet.jpg #信笺头部图片
    line: https://npm.elemecdn.com/hexo-butterfly-envelope/lib/line.png #信笺底部图片
    beforeimg: https://npm.elemecdn.com/hexo-butterfly-envelope/lib/before.png # 信封前半部分
    afterimg: https://npm.elemecdn.com/hexo-butterfly-envelope/lib/after.png # 信封后半部分
  message: #信笺正文，多行文本，写法如下
    - 有什么想问的？
    - 有什么想说的？
    - 有什么想吐槽的？
    - 哪怕是有什么想吃的，都可以告诉我哦~
  bottom: 自动书记人偶竭诚为您服务！ #仅支持单行文本
  height: #1024px，信封划出的高度
  path: #【可选】comments 的路径名称。默认为 comments，生成的页面为 comments/index.html
  front_matter: #【可选】comments页面的 front_matter 配置
    title: 留言板
    comments: true
    top_img: false
    type: envelope


# 追番插件
# 插件的 GitHub 仓库地址，方便查找文档和更新
# https://github.com/HCLonely/hexo-bilibili-bangumi

bangumi: # 追番插件的全局配置命名空间
  enable: true # 是否启用追番插件功能。true 为启用，false 为禁用。
  source: bili # 数据源选择。'bili' 指的是从 Bilibili 获取数据。目前似乎只支持 'bili'。
  path: # 生成的追番页面的路径。如果留空，插件会使用默认路径 (通常是 /bangumis/index.html 或类似)。
  vmid: 372204786 # 你的 Bilibili 用户 UID (User ID)。插件会根据这个 UID 获取你的追番列表。
  title: "追番列表" # 在生成的追番页面上显示的标题。
  quote: "生命不息，追番不止！" # 显示在追番页面顶部的一句引言或座右铭。
  show: 1 # 要显示的追番类型。根据插件文档：0 (全部番剧), 1 (想看), 2 (在看), 3 (看过)。默认为 0。这里设置为 1，表示显示"想看"的番剧。
  lazyload: false # 是否启用图片懒加载。false 表示不启用，图片会立即加载。true 表示启用，图片会滚动到可视区域再加载。
  loading: # 图片加载时的占位符图片或加载动画的 URL。如果 lazyload 为 true，这个选项会比较有用。留空则使用插件默认。
  showMyComment: false # 是否在番剧条目下方显示你对该番剧的评论。false 表示不显示。
  pagination: false # 是否对追番列表启用分页。false 表示不分页，所有番剧显示在一页。如果番剧数量很多，建议开启。
  metaColor: # 番剧信息（如观看进度、标签等）的文字颜色。留空则使用插件默认颜色。可以设置为如 "#FF0000" 的十六进制颜色码。
  color: # 追番页面主要元素的强调色或主题色。留空则使用插件默认颜色。
  webp: # 是否优先使用 webp 格式的封面图片（如果B站CDN提供）。某些插件可能支持此选项以优化图片大小。留空则根据插件默认行为。
  progress: # 关于观看进度的显示设置。留空可能表示使用默认设置（例如，是否显示进度条，进度条颜色等）。具体配置需查阅插件文档。
  extraOrder: # 额外的排序方式。例如，可以自定义排序字段和顺序。留空则使用B站的默认排序或插件的默认排序。
  proxy: # 代理服务器设置，如果你的网络环境需要通过代理才能访问 Bilibili API。
    host: "代理host" # 代理服务器的主机名或 IP 地址。
    port: "代理端口" # 代理服务器的端口号。
  extra_options: # 额外的、可能不常用或特定主题才支持的自定义选项。
    top_img: false # 是否在追番页面顶部显示一个背景大图（banner）。false 表示不显示。
    lazyload: # 针对 extra_options 内的懒加载特定设置，可能会覆盖全局的 lazyload 设置或提供更细致的控制。
      enable: false # 是否启用此处的懒加载设置。这里设置为 false，与全局的 lazyload: false 效果上可能一致，具体看插件实现逻辑。



# APlayer
# https://github.com/MoePlayer/hexo-tag-aplayer/blob/master/docs/README-zh_cn.md
aplayer:
  meting: true
  asset_inject: true

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: anzhiyu

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: git
  repository: git@github.com:buibui699/buibui699.github.io.git
  branch: gh-pages
